# yaml-language-server: $schema=../../deploy/config/themis.schema.json
#
# Configuration for `make run`: themis-core on your machine against the local
# kind cluster. The tokens are generated by `make run` into bin/dev/.

enrolledNamespaces:
  - default
  - shop

intake:
  bearerTokenFile: bin/dev/intake-token

investigators:
  bearerTokenFile: bin/dev/investigator-token

api:
  bearerTokenFile: bin/dev/admin-token
  # Themis serves nothing until an admin account exists: this one is created
  # at startup. Sign in as dev with the password in bin/dev/admin-password.
  adminAccount:
    username: dev
    passwordFile: bin/dev/admin-password

executor:
  address: 127.0.0.1:9091
  bearerTokenFile: bin/dev/executor-token

# The profiles are the scenario packs' (scenarios/), as shipped: a profile
# here named like a pack's would replace it entirely.
