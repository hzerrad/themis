# yaml-language-server: $schema=../../deploy/config/themis.schema.json
#
# Configuration for `make run`: themis-core on your machine against the local
# kind cluster. The tokens are generated by `make run` into bin/dev/.

enrolledNamespaces:
  - default
  - shop

intake:
  bearerTokenFile: bin/dev/intake-token

investigators:
  bearerTokenFile: bin/dev/investigator-token

api:
  bearerTokenFile: bin/dev/admin-token

executor:
  address: 127.0.0.1:9091
  bearerTokenFile: bin/dev/executor-token

profiles:
  - name: rollout-regression
    priority: 100
    match:
      alertNames:
        - KubePodCrashLooping
        - KubeDeploymentReplicasMismatch
        - KubePodOOMKilled
      targetKinds:
        - Deployment.apps
    evidence:
      initial: [rollout_history, pod_states, target_events]
      allowed: [rollout_history, pod_states, target_events, container_logs_tail]
    capabilities: [deployment.rollback-to-revision]
    policy:
      mode: guarded
      approvalTimeout: 30m
      rules:
        - name: rollback-needs-a-bad-rollout
          when: >-
            action.capability == "deployment.rollback-to-revision" && action.restore != "true" &&
            (predicates.rollout_recent != "true" ||
             predicates.failure_onset_after_rollout != "true" ||
             predicates.config_changed_before_failure != "false" ||
             (predicates.oom_killed_new_revision != "true" &&
              predicates.prior_revision_was_healthy != "true"))
          decision: deny
        - name: rollback-needs-approval
          when: action.capability == "deployment.rollback-to-revision" && action.restore != "true"
          decision: require_approval
    verification:
      window: 5m
      stability: 2m
