# How the kind cluster's alerting rules differ from those Themis ships, in
# internal/incident/intake/rules/rules.yaml: faster, so a demo moves at a
# watchable pace. make gen writes rules.yaml, next to this file, from both.
#
#   for:     how long the condition holds before the alert fires
#   windows: range windows of the expression, shortened
#   expr:    another expression, only with the reason
#
# An alert not named here keeps the shipped rule as it is.

KubePodCrashLooping:
  for: 30s
  # It ends 2 minutes after the pod recovers, not 5.
  windows: {5m: 2m}

KubeDeploymentReplicasMismatch:
  for: 1m
  windows: {10m: 5m}

KubePodNotReady:
  for: 1m
  # Only pods that are pending, unknown or failed. A crash-looping pod is
  # running and not ready, and with a minute's wait the shipped rule would
  # open a second incident in every crash demo, a minute after
  # KubePodCrashLooping. Shipped, both wait 15 minutes.
  expr: |-
    sum by (namespace, pod, cluster) (
      max by (namespace, pod, cluster) (kube_pod_status_phase{phase=~"Pending|Unknown|Failed"})
      * on (namespace, pod, cluster) group_left (owner_kind) topk by (namespace, pod, cluster) (
        1, max by (namespace, pod, owner_kind, cluster) (kube_pod_owner{owner_kind!="Job"})
      )
    ) > 0

KubeContainerWaiting:
  for: 1m

KubeDeploymentRolloutStuck:
  for: 1m

CPUThrottlingHigh:
  # Themis reads CPU use over the last 5 minutes: the alert waits until the
  # throttling has lasted most of them. Shipped, 15 minutes covers them too.
  for: 4m
