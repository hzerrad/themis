# Generated by make gen from internal/incident/intake/rules/rules.yaml and
# scripts/dev/monitoring/fast.yaml: edit those. The alerting rules make
# monitoring-up installs on kind.
serverFiles:
  alerting_rules.yml:
    groups:
    - name: themis
      rules:
      - alert: KubePodOOMKilled
        annotations:
          description: Container {{ $labels.container }} of pod {{ $labels.namespace
            }}/{{ $labels.pod }} was OOMKilled and restarted in the last 10 minutes.
          summary: A container ran out of memory.
        expr: |-
          kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1
          and on (namespace, pod, container)
          changes(kube_pod_container_status_restarts_total[10m]) > 0
        labels:
          severity: warning
    - name: themis-standard
      rules:
      - alert: KubePodCrashLooping
        annotations:
          description: Pod {{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container
            }}) is in waiting state (reason "CrashLoopBackOff").
          summary: Pod is crash looping.
        expr: max_over_time(kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"}[2m])
          >= 1
        for: 30s
        labels:
          severity: warning
      - alert: KubePodNotReady
        annotations:
          description: Pod {{ $labels.namespace }}/{{ $labels.pod }} has been in a
            non-ready state.
          summary: Pod has been in a non-ready state.
        expr: |-
          sum by (namespace, pod, cluster) (
            max by (namespace, pod, cluster) (kube_pod_status_phase{phase=~"Pending|Unknown|Failed"})
            * on (namespace, pod, cluster) group_left (owner_kind) topk by (namespace, pod, cluster) (
              1, max by (namespace, pod, owner_kind, cluster) (kube_pod_owner{owner_kind!="Job"})
            )
          ) > 0
        for: 1m
        labels:
          severity: warning
      - alert: KubeDeploymentReplicasMismatch
        annotations:
          description: Deployment {{ $labels.namespace }}/{{ $labels.deployment }}
            has not matched the expected number of replicas.
          summary: Deployment has not matched the expected number of replicas.
        expr: |-
          (
            kube_deployment_spec_replicas > kube_deployment_status_replicas_available
          ) and (
            changes(kube_deployment_status_replicas_updated[5m]) == 0
          )
        for: 1m
        labels:
          severity: warning
      - alert: KubeDeploymentRolloutStuck
        annotations:
          description: Rollout of deployment {{ $labels.namespace }}/{{ $labels.deployment
            }} is not progressing.
          summary: Deployment rollout is not progressing.
        expr: kube_deployment_status_condition{condition="Progressing", status="false"}
          != 0
        for: 1m
        labels:
          severity: warning
      - alert: KubeContainerWaiting
        annotations:
          description: Container {{ $labels.container }} of pod {{ $labels.namespace
            }}/{{ $labels.pod }} has been waiting.
          summary: Pod container is waiting.
        expr: sum by (namespace, pod, container, cluster) (kube_pod_container_status_waiting_reason{reason!="CrashLoopBackOff"})
          > 0
        for: 1m
        labels:
          severity: warning
      - alert: CPUThrottlingHigh
        annotations:
          description: '{{ $value | humanizePercentage }} throttling of CPU in namespace
            {{ $labels.namespace }} for container {{ $labels.container }} in pod {{
            $labels.pod }}.'
          summary: Processes experience elevated CPU throttling.
        expr: |-
          sum without (id, metrics_path, name, image, endpoint, job, node) (
            topk by (cluster, namespace, pod, container, instance) (1,
              increase(container_cpu_cfs_throttled_periods_total{container!=""}[5m])
            )
          )
          / on (cluster, namespace, pod, container, instance) group_left
          sum without (id, metrics_path, name, image, endpoint, job, node) (
            topk by (cluster, namespace, pod, container, instance) (1,
              increase(container_cpu_cfs_periods_total[5m])
            )
          )
          > (25 / 100)
        for: 4m
        labels:
          severity: info
