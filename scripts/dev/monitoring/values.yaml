# Prometheus, kube-state-metrics and Alertmanager for the kind cluster.
# rules.yaml, next to this file, adds every alert a scenario pack answers:
# the rules Themis ships, faster, as fast.yaml says, so a demo moves at a
# watchable pace. Themis reads the alerts from Alertmanager's API, so
# Alertmanager sends them nowhere, and the containers' memory and CPU figures
# from this Prometheus. Install this before Themis, and the chart finds
# Alertmanager.
server:
  global:
    scrape_interval: 15s
    evaluation_interval: 15s
  persistentVolume:
    enabled: false

alertmanager:
  enabled: true
  persistence:
    enabled: false
  config:
    route:
      receiver: none
    receivers:
      - name: none

kube-state-metrics:
  enabled: true
prometheus-node-exporter:
  enabled: false
prometheus-pushgateway:
  enabled: false
