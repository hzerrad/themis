# Prometheus, kube-state-metrics and Alertmanager for the kind cluster, with
# every alert a scenario pack answers. The rules are kube-prometheus-stack's,
# and the labels they carry, but fast enough to watch: KubePodCrashLooping
# fires after 30s, not 15m. Themis reads the alerts from Alertmanager's API,
# so Alertmanager sends them nowhere, and the containers' memory and CPU
# figures from this Prometheus. Install this before Themis, and the chart
# finds Alertmanager.
server:
  global:
    scrape_interval: 15s
    evaluation_interval: 15s
  persistentVolume:
    enabled: false

serverFiles:
  alerting_rules.yml:
    groups:
      - name: themis-demo
        rules:
          # rollout-regression, oom-limit-too-low, probe-restart-storm.
          - alert: KubePodCrashLooping
            expr: max_over_time(kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"}[2m]) >= 1
            for: 30s
            labels:
              severity: warning
            annotations:
              summary: Pod is crash looping.
              description: Pod {{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }}) is in CrashLoopBackOff.
          # rollout-regression, oom-limit-too-low. kube-prometheus-stack has no
          # rule for it: a container whose last end was an OOM kill, and
          # that restarted in the last 10 minutes.
          - alert: KubePodOOMKilled
            expr: |
              kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1
                and on (namespace, pod, container)
              changes(kube_pod_container_status_restarts_total[10m]) > 0
            for: 30s
            labels:
              severity: warning
            annotations:
              summary: Container was OOMKilled.
              description: Container {{ $labels.container }} of pod {{ $labels.namespace }}/{{ $labels.pod }} was OOMKilled and restarted.
          # rollout-regression.
          - alert: KubeDeploymentReplicasMismatch
            expr: |
              (kube_deployment_spec_replicas > kube_deployment_status_replicas_available)
                and (changes(kube_deployment_status_replicas_updated[5m]) == 0)
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: Deployment has not matched the expected number of replicas.
              description: Deployment {{ $labels.namespace }}/{{ $labels.deployment }} has not matched the expected number of replicas.
          # probe-restart-storm, stuck-pods. Pods of a workload, not a Job,
          # that are pending, unknown or failed.
          - alert: KubePodNotReady
            expr: |
              sum by (namespace, pod) (
                max by (namespace, pod) (kube_pod_status_phase{phase=~"Pending|Unknown|Failed"})
                  * on (namespace, pod) group_left (owner_kind)
                topk by (namespace, pod) (1, max by (namespace, pod, owner_kind) (kube_pod_owner{owner_kind!="Job"}))
              ) > 0
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: Pod has been in a non-ready state.
              description: Pod {{ $labels.namespace }}/{{ $labels.pod }} has been in a non-ready state.
          # stuck-pods. By container, not reason: one that can't pull its
          # image alternates between ErrImagePull and ImagePullBackOff.
          - alert: KubeContainerWaiting
            expr: sum by (namespace, pod, container) (kube_pod_container_status_waiting_reason{reason!="CrashLoopBackOff"}) > 0
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: Pod container is waiting.
              description: Container {{ $labels.container }} of pod {{ $labels.namespace }}/{{ $labels.pod }} is waiting.
          # stuck-pods.
          - alert: KubeDeploymentRolloutStuck
            expr: kube_deployment_status_condition{condition="Progressing", status="false"} != 0
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: Deployment rollout is not progressing.
              description: Rollout of deployment {{ $labels.namespace }}/{{ $labels.deployment }} is not progressing.
          # cpu-throttling. Themis reads CPU use over the last 5 minutes, so
          # the alert waits until the throttling has lasted most of them.
          - alert: CPUThrottlingHigh
            expr: |
              sum(increase(container_cpu_cfs_throttled_periods_total{container!=""}[5m])) without (id, metrics_path, name, image, endpoint, job, node)
                / on (namespace, pod, container, instance) group_left
              sum(increase(container_cpu_cfs_periods_total[5m])) without (id, metrics_path, name, image, endpoint, job, node)
                > 0.25
            for: 4m
            labels:
              severity: info
            annotations:
              summary: Processes experience elevated CPU throttling.
              description: '{{ $value | humanizePercentage }} throttling of CPU in namespace {{ $labels.namespace }} for container {{ $labels.container }} in pod {{ $labels.pod }}.'

alertmanager:
  enabled: true
  persistence:
    enabled: false
  config:
    route:
      receiver: none
    receivers:
      - name: none

kube-state-metrics:
  enabled: true
prometheus-node-exporter:
  enabled: false
prometheus-pushgateway:
  enabled: false
