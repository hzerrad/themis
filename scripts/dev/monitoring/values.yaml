# Prometheus, kube-state-metrics and Alertmanager for the kind cluster, with
# alerts fast enough to watch: KubePodCrashLooping fires after 30s, not the
# 15m of kube-prometheus-stack. Themis reads the alerts from Alertmanager's
# API, so Alertmanager sends them nowhere. Install this before Themis, and the
# chart finds it.
server:
  global:
    scrape_interval: 15s
    evaluation_interval: 15s
  persistentVolume:
    enabled: false

serverFiles:
  alerting_rules.yml:
    groups:
      - name: themis-demo
        rules:
          - alert: KubePodCrashLooping
            expr: max_over_time(kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"}[2m]) >= 1
            for: 30s
            labels:
              severity: warning
            annotations:
              summary: Pod is crash looping.
              description: Pod {{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }}) is in CrashLoopBackOff.

alertmanager:
  enabled: true
  persistence:
    enabled: false
  config:
    route:
      receiver: none
    receivers:
      - name: none

kube-state-metrics:
  enabled: true
prometheus-node-exporter:
  enabled: false
prometheus-pushgateway:
  enabled: false
