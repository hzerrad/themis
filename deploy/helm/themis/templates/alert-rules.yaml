{{- $rules := include "themis.rulesValues" . | fromJson }}
{{- if and $rules.install (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1/PrometheusRule") }}
{{- /* files/alert-rules.yaml is generated by make gen. */}}
{{- $file := .Files.Get "files/alert-rules.yaml" | fromYaml }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ .Release.Name }}-alert-rules
  labels: {{- include "themis.labels" . | nindent 4 }}
    {{- with include "themis.ruleLabels" . | fromJson }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    {{- range $file.groups }}
    {{- if or (eq .name "themis") $rules.standard }}
    - {{ toYaml . | indent 6 | trim }}
    {{- end }}
    {{- end }}
{{- end }}
