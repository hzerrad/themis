apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  labels: {{- include "themis.labels" . | nindent 4 }}
data:
  themis.yaml: |
    enrolledNamespaces: {{- toYaml .Values.enrolledNamespaces | nindent 6 }}
    intake:
      bearerTokenFile: /var/run/secrets/themis/intake
      url: http://{{ .Release.Name }}-core.{{ .Release.Namespace }}.svc:8080/v1/intake/alertmanager
      tokenSecret: {{ include "themis.tokensSecret" . }}
    alerting:
      alertmanager:
        {{- $am := include "themis.alertmanagerValues" . | fromJson }}
        {{- if include "themis.alertmanagerEnabled" . }}
        {{- $basic := $am.basicAuth | default dict }}
        {{- $tls := $am.tls | default dict }}
        {{- $_ := include "themis.alertmanagerSecrets" . }}
        {{- with include "themis.alertmanagerAddress" . }}
        address: {{ . | quote }}
        {{- if not $am.address }}
        found: true
        {{- end }}
        {{- end }}
        {{- if $am.tokenSecret }}
        bearerTokenFile: /var/run/secrets/themis-alertmanager/token
        {{- end }}
        {{- if $basic.passwordSecret }}
        basicAuth:
          username: {{ required "alerting.alertmanager.basicAuth.username is required with its passwordSecret" $basic.username | quote }}
          passwordFile: /var/run/secrets/themis-alertmanager/password
        {{- end }}
        {{- if or $tls.caSecret $tls.clientCertSecret $tls.insecureSkipVerify }}
        tls:
          {{- if $tls.caSecret }}
          caFile: /var/run/secrets/themis-alertmanager/ca.crt
          {{- end }}
          {{- if $tls.clientCertSecret }}
          certFile: /var/run/secrets/themis-alertmanager/tls.crt
          keyFile: /var/run/secrets/themis-alertmanager/tls.key
          {{- end }}
          {{- if $tls.insecureSkipVerify }}
          insecureSkipVerify: true
          {{- end }}
        {{- end }}
        {{- with $am.matchers }}
        matchers: {{ toJson . }}
        {{- end }}
        interval: {{ $am.interval | default "15s" | quote }}
        {{- else }}
        disabled: true
        {{- end }}
      {{- with include "themis.prometheusFound" . }}
      prometheus:
        address: {{ . | quote }}
      {{- end }}
    investigators:
      bearerTokenFile: /var/run/secrets/themis/investigator
      {{- if not (include "themis.modelEnabled" .) }}
      disabled: true
      {{- end }}
    settings:
      keyFile: /var/run/secrets/themis/settings
    {{- with .Values.model }}
    {{- if or .provider .baseURL .name .apiKeySecret .schemaDialect }}
    model:
      {{- if .provider }}
      provider: {{ include "themis.modelProvider" $ | quote }}
      {{- end }}
      {{- with .baseURL }}
      baseURL: {{ . | quote }}
      {{- end }}
      {{- with .name }}
      name: {{ . | quote }}
      {{- end }}
      {{- if .apiKeySecret }}
      apiKey: true
      {{- end }}
      {{- if and .baseURL (not .strictOutput) }}
      strictOutput: false
      {{- end }}
      {{- with .schemaDialect }}
      schemaDialect: {{ . | quote }}
      {{- end }}
    {{- end }}
    {{- end }}
    api:
      bearerTokenFile: /var/run/secrets/themis/admin
      {{- with include "themis.adminAccount" . }}
      adminAccount:
        username: {{ . | quote }}
        passwordHashFile: /var/run/secrets/themis-admin-account/password-hash
        passwordFile: /var/run/secrets/themis-admin-account/password
      {{- else }}
      initialAdmin:
        passwordFile: /var/run/secrets/themis-initial-admin/password
        secret: {{ include "themis.initialAdminSecret" . }}
      {{- end }}
      {{- with .Values.oidc }}
      {{- if .issuerURL }}
      oidc:
        issuerURL: {{ .issuerURL | quote }}
        clientID: {{ required "oidc.clientID is required with oidc.issuerURL" .clientID | quote }}
        clientSecretFile: /var/run/secrets/themis-oidc/client-secret
        redirectURL: {{ required "oidc.redirectURL is required with oidc.issuerURL: Themis's /auth/callback as the browser reaches it" .redirectURL | quote }}
        {{- with .usernameClaim }}
        usernameClaim: {{ . | quote }}
        {{- end }}
        {{- with .groupsClaim }}
        groupsClaim: {{ . | quote }}
        {{- end }}
        {{- with .sessionTTL }}
        sessionTTL: {{ . | quote }}
        {{- end }}
        {{- with .scopes }}
        scopes: {{ toJson . }}
        {{- end }}
      {{- end }}
      {{- end }}
      {{- with .Values.access }}
      access: {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- if .Values.executor.enabled }}
    executor:
      address: {{ .Release.Name }}-executor:9091
      bearerTokenFile: /var/run/secrets/themis/executor
    {{- end }}
    {{- with .Values.notifications }}
    {{- if or .webhookSecret .externalURL }}
    notifications:
      {{- if .externalURL }}
      externalURL: {{ .externalURL | quote }}
      {{- end }}
      {{- if .webhookSecret }}
      webhook:
        urlFile: /var/run/secrets/themis-webhook/url
        {{- if .webhookToken }}
        bearerTokenFile: /var/run/secrets/themis-webhook/token
        {{- end }}
      {{- end }}
    {{- end }}
    {{- end }}
    {{- $prom := (.Values.metrics | default dict).prometheus | default dict }}
    {{- $tls := $prom.tls | default dict }}
    {{- if or (not (include "themis.metricsAPIEnabled" .)) $prom.address }}
    metrics:
      {{- if not (include "themis.metricsAPIEnabled" .) }}
      kubernetes: {disabled: true}
      {{- end }}
      {{- if $prom.address }}
      prometheus:
        address: {{ $prom.address | quote }}
        {{- if $prom.tokenSecret }}
        bearerTokenFile: /var/run/secrets/themis-prometheus/token
        {{- end }}
        {{- if or $tls.caSecret $tls.clientCertSecret $tls.insecureSkipVerify }}
        tls:
          {{- if $tls.caSecret }}
          caFile: /var/run/secrets/themis-prometheus/ca.crt
          {{- end }}
          {{- if $tls.clientCertSecret }}
          certFile: /var/run/secrets/themis-prometheus/tls.crt
          keyFile: /var/run/secrets/themis-prometheus/tls.key
          {{- end }}
          {{- if $tls.insecureSkipVerify }}
          insecureSkipVerify: true
          {{- end }}
        {{- end }}
      {{- end }}
    {{- end }}
    {{- with .Values.scenarios.disabled }}
    scenarios:
      disabled: {{ toJson . }}
    {{- end }}
    resources:
      namespace: {{ .Release.Namespace }}
