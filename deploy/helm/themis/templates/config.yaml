apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  labels: {{- include "themis.labels" . | nindent 4 }}
data:
  themis.yaml: |
    enrolledNamespaces: {{- toYaml .Values.enrolledNamespaces | nindent 6 }}
    intake:
      bearerTokenFile: /var/run/secrets/themis/intake
    investigators:
      bearerTokenFile: /var/run/secrets/themis/investigator
    api:
      bearerTokenFile: /var/run/secrets/themis/admin
      {{- with .Values.oidc }}
      {{- if .issuerURL }}
      oidc:
        issuerURL: {{ .issuerURL | quote }}
        clientID: {{ required "oidc.clientID is required with oidc.issuerURL" .clientID | quote }}
        clientSecretFile: /var/run/secrets/themis-oidc/client-secret
        redirectURL: {{ required "oidc.redirectURL is required with oidc.issuerURL: Themis's /auth/callback as the browser reaches it" .redirectURL | quote }}
        {{- with .usernameClaim }}
        usernameClaim: {{ . | quote }}
        {{- end }}
        {{- with .groupsClaim }}
        groupsClaim: {{ . | quote }}
        {{- end }}
        {{- with .sessionTTL }}
        sessionTTL: {{ . | quote }}
        {{- end }}
      {{- end }}
      {{- end }}
      {{- with .Values.access }}
      access: {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- if .Values.executor.enabled }}
    executor:
      address: {{ .Release.Name }}-executor:9091
      bearerTokenFile: /var/run/secrets/themis/executor
    {{- end }}
    {{- with .Values.notifications }}
    {{- if or .webhookSecret .externalURL }}
    notifications:
      {{- if .externalURL }}
      externalURL: {{ .externalURL | quote }}
      {{- end }}
      {{- if .webhookSecret }}
      webhook:
        urlFile: /var/run/secrets/themis-webhook/url
        {{- if .webhookToken }}
        bearerTokenFile: /var/run/secrets/themis-webhook/token
        {{- end }}
      {{- end }}
    {{- end }}
    {{- end }}
    resources:
      namespace: {{ .Release.Namespace }}
