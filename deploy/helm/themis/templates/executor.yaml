{{- if .Values.executor.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-executor
  labels: {{- include "themis.labels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-executor
  labels: {{- include "themis.labels" . | nindent 4 }}
spec:
  selector: {{- include "themis.selector" (dict "root" . "component" "executor") | nindent 4 }}
  ports:
    - {name: grpc, port: 9091, targetPort: grpc}
    - {name: metrics, port: 8082, targetPort: metrics}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-executor
  labels: {{- include "themis.labels" . | nindent 4 }}
    app.kubernetes.io/component: executor
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "themis.selector" (dict "root" . "component" "executor") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "themis.labels" . | nindent 8 }}
        app.kubernetes.io/component: executor
    spec:
      serviceAccountName: {{ .Release.Name }}-executor
      securityContext: {runAsNonRoot: true}
      containers:
        - name: executor
          image: {{ include "themis.image" (dict "root" . "component" "executor") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [--token-file=/var/run/secrets/themis/executor, --log-level={{ .Values.logLevel }}]
          env:
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: {{ include "themis.databaseSecret" . }}, key: DATABASE_URL}}
            {{- include "themis.otlpEnv" . | nindent 12 }}
          ports:
            - {name: grpc, containerPort: 9091}
            - {name: probes, containerPort: 8081}
            - {name: metrics, containerPort: 8082}
          readinessProbe: {httpGet: {path: /readyz, port: probes}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: probes}, periodSeconds: 10}
          resources: {{- toYaml .Values.resources.executor | nindent 12 }}
          securityContext: {{- include "themis.securityContext" . | nindent 12 }}
          volumeMounts:
            - {name: token, mountPath: /var/run/secrets/themis, readOnly: true}
      volumes:
        - name: token
          secret:
            secretName: {{ .Release.Name }}-tokens
            items: [{key: executor, path: executor}]
{{- range .Values.enrolledNamespaces }}
---
# The only write access Themis has: patching Deployments to roll them back.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $.Release.Name }}-executor
  namespace: {{ . }}
  labels: {{- include "themis.labels" $ | nindent 4 }}
rules:
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, patch]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $.Release.Name }}-executor
  namespace: {{ . }}
  labels: {{- include "themis.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $.Release.Name }}-executor
subjects:
  - kind: ServiceAccount
    name: {{ $.Release.Name }}-executor
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
