{{- if not (.Values.tokens | default dict).existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-tokens
  labels: {{- include "themis.labels" . | nindent 4 }}
type: Opaque
data:
  {{- /* settings encrypts secret settings made in setup: losing it loses them. */}}
  {{- range $key, $value := include "themis.tokenData" . | fromJson }}
  {{ $key }}: {{ $value }}
  {{- end }}
{{- end }}
