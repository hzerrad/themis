{{- /* Generated once; an upgrade keeps the existing values. */ -}}
{{- $name := printf "%s-tokens" .Release.Name -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $data := dict -}}
{{- if $existing }}{{ $data = $existing.data }}{{ end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "themis.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $key := list "intake" "investigator" "admin" "executor" }}
  {{ $key }}: {{ get $data $key | default (randAlphaNum 48 | b64enc) }}
  {{- end }}
