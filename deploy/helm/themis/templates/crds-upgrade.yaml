{{- /* Helm creates crds/ on install but never updates it. Before each upgrade,
this Job applies the same files. It can only change Themis's two CRDs.
--reuse-values from a release older than these values has no crds key. */}}
{{- $crds := .Values.crds | default dict }}
{{- if dig "upgrade" true $crds }}
{{- $name := printf "%s-crds" .Release.Name }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  labels: {{- include "themis.labels" . | nindent 4 }}
  annotations: {{- include "themis.crdHook" -10 | nindent 4 }}
data:
{{- range $path, $_ := .Files.Glob "crds/*.yaml" }}
  {{ base $path }}: | {{- $.Files.Get $path | nindent 4 }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels: {{- include "themis.labels" . | nindent 4 }}
  annotations: {{- include "themis.crdHook" -10 | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}
  labels: {{- include "themis.labels" . | nindent 4 }}
  annotations: {{- include "themis.crdHook" -10 | nindent 4 }}
rules:
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    resourceNames: [themisconfigs.themis.dev, incidentprofiles.themis.dev]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}
  labels: {{- include "themis.labels" . | nindent 4 }}
  annotations: {{- include "themis.crdHook" -10 | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  labels: {{- include "themis.labels" . | nindent 4 }}
  annotations: {{- include "themis.crdHook" 0 | nindent 4 }}
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels: {{- include "themis.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ $name }}
      restartPolicy: Never
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
      containers:
        - name: kubectl
          image: {{ dig "image" "registry.k8s.io/kubectl:v1.37.2" $crds }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [apply, --server-side, --force-conflicts, --field-manager=themis-crds, -f, /crds]
          env:
            - {name: HOME, value: /tmp}
          securityContext: {{- include "themis.securityContext" . | nindent 12 }}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
          volumeMounts:
            - {name: crds, mountPath: /crds, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: crds
          configMap:
            name: {{ $name }}
        - name: tmp
          emptyDir: {}
{{- end }}
