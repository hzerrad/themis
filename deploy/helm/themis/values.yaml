image:
  # Images are named <repository>/themis-{core,executor,intelligence}:<tag>.
  # They're published on every merge to main: main is the latest, and
  # sha-<commit> pins an exact build.
  repository: ghcr.io/hzerrad
  tag: main
  # main moves, so it's pulled every time. Pin a sha- tag to pull once.
  pullPolicy: Always

# Least severe level every component logs: debug, info, warn or error.
logLevel: info

telemetry:
  otlp:
    # Where every component sends its traces, for example
    # http://otel-collector.observability:4317. Empty: nothing is traced.
    endpoint: ""
    # grpc or http/protobuf.
    protocol: grpc
    # CIDR the investigator may reach the collector at, on 4317 and 4318.
    egressCIDR: 0.0.0.0/0

# Namespaces Themis may read, and with the executor, write. Each gets its own
# Role: Themis never creates RBAC at runtime.
enrolledNamespaces:
  - shop

database:
  # A Secret with a DATABASE_URL key. Empty uses the bundled PostgreSQL.
  existingSecret: ""

# A single PostgreSQL for trying Themis; not for production.
postgres:
  enabled: true
  image: postgres:17-alpine
  storage: 1Gi

# Bring your own model: any OpenAI-compatible endpoint, hosted or local.
model:
  # Off installs no investigator: Themis collects evidence and runs its
  # checks, then each incident waits for a fix suggested by a person or a
  # tool outside Themis, such as HolmesGPT.
  enabled: true
  # For example https://api.openai.com/v1 or http://ollama:11434/v1. Left
  # empty, it's set on Themis's Setup page instead.
  baseURL: ""
  # The model name the endpoint serves. Left empty, it's set on the Setup page.
  name: ""
  # The most sensitive evidence the endpoint may receive. sensitive includes
  # (redacted) container logs; set internal to keep logs from the endpoint.
  ceiling: sensitive
  # A Secret in the release namespace with an apiKey key, if the endpoint
  # needs one.
  apiKeySecret: ""
  # CIDR the investigator may reach the model at, for the NetworkPolicy.
  egressCIDR: 0.0.0.0/0
  tokenBudget: 200000
  # How hard a reasoning model thinks before answering, for example none or
  # low. Empty leaves the provider's default.
  reasoningEffort: ""
  # Each reply's output limit. Empty: 2048. A model that reasons needs more,
  # or its replies are cut off.
  maxOutputTokens: ""
  # Ask the provider to follow the reply schema exactly. OpenAI refuses
  # Themis's schema in strict mode: set false there. Replies are still
  # checked either way.
  strictOutput: true
  # The endpoint's price in US dollars per million tokens, so the investigator
  # reports themis_model_cost_usd_total; for example
  # {inputUSDPerMTok: 3, outputUSDPerMTok: 15}. Without one, no cost is reported.
  price: {}

# The executor is the only component that writes to workloads. Off by
# default: Themis then diagnoses and proposes, and never acts.
executor:
  enabled: false

# An escalation webhook: a JSON POST whenever Themis hands an incident to
# humans. The URL is read from a Secret, since webhook URLs often embed a key.
notifications:
  # A Secret in the release namespace with a url key.
  webhookSecret: ""
  # Whether the Secret also has a token key, sent as a bearer token.
  webhookToken: false
  # Where people reach the UI, for links in notices.
  externalURL: ""

# Themis's tokens and the key that encrypts secret settings. The chart
# generates them once and keeps them across upgrades with Helm's lookup, which
# GitOps tools such as Argo CD don't run: there, every sync would make new
# ones, and a new settings key makes saved secrets unreadable. Under GitOps,
# create the Secret yourself, with keys intake, investigator, admin, settings
# and, with the executor, executor, each a random string of at least 32
# characters, and name it here.
tokens:
  existingSecret: ""

# Opening Themis with kubectl port-forward to the core's setup port. Until an
# admin signs in through a real sign-in, whoever comes in this way is an admin:
# Kubernetes has already checked they may port-forward to Themis. Nothing else
# can reach the port. Turn it off to sign in only with OIDC or the admin token.
setup:
  enabled: true

# Sign-in through an OIDC provider, such as Dex, Google, Okta, Keycloak or
# Entra ID. Off while issuerURL is empty: only the admin token signs in.
oidc:
  # The provider's issuer, for example https://accounts.google.com.
  issuerURL: ""
  clientID: ""
  # Themis's /auth/callback as the browser reaches it, for example
  # https://themis.example.com/auth/callback. Register it with the provider.
  redirectURL: ""
  clientSecret:
    # A Secret in the release namespace holding the client secret.
    existingSecret: ""
    key: clientSecret
  # The ID token claim used as the username. Empty: email.
  usernameClaim: ""
  # The ID token claim listing the person's groups. Empty: groups.
  groupsClaim: ""
  # How long a sign-in lasts, for example 8h. Empty: 8h.
  sessionTTL: ""
  # Scopes to ask for; openid is always added. Empty: email and profile. Dex
  # and Okta send groups only when asked for the groups scope; Google refuses it.
  scopes: []

# Roles for people who sign in, by username or group; the most trusted match
# wins. Roles: viewer, responder, approver, admin. For example:
#   - {role: admin, users: [alice@example.com]}
#   - {role: approver, groups: [sre]}
access: []

# HolmesGPT as a source of fixes: each incident waiting for a suggestion, or
# that Themis couldn't decide, is put to an existing HolmesGPT install. A
# rollback it finds is suggested to Themis, which checks it like any other:
# against the cluster, then policy and approval. HolmesGPT never sees
# Themis's container logs; it reads the cluster itself.
holmesgpt:
  enabled: false
  # HolmesGPT's HTTP API, such as http://holmes-holmes.holmes (its chart's
  # Service in namespace holmes). Version 0.25 or later.
  url: ""
  # A Secret in the release namespace with an apiKey key: HolmesGPT's
  # HOLMES_API_KEY. Without one, anyone who can reach HolmesGPT can use it.
  apiKeySecret: ""
  # A key of HolmesGPT's modelList; empty uses its default.
  model: ""
  # How many suggestions a minute it may make.
  perMinute: 6

networkPolicy:
  enabled: true
  # Namespaces whose pods may reach the core's gRPC API, for agents that suggest
  # fixes (themisConfig.externalProposals.sources).
  agentNamespaces: []

crds:
  # Helm creates the CRDs on install but never updates them. With this on, a
  # short Job applies them before every helm upgrade. An uninstall keeps them.
  upgrade: true
  # Keep in step with kubectl in mise.toml.
  image: registry.k8s.io/kubectl:v1.37.2

# Global settings, installed as the ThemisConfig resource when set:
#   enrolledNamespaces: a subset of enrolledNamespaces above
#   autonomyCeiling: observe stops Themis making changes anywhere
#   externalProposals: who outside Themis may suggest fixes; see the docs
themisConfig: {}

# Scenario packs Themis ships, each with its own profile: every one is on
# unless named here, such as [rollout-regression]. See docs/scenarios.md.
scenarios:
  disabled: []

# Incident profiles of your own, installed as IncidentProfile resources in this
# release's namespace, where they apply to every enrolled namespace. One named
# like a scenario pack's profile replaces it. Teams can add their own in their
# namespace.
profiles: []

resources:
  core: {requests: {cpu: 50m, memory: 128Mi}, limits: {memory: 512Mi}}
  executor: {requests: {cpu: 20m, memory: 64Mi}, limits: {memory: 256Mi}}
  intelligence: {requests: {cpu: 50m, memory: 128Mi}, limits: {memory: 512Mi}}
  holmesgpt: {requests: {cpu: 10m, memory: 64Mi}, limits: {memory: 256Mi}}
