image:
  # Images are named <repository>/themis-{core,executor,intelligence}:<tag>.
  # main is the edge build, published on every merge; sha-<commit> pins one.
  # A released chart (docs/releasing.md) sets this to its own version.
  repository: ghcr.io/hzerrad
  tag: main
  # main moves, so it's pulled every time. Pin a sha- tag to pull once.
  pullPolicy: Always

# Least severe level every component logs: debug, info, warn or error.
logLevel: info

telemetry:
  otlp:
    # Where every component sends its traces, for example
    # http://otel-collector.observability:4317. Empty: nothing is traced.
    endpoint: ""
    # grpc or http/protobuf.
    protocol: grpc
    # CIDR the investigator may reach the collector at, on 4317 and 4318.
    egressCIDR: 0.0.0.0/0

# Namespaces Themis may read, and with the executor, write. Each gets its own
# Role: Themis never creates RBAC at runtime.
enrolledNamespaces:
  - shop

# How alerts reach Themis.
alerting:
  # poll: Themis reads the active alerts from Alertmanager's API, with nothing
  # to configure in Alertmanager. push: Alertmanager sends them to Themis's
  # webhook, as alerting.webhook sets up. Empty starts in poll mode, and the
  # Setup page can switch it. alerting.alertmanager.enabled=false, from
  # earlier charts, means push.
  mode: ""
  # The Alertmanager Themis reads in poll mode.
  alertmanager:
    # Alertmanager's base URL, for example
    # http://alertmanager-operated.monitoring:9093. Empty: the chart looks for
    # an Alertmanager Service in the cluster at install, with Helm's lookup,
    # which Argo CD and Flux don't run. Without one, the Setup page asks.
    address: ""
    # A Secret in the release namespace with a token key, sent as a bearer
    # token, if Alertmanager needs one. Needs address.
    tokenSecret: ""
    # A username, and a Secret with a password key, if Alertmanager needs
    # basic auth. Needs address.
    basicAuth:
      username: ""
      passwordSecret: ""
    tls:
      # A Secret with a ca.crt key: the CA that signs Alertmanager's
      # certificate, when the system's don't. Needs address.
      caSecret: ""
      # A kubernetes.io/tls Secret, for an Alertmanager that asks for a
      # client certificate. Needs address.
      clientCertSecret: ""
      # Accept any certificate. Only for trying Themis.
      insecureSkipVerify: false
    # Matchers that narrow the alerts read, beyond the names the scenario
    # packs answer, such as ['cluster="prod-eu"'] for an Alertmanager several
    # clusters share.
    matchers: []
    # How often Alertmanager is read.
    interval: 15s
  # Prometheus alerting rules for the alerts the scenario packs answer that
  # the usual stacks lack, such as KubePodOOMKilled, installed as a
  # PrometheusRule when the Prometheus Operator serves that resource. Off by
  # default: the alerts reach your Alertmanager's receivers too.
  rules:
    install: false
    # Also the rules kube-prometheus-stack ships, such as KubePodCrashLooping,
    # for a Prometheus without them.
    standard: false
    # Labels your Prometheus selects rules by, such as {release: kube-prometheus-stack}.
    # Empty: those of the first Prometheus resource found at install.
    labels: {}
  # Alertmanager sending alerts to Themis's webhook, in push mode. The webhook
  # takes alerts in poll mode too: one that arrives both ways is the same
  # alert.
  webhook:
    # A Secret you manage, with a token key holding the intake token, in
    # Alertmanager's namespace and, for alertmanagerConfig, in each enrolled
    # namespace. The Setup page's steps then use it instead of copying the
    # token. Needed under GitOps, with tokens.existingSecret.
    tokenSecret: ""
    alertmanagerConfig:
      # With the Prometheus Operator: an AlertmanagerConfig in each enrolled
      # namespace, which the operator limits to that namespace's alerts, and a
      # Secret there with the intake token, unless tokenSecret names one.
      # Anyone who can read Secrets there can then send alerts to Themis.
      enabled: false
      # Labels your Alertmanager selects AlertmanagerConfigs by, if any.
      labels: {}

database:
  # A Secret with a DATABASE_URL key. Empty uses the bundled PostgreSQL.
  existingSecret: ""

# A single PostgreSQL for trying Themis; not for production.
postgres:
  enabled: true
  image: postgres:17-alpine
  storage: 1Gi

# Themis's own investigator, themis-intelligence, which asks a model for a
# diagnosis and a fix. Off by default: each incident then waits for a fix
# suggested by a person or a tool such as HolmesGPT. On, the evidence Themis
# collects goes to the model below; a model in the cluster, such as Ollama,
# keeps it there.
investigator:
  enabled: false
  # Tokens per incident, shared by its investigations when a person has it
  # investigated again.
  tokenBudget: 200000
  # CIDR the investigator may reach the model at, for the NetworkPolicy.
  egressCIDR: 0.0.0.0/0
  resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {memory: 512Mi}}
  # Bring your own model: any OpenAI-compatible endpoint, hosted or local, or
  # Claude through Anthropic's API.
  model:
    # openai: an OpenAI-compatible API, such as OpenAI's, Ollama's or vLLM's.
    # anthropic: Anthropic's Messages API, for Claude models; baseURL can stay
    # empty, and the Setup page's address doesn't apply. Left empty with no
    # baseURL, it's chosen on the Setup page; otherwise empty means openai.
    provider: ""
    # For example https://api.openai.com/v1 or http://ollama:11434/v1. Left
    # empty, it's set on Themis's Setup page instead.
    baseURL: ""
    # The model name the endpoint serves. Left empty, it's set on the Setup
    # page.
    name: ""
    # A Secret in the release namespace with an apiKey key, if the endpoint
    # needs one.
    apiKeySecret: ""
    # The most sensitive evidence the endpoint may receive. sensitive includes
    # (redacted) container logs; set internal to keep logs from the endpoint.
    ceiling: sensitive
    # How hard a reasoning model thinks before answering, for example none or
    # low. Empty leaves the provider's default.
    reasoningEffort: ""
    # Each reply's output limit. Empty: 4096. A model that reasons needs more,
    # or its replies are cut off.
    maxOutputTokens: ""
    # Ask the provider to follow the reply schema exactly. Replies are still
    # checked either way. Without a baseURL, the Setup page's reply format
    # sets it instead.
    strictOutput: true
    # How the reply schema is sent: as-is, or openai-strict, the form OpenAI's
    # strict mode accepts. Empty: as-is, as Ollama and vLLM take it, or the
    # Setup page's reply format when baseURL is empty too.
    schemaDialect: ""
    # The field the output limit is sent in: max_tokens or
    # max_completion_tokens. Empty: max_tokens, as Ollama and vLLM read it.
    # OpenAI's newer models need max_completion_tokens.
    outputLimitField: ""
    # The temperature sent: a number, or default to send none and leave the
    # model's own, as OpenAI's newer models require. Empty: 0.
    temperature: ""
    # The endpoint's price in US dollars per million tokens, so the
    # investigator reports themis_model_cost_usd_total; for example
    # {inputUSDPerMTok: 3, outputUSDPerMTok: 15}. Without one, no cost is
    # reported.
    price: {}

# The executor is the only component that writes to workloads. Off by
# default: Themis then diagnoses and proposes, and never acts.
executor:
  enabled: false

# An escalation webhook: a JSON POST whenever Themis hands an incident to
# humans. The URL is read from a Secret, since webhook URLs often embed a key.
notifications:
  # A Secret in the release namespace with a url key.
  webhookSecret: ""
  # Whether the Secret also has a token key, sent as a bearer token.
  webhookToken: false
  # Where people reach the UI, for links in notices.
  externalURL: ""

# Themis's tokens and the key that encrypts secret settings. The chart
# generates them once and keeps them across upgrades with Helm's lookup, which
# GitOps tools such as Argo CD don't run: there, every sync would make new
# ones, and a new settings key makes saved secrets unreadable. Under GitOps,
# create the Secret yourself, with keys intake, investigator, admin, settings
# and, with the executor, executor, each a random string of at least 32
# characters, and name it here.
tokens:
  existingSecret: ""

# Themis serves nothing until an admin account exists. The initial admin
# password signs in only to create the first one, and is retired once its
# holder signs in with it. The chart generates the password once, in the
# <release>-initial-admin Secret, and keeps it across upgrades with Helm's
# lookup, as it does the tokens. Under GitOps, create a Secret with a password
# key yourself, a random string of at least 32 characters, and name it here.
initialAdmin:
  existingSecret: ""
  # Or an admin account Themis creates at startup while it has none, from a
  # Secret you create. Then no initial admin password is generated. Themis
  # creates the account once and never changes it after. Never put a password
  # in these values: Git and Helm's release history keep them.
  account:
    username: ""
    # The Secret, with the password's hash (argon2id or bcrypt) or the
    # password itself.
    existingSecret: ""
    passwordHashKey: password-hash
    passwordKey: password

# Sign-in through an OIDC provider, such as Dex, Google, Okta, Keycloak or
# Entra ID. Off while issuerURL is empty.
oidc:
  # The provider's issuer, for example https://accounts.google.com.
  issuerURL: ""
  clientID: ""
  # Themis's /auth/callback as the browser reaches it, for example
  # https://themis.example.com/auth/callback. Register it with the provider.
  redirectURL: ""
  clientSecret:
    # A Secret in the release namespace holding the client secret.
    existingSecret: ""
    key: clientSecret
  # The ID token claim used as the username. Empty: email.
  usernameClaim: ""
  # The ID token claim listing the person's groups. Empty: groups.
  groupsClaim: ""
  # How long a sign-in lasts, for example 8h. Empty: 8h.
  sessionTTL: ""
  # Scopes to ask for; openid is always added. Empty: email and profile. Dex
  # and Okta send groups only when asked for the groups scope; Google refuses it.
  scopes: []

# Roles for people who sign in, by username or group; the most trusted match
# wins. Roles: viewer, responder, approver, admin. For example:
#   - {role: admin, users: [alice@example.com]}
#   - {role: approver, groups: [sre]}
access: []

approvals:
  # true: the person who suggested a fix can't approve it; someone else must.
  # false lets them, and the timeline says they suggested and approved it.
  requireAnotherApprover: false

# HolmesGPT as a source of fixes: each incident waiting for a suggestion, or
# that Themis couldn't decide, is put to an existing HolmesGPT install. A
# rollback it finds is suggested to Themis, which checks it like any other:
# against the cluster, then policy and approval. HolmesGPT never sees
# Themis's container logs; it reads the cluster itself.
holmesgpt:
  enabled: false
  # HolmesGPT's HTTP API, such as http://holmes-holmes.holmes (its chart's
  # Service in namespace holmes). Version 0.25 or later.
  url: ""
  # A Secret in the release namespace with an apiKey key: HolmesGPT's
  # HOLMES_API_KEY. Without one, anyone who can reach HolmesGPT can use it.
  apiKeySecret: ""
  # A key of HolmesGPT's modelList; empty uses its default.
  model: ""
  # How many suggestions a minute it may make.
  perMinute: 6

networkPolicy:
  enabled: true
  # Namespaces whose pods may reach the core's gRPC API, for agents that suggest
  # fixes (themisConfig.externalProposals.sources).
  agentNamespaces: []

crds:
  # Helm creates the CRDs on install but never updates them. With this on, a
  # short Job applies them before every helm upgrade. An uninstall keeps them.
  upgrade: true
  # Keep in step with kubectl in mise.toml.
  image: registry.k8s.io/kubectl:v1.37.2

# Global settings, installed as the ThemisConfig resource when set:
#   enrolledNamespaces: a subset of enrolledNamespaces above
#   autonomyCeiling: observe stops Themis making changes anywhere
#   externalProposals: who outside Themis may suggest fixes; see the docs
themisConfig: {}

# Where Themis reads how much memory and CPU containers use, for the
# container_memory and container_cpu evidence. Prometheus is asked first when
# it has an address; the Kubernetes metrics API answers what it can't.
metrics:
  kubernetes:
    # The Kubernetes metrics API, which metrics-server serves: current use
    # only, no peaks or throttling. On, the core may read it in each enrolled
    # namespace.
    enabled: true
  prometheus:
    # A server answering Prometheus queries, such as Prometheus, Thanos,
    # Mimir, VictoriaMetrics or Grafana Cloud, for example
    # http://prometheus-operated.monitoring:9090. Empty: not used.
    address: ""
    # A Secret in the release namespace with a token key, sent as a bearer
    # token, if the server needs one.
    tokenSecret: ""
    tls:
      # A Secret with a ca.crt key: the CA that signs the server's
      # certificate, when the system's don't.
      caSecret: ""
      # A kubernetes.io/tls Secret, for a server that asks for a client
      # certificate.
      clientCertSecret: ""
      # Accept any certificate. Only for trying Themis.
      insecureSkipVerify: false

# Scenario packs Themis ships, each with its own profile: every one is on
# unless named here, such as [rollout-regression]. See docs/scenarios.md.
scenarios:
  disabled: []

# Incident profiles of your own, installed as IncidentProfile resources in this
# release's namespace, where they apply to every enrolled namespace. One named
# like a scenario pack's profile replaces it. Teams can add their own in their
# namespace.
profiles: []

resources:
  core: {requests: {cpu: 50m, memory: 128Mi}, limits: {memory: 512Mi}}
  executor: {requests: {cpu: 20m, memory: 64Mi}, limits: {memory: 256Mi}}
  holmesgpt: {requests: {cpu: 10m, memory: 64Mi}, limits: {memory: 256Mi}}
