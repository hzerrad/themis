# Prometheus alerting rules for the alerts Themis's scenario packs answer.
#
# themis: the alerts the usual stacks, such as kube-prometheus-stack, lack.
# themis-standard: those kube-prometheus-stack already has, from
# kubernetes-mixin (Apache-2.0), without its job selectors, so they work
# however Prometheus scrapes kube-state-metrics and the kubelet.
#
# The chart's alerting.rules values install them as a PrometheusRule; the
# Setup page shows those a Prometheus lacks. Generated into the chart by
# make gen: edit internal/incident/intake/rules/rules.yaml.
groups:
  - name: themis
    rules:
      - alert: KubePodOOMKilled
        expr: |-
          increase(kube_pod_container_status_restarts_total[10m]) >= 1
          and on (namespace, pod, container)
          max_over_time(kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}[10m]) == 1
        labels:
          severity: warning
        annotations:
          summary: A container ran out of memory.
          description: Container {{ $labels.container }} of pod {{ $labels.namespace }}/{{ $labels.pod }} was OOMKilled in the last 10 minutes.
  - name: themis-standard
    rules:
      - alert: KubePodCrashLooping
        expr: max_over_time(kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"}[5m]) >= 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Pod is crash looping.
          description: Pod {{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }}) is in waiting state (reason "CrashLoopBackOff").
      - alert: KubePodNotReady
        expr: |-
          sum by (namespace, pod, cluster) (
            max by (namespace, pod, cluster) (
              kube_pod_status_phase{phase=~"Pending|Unknown"}
              or
              (
                kube_pod_status_phase{phase="Running"} == 1
                and on (namespace, pod, cluster)
                kube_pod_status_ready{condition="true"} == 0
              )
            ) * on (namespace, pod, cluster) group_left() topk by (namespace, pod, cluster) (
              1, max by (namespace, pod, owner_kind, cluster) (kube_pod_owner{owner_kind!="Job"})
            )
          ) > 0
          unless on (namespace, pod, cluster)
          kube_pod_status_reason{reason="SchedulingGated"} == 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Pod has been in a non-ready state for more than 15 minutes.
          description: Pod {{ $labels.namespace }}/{{ $labels.pod }} has been in a non-ready state for longer than 15 minutes.
      - alert: KubeDeploymentReplicasMismatch
        expr: |-
          (
            kube_deployment_spec_replicas > kube_deployment_status_replicas_available
          ) and (
            changes(kube_deployment_status_replicas_updated[10m]) == 0
          )
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Deployment has not matched the expected number of replicas.
          description: Deployment {{ $labels.namespace }}/{{ $labels.deployment }} has not matched the expected number of replicas for longer than 15 minutes.
      - alert: KubeDeploymentRolloutStuck
        expr: kube_deployment_status_condition{condition="Progressing", status="false"} != 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Deployment rollout is not progressing.
          description: Rollout of deployment {{ $labels.namespace }}/{{ $labels.deployment }} is not progressing for longer than 15 minutes.
      - alert: KubeContainerWaiting
        expr: kube_pod_container_status_waiting_reason{reason!="CrashLoopBackOff"} > 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: Pod container waiting longer than 1 hour.
          description: Container {{ $labels.container }} of pod {{ $labels.namespace }}/{{ $labels.pod }} has been waiting for longer than 1 hour (reason "{{ $labels.reason }}").
      - alert: CPUThrottlingHigh
        expr: |-
          sum without (id, metrics_path, name, image, endpoint, job, node) (
            topk by (cluster, namespace, pod, container, instance) (1,
              increase(container_cpu_cfs_throttled_periods_total{container!=""}[5m])
            )
          )
          / on (cluster, namespace, pod, container, instance) group_left
          sum without (id, metrics_path, name, image, endpoint, job, node) (
            topk by (cluster, namespace, pod, container, instance) (1,
              increase(container_cpu_cfs_periods_total[5m])
            )
          )
          > (25 / 100)
        for: 15m
        labels:
          severity: info
        annotations:
          summary: Processes experience elevated CPU throttling.
          description: '{{ $value | humanizePercentage }} throttling of CPU in namespace {{ $labels.namespace }} for container {{ $labels.container }} in pod {{ $labels.pod }}.'
