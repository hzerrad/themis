# yaml-language-server: $schema=./themis.schema.json
#
# Example Themis configuration. The schema next to this file is generated from
# internal/config; editors that support the yaml-language-server comment above
# give completion and validation while editing.

enrolledNamespaces:
  - shop

intake:
  bearerTokenFile: /var/run/secrets/themis/intake-token

investigators:
  bearerTokenFile: /var/run/secrets/themis/investigator-token

api:
  bearerTokenFile: /var/run/secrets/themis/admin-token
  # Optional: people sign in through an OIDC provider, each with a role.
  # oidc:
  #   issuerURL: https://idp.example.com
  #   clientID: themis
  #   clientSecretFile: /var/run/secrets/themis-oidc/client-secret
  #   redirectURL: https://themis.example.com/auth/callback
  # access:
  #   - {role: admin, users: [alice@example.com]}
  #   - {role: approver, groups: [sre]}

# Where Themis reads how much memory and CPU containers use. The Kubernetes
# metrics API (metrics-server) is on by default: current use only. A server
# answering Prometheus queries adds peak memory and CPU throttling.
# metrics:
#   kubernetes: {disabled: false}
#   prometheus:
#     address: http://prometheus-operated.monitoring:9090
#     bearerTokenFile: /var/run/secrets/themis-prometheus/token
#     tls: {caFile: /var/run/secrets/themis-prometheus/ca.crt}

# Profiles come from the scenario packs Themis ships, one each, such as
# rollout-regression in scenarios/rollout-regression/scenario.yaml. Every pack
# is on unless disabled here.
# scenarios:
#   disabled: [rollout-regression]

# Optional: profiles of your own. One named like a pack's replaces it, for
# example to tighten its policy: copy the pack's profile to start from.
# profiles:
#   - name: rollout-regression
#     priority: 100
#     match:
#       alertNames: [KubePodCrashLooping]
#       targetKinds: [Deployment.apps]
#     evidence:
#       allowed: [rollout_history, pod_states, target_events]
