# yaml-language-server: $schema=./themis.schema.json
#
# Example Themis configuration. The schema next to this file is generated from
# internal/config; editors that support the yaml-language-server comment above
# give completion and validation while editing.

enrolledNamespaces:
  - shop

intake:
  bearerTokenFile: /var/run/secrets/themis/intake-token

investigators:
  bearerTokenFile: /var/run/secrets/themis/investigator-token

api:
  bearerTokenFile: /var/run/secrets/themis/admin-token
  # Optional: people sign in through an OIDC provider, each with a role.
  # oidc:
  #   issuerURL: https://idp.example.com
  #   clientID: themis
  #   clientSecretFile: /var/run/secrets/themis-oidc/client-secret
  #   redirectURL: https://themis.example.com/auth/callback
  # access:
  #   - {role: admin, users: [alice@example.com]}
  #   - {role: approver, groups: [sre]}

profiles:
  - name: rollout-regression
    priority: 100
    match:
      alertNames:
        - KubePodCrashLooping
        - KubeDeploymentReplicasMismatch
        - KubePodOOMKilled
      targetKinds:
        - Deployment.apps
    evidence:
      initial: [rollout_history, pod_states, target_events, referenced_config]
      allowed: [rollout_history, pod_states, target_events, referenced_config, container_logs_tail]
    capabilities: [deployment.rollback-to-revision]
    policy:
      mode: guarded
      approvalTimeout: 30m
      rules:
        - name: gitops-owns-the-target
          when: predicates.gitops_managed != "false"
          decision: deny
        - name: rollback-needs-a-bad-rollout
          when: >-
            action.capability == "deployment.rollback-to-revision" && action.restore != "true" &&
            (predicates.rollout_recent != "true" ||
             predicates.failure_onset_after_rollout != "true" ||
             predicates.config_changed_before_failure != "false" ||
             (predicates.oom_killed_new_revision != "true" &&
              predicates.prior_revision_was_healthy != "true"))
          decision: deny
        - name: rollback-needs-approval
          when: action.capability == "deployment.rollback-to-revision" && action.restore != "true"
          decision: require_approval
    verification:
      window: 5m
      stability: 2m
