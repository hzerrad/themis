name: Feature request
description: Something Themis should do, or do differently.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you were trying to do, and what got in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead
