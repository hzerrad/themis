name: Images

# Every merge to main publishes the edge images, tagged main and
# sha-<commit>. A version tag (v0.2.0) publishes a release: the three images
# under that version, the chart pinned to them, and a GitHub release. All of
# Themis shares one version: the parts only work as a set.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish themis-${{ matrix.component }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Signing without a stored key: the signature names this workflow.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - {component: core, dockerfile: build/Dockerfile, bin: themis-core}
          - {component: executor, dockerfile: build/Dockerfile, bin: themis-executor}
          - {component: intelligence, dockerfile: build/intelligence.Dockerfile, bin: ""}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/themis-${{ matrix.component }}
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,prefix=sha-,format=short
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.bin && format('BIN={0}', matrix.bin) || '' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/themis-${{ matrix.component }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE"

  release:
    name: Release the chart
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Package the chart for this version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          chart=deploy/helm/themis
          sed -i "s/^version: .*/version: ${version}/; s/^appVersion: .*/appVersion: \"${TAG}\"/" "$chart/Chart.yaml"
          # A release installs exactly these images, pulled once.
          sed -i "s/^  tag: main$/  tag: ${TAG}/; s/^  pullPolicy: Always$/  pullPolicy: IfNotPresent/" "$chart/values.yaml"
          grep -q "^  tag: ${TAG}$" "$chart/values.yaml"
          helm package "$chart" --destination dist
      - name: Publish the chart
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          echo "$TOKEN" | helm registry login ghcr.io --username "$OWNER" --password-stdin
          helm push dist/*.tgz "oci://ghcr.io/${OWNER}/charts"
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/*.tgz --repo "$GITHUB_REPOSITORY" --title "Themis $TAG" --generate-notes --verify-tag
