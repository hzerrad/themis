name: Security

# Known vulnerabilities in the dependencies and the images. It also runs weekly,
# because new advisories appear without any change to the code. Code scanning
# (CodeQL) runs through GitHub's default setup, not this workflow.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "30 6 * * 1" # Mondays, 06:30 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - run: make deps
      - run: make vuln-go

  python:
    name: Python vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          working-directory: intelligence
          enable-cache: true
      - run: make vuln-python

  images:
    name: Image vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The release itself, checked against its published checksum: the
      # setup-trivy action fetched an unpinned install script.
      - name: Install Trivy
        env:
          # Keep in step with mise.toml.
          TRIVY_VERSION: 0.76.0
          TRIVY_SHA256: e24b1c51293c1b15e4ba8d45bbc7891ba053f90278ec2698f3562c993e145fe7
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 15 -o trivy.tar.gz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tar.gz" | sha256sum -c -
          tar -xzf trivy.tar.gz trivy
          sudo install trivy /usr/local/bin/trivy
          rm trivy trivy.tar.gz
          trivy --version
      - run: make vuln-images
