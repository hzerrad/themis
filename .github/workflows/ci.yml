name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dco:
    name: DCO
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            author=$(git show -s --format='%an <%ae>' "$c")
            if ! git show -s --format='%(trailers:key=Signed-off-by,valueonly)' "$c" | grep -qxF "$author"; then
              echo "::error::$(git show -s --format='%h %s' "$c") is not signed off by $author"
              missing=1
            fi
          done
          exit $missing

  go:
    name: Go and protobuf
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - run: make deps
      - run: make lint-go lint-proto

  go-test:
    name: Go tests (Kubernetes ${{ matrix.kubernetes }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every supported minor: keep in step with the README's "Supported versions".
        kubernetes: ["1.35", "1.36", "1.37"]
    env:
      # Each test binary would start its own reaper container, and when many
      # start at once they time out. The runner is discarded after the job, so
      # nothing needs reaping.
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - run: make deps
      # The API server and etcd binaries come from GitHub release downloads,
      # which fail at times: fetch them with retries, then test offline.
      # setup-envtest picks the newest patch release of the minor.
      - name: Download the envtest binaries
        run: |
          for i in 1 2 3 4 5; do
            make envtest ENVTEST_K8S_VERSION=${{ matrix.kubernetes }}.x && exit 0
            sleep $((i * 15))
          done
          exit 1
      - run: make test-go ENVTEST_K8S_VERSION=${{ matrix.kubernetes }}.x
        env:
          ENVTEST_INSTALLED_ONLY: "true"
      # The web UI, once: the page doesn't depend on the Kubernetes version,
      # and its fixtures reuse the build test-go just made.
      - if: strategy.job-index == 0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: mise.toml
          package-manager-cache: false
      - if: strategy.job-index == 0
        run: make test-ui

  generated:
    name: Generated code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - run: make deps
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          working-directory: intelligence
          enable-cache: true
      - run: make check-gen

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          working-directory: intelligence
          enable-cache: true
      - run: make lint-python
      - run: make test-python

  scenarios:
    name: Scenario packs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - run: make deps
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          working-directory: intelligence
          enable-cache: true
      # Every pack is complete and its cases replay through the saved replies
      # with the safety gate passing.
      - run: make scenario-check
