name: End-to-end

on:
  # After every merge, and nightly, so nothing escapes it for long.
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"
  # On a PR only where a mistake hurts most: what writes to workloads, decides
  # whether it may, or grants the permissions to. It takes about 25 minutes,
  # so it isn't a required check; a red main is fixed before anything else.
  pull_request:
    paths:
      - "cmd/**"
      - "internal/executor/**"
      - "internal/incident/governance/**"
      - "internal/catalog/capability/**"
      - "internal/workload/**"
      - "deploy/helm/**"
      - "build/**"
      - "test/e2e/**"
      - ".github/workflows/e2e.yml"
      - "!**/*_test.go"
      - "!**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bad-rollout:
    name: Bad rollout on kind
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - run: make e2e
      - name: Component logs
        if: failure()
        run: |
          for f in test/e2e/artifacts/*.log; do echo "::group::$f"; cat "$f"; echo "::endgroup::"; done
