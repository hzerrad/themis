version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: gomod
    directories:
      - /
      - /tools
    schedule:
      interval: weekly
    groups:
      dev-tools:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /intelligence
    schedule:
      interval: weekly
