# A Deployment's container held back by its CPU limit: Themis may suggest
# raising the limit, or rolling back a new version that uses more CPU, with a
# person's approval. README.md says what it covers; docs/scenarios.md says
# what each field means.

name: cpu-throttling
description: A Deployment's container is throttled at its CPU limit; Themis may suggest raising the limit, or rolling back the new version that brought it, which a person approves.

# What the investigator may name as the root cause, most likely first, and
# what each means.
rootCauses:
  - name: cpu_limit_too_low
    description: its steady CPU demand is above its CPU limit, which holds it back
  - name: new_version_uses_more_cpu
    description: a recent rollout made it use more CPU than before
  - name: transient_cpu_burst
    description: a short burst of CPU use that has passed or rarely hits the limit
  - name: node_cpu_contention
    description: its node is short of CPU, slowing it below its limit
  - name: insufficient_evidence
    description: the evidence can't tell
  - name: other
    description: "none of these: say what in the summary"

# The profile Themis uses for these incidents. Throttling is only visible from
# a metrics source with history, such as Prometheus: without one, the checks
# are unknown and the policy refuses either fix.
profile:
  priority: 75
  match:
    alertNames: [CPUThrottlingHigh]
    targetKinds: [Deployment.apps]
  # container_cpu is read first: a missing metrics source is a gap the
  # investigator sees, never evidence to ask for.
  evidence:
    initial: [container_cpu, pod_states, rollout_history, target_events, revision_health]
    allowed: [container_cpu, pod_states, rollout_history, target_events, container_logs_tail, revision_health]
  checks:
    - throttling_data_available
    - cpu_throttled_at_limit
    - cpu_usage_near_limit
    - rollout_changed_the_app
    - throttling_came_with_rollout
    - earlier_revision_healthy
    - gitops_managed
  capabilities: [deployment.set-resources, deployment.rollback-to-revision, deployment.roll-back-changes]
  # A raise is refused unless the container is throttled at its limit, and a
  # rollback, whole or partial, unless the latest rollout brought the
  # throttling.
  justifiedBy:
    deployment.set-resources: [cpu_throttled_at_limit]
    deployment.rollback-to-revision: [throttling_came_with_rollout]
    deployment.roll-back-changes: [throttling_came_with_rollout]
  # The failure itself: while it is true, Themis never closes the incident
  # with no change on its own. It refers it to a person.
  symptoms: [cpu_throttled_at_limit]
  # What the investigator is told about these incidents: when raising the CPU
  # limit is right, when rolling back is, and when neither is. It names
  # checks, never root causes, and gives a starting size as guidance only:
  # the checks and the policy below decide.
  guidance: |
    Raising a container's CPU limit is right when the container is throttled
    at its limit for a sustained time and it hurts: cpu_throttled_at_limit is
    true, cpu_usage_near_limit is true, and the pods are slow, fall behind,
    fail readiness probes or time out, and the latest rollout didn't bring
    it: throttling_came_with_rollout is false, as with no earlier version,
    one throttled too, a rollout that changed nothing the pods run, only
    labels or annotations, or this version using no more of its CPU limit
    than the one before it did at the same age, or than it had come to use
    by its end, so more load brought it. Without CPU figures of both
    versions, it is false when this one ran unthrottled at least as long as
    the one before it did. Raise the CPU
    limit of the throttled container only, by enough to clear the
    throttling; 1.5 times the current limit is a reasonable start. Cite
    container_cpu, and the pod states, events or logs that show the harm.
    Never lower a value, never touch memory, and never remove a limit.

    Don't raise it, and say what you found instead, when:
    - throttling_data_available is not true: without throttling figures from
      the metrics source, throttling can't be seen. Don't infer it from CPU
      use, latency or the alert alone; say the figures are missing.
    - cpu_throttled_at_limit is false: the container is rarely held back, so
      the limit isn't what slows it.
    - cpu_usage_near_limit is false while throttling is high: the container
      sits well below its limit and only bursts hit it; say so and leave the
      call to a person.
    - throttling_came_with_rollout is true: the rollout changed what the pods
      run, and the version before this one ran unthrottled where this one is
      throttled, or used clearly less of its limit at the same age, so this
      one uses more CPU. Roll it back instead, as below.
    - throttling_came_with_rollout is unknown: nothing shows how the version
      before this one ran, such as no metrics history of its pods; say what
      is missing.
    - the pods are slow but not throttled, and events point at their node:
      more limit won't give them CPU the node doesn't have.

    Rolling back is right when the latest rollout brought the throttling:
    cpu_throttled_at_limit, throttling_came_with_rollout and
    earlier_revision_healthy are all true. Roll back to the revision before
    the current one, citing rollout_history and revision_health. Don't roll
    back when throttling_came_with_rollout is false or unknown. When
    earlier_revision_healthy is false, the version before it failed too;
    when it is unknown, nothing shows how it ran. Then propose neither fix,
    and say so.

    A partial rollback rolls back only the changes of the rollout you name,
    from rollout_history's change.app, and keeps the others, such as a new
    image. The same conditions justify it as a rollback. Prefer it when one
    change clearly explains the extra CPU, such as a setting that makes each
    request do more work; otherwise roll back the whole rollout.
  policy:
    mode: guarded
    approvalTimeout: 30m
    # Themis never changes a workload GitOps manages, or may manage, whatever
    # these rules say: it only recommends the fix.
    rules:
      # Throttling is the only reason this pack changes CPU, and justifiedBy
      # asks for it. The latest rollout must not have brought it: a raise is
      # refused unless there is no earlier version, the one before it was
      # throttled too, the rollout changed nothing the pods run, or this one
      # uses no more of its CPU limit than the one before it did. When
      # nothing shows which, as without a metrics history of the earlier
      # revision's pods, it is refused too, and a person decides. A restore
      # puts back what Themis changed.
      - name: no-raise-for-a-new-version
        when: >-
          action.capability == "deployment.set-resources" && action.restore != "true" &&
          predicates.throttling_came_with_rollout != "false"
        decision: deny
      # justifiedBy asks that the latest rollout brought the throttling: it
      # changed what the pods run, and the version before it ran unthrottled
      # where this one is throttled, or used clearly less of its CPU limit at
      # the same age. That version must also be one to go back to, healthy,
      # and the container still throttled at its limit. When any of them is
      # unknown, a person decides. A partial rollback needs the same.
      - name: rollback-needs-a-bad-rollout
        when: >-
          action.capability in ["deployment.rollback-to-revision", "deployment.roll-back-changes"] && action.restore != "true" &&
          (predicates.throttling_came_with_rollout != "true" ||
           predicates.earlier_revision_healthy != "true" ||
           predicates.cpu_throttled_at_limit != "true")
        decision: deny
      # The fix here raises a CPU limit that exists, and nothing else: no
      # memory, no lower value, no new limit where there was none, which
      # would throttle a container that wasn't.
      - name: raise-a-cpu-limit-only
        when: >-
          action.capability == "deployment.set-resources" && action.restore != "true" &&
          ("memory" in change || !("cpu" in change) || change.cpu != "increase" ||
           change.exists(k, k.endsWith(".cpu.limit") && change[k] == "set") ||
           !change.exists(k, k.endsWith(".cpu.limit") && change[k] == "increase"))
        decision: deny
      - name: raise-needs-approval
        when: action.capability == "deployment.set-resources" && action.restore != "true"
        decision: require_approval
      # Text planted in logs, events or config can steer which changes the
      # investigator rolls back, such as keeping the change that brought the
      # throttling. While any evidence holds text aimed at Themis, its
      # partial rollback is refused. The full rollback stays on offer, and a
      # person or an agent may still suggest a partial one.
      - name: partial-rollback-not-from-flagged-evidence
        when: >-
          action.capability == "deployment.roll-back-changes" && action.restore != "true" &&
          proposal.external == "false" && evidence.has_instructions == "true"
        decision: deny
        reason: Refused. The evidence holds text aimed at Themis, so a partial rollback from the investigator isn't taken. The full rollback is still on offer.
      - name: rollback-needs-approval
        when: action.capability in ["deployment.rollback-to-revision", "deployment.roll-back-changes"] && action.restore != "true"
        decision: require_approval
  # Throttled pods are ready, so their readiness can't tell whether a raise
  # or a rollback worked: it worked only when the container is no longer
  # throttled at its limit, read from what the new pods did since the change,
  # over 5 minutes at least, as a rate needs.
  verification:
    checks: [cpu_throttled_at_limit]
