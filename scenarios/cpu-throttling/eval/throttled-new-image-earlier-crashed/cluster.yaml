# Revision 2, rolled out yesterday at 08:00, changed only the image, from 4.2.0
# to 4.3.0, and kept the 500m CPU limit. Revision 1's api containers
# restarted 6 times in the day it ran, in Prometheus's history, and its pods
# are gone. Revision 2 has not restarted, but uses about twice the CPU:
# 88% of the limit on average over its first day, where revision 1 used 45%
# over its whole day. At today's peak it is throttled in about 60% of its CPU
# periods, and readiness probes time out.
#
# The new version brought the throttling, so a higher limit is refused. The
# version before it restarted, so there is no healthy one to roll back to,
# and the rollback is refused too: a person decides.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: search
  creationTimestamp: '2026-11-04T08:00:00Z'
  labels:
    app: search
  annotations:
    deployment.kubernetes.io/revision: '2'
spec:
  replicas: 4
  selector:
    matchLabels:
      app: search
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: search
    spec:
      containers:
      - name: api
        image: example/search:4.3.0
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
status:
  observedGeneration: 2
  replicas: 4
  updatedReplicas: 4
  readyReplicas: 3
  availableReplicas: 3
  unavailableReplicas: 1
  conditions:
  - type: Available
    status: 'True'
    reason: MinimumReplicasAvailable
    lastUpdateTime: '2026-11-04T08:00:00Z'
    lastTransitionTime: '2026-11-04T08:00:00Z'
  - type: Progressing
    status: 'True'
    reason: NewReplicaSetAvailable
    lastUpdateTime: '2026-11-05T08:06:00Z'
    lastTransitionTime: '2026-11-05T08:00:00Z'
