# Revision 2, rolled out 30 minutes ago, changed only the image, from 4.2.0
# to 4.3.0, and kept the 500m CPU limit. The new image builds its index with
# far more CPU: its first pod has been throttled at the limit since two
# minutes after it started, uses all of it, and its readiness probe times
# out, so it never became ready and the rollout is stuck behind it. Revision
# 1's three pods still serve, ready and never restarted, and Prometheus's
# history shows them unthrottled, at about 40% of the same limit, after the
# new pod was first throttled. The new version uses more CPU: rolling back to
# revision 1 is right, and raising the limit is refused.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: search
  creationTimestamp: '2026-10-28T09:00:00Z'
  labels:
    app: search
  annotations:
    deployment.kubernetes.io/revision: '2'
spec:
  replicas: 3
  selector:
    matchLabels:
      app: search
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: search
    spec:
      containers:
      - name: api
        image: example/search:4.3.0
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
