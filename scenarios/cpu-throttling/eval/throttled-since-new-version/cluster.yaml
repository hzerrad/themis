# Revision 3, rolled out 40 minutes ago, ships a new ranking model with the
# same 500m CPU limit. Since then the api container is throttled and
# readiness probes time out; revision 2 ran for nine days without either.
# The new version uses more CPU: raising the limit would paper over a
# regression, and whether to roll back is the rollout-regression pack's call.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: search
  creationTimestamp: '2026-10-02T09:00:00Z'
  labels:
    app: search
  annotations:
    deployment.kubernetes.io/revision: '3'
spec:
  replicas: 4
  selector:
    matchLabels:
      app: search
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: search
    spec:
      containers:
      - name: api
        image: example/search:4.3.0
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
status:
  observedGeneration: 4
  replicas: 4
  updatedReplicas: 4
  readyReplicas: 3
  availableReplicas: 3
  unavailableReplicas: 1
  conditions:
  - type: Available
