    reason: MinimumReplicasAvailable
    lastUpdateTime: '2026-10-02T09:00:00Z'
    lastTransitionTime: '2026-10-02T09:00:00Z'
  - type: Progressing
    status: 'True'
    reason: NewReplicaSetAvailable
    lastUpdateTime: '2026-11-04T13:20:00Z'
    lastTransitionTime: '2026-11-04T13:20:00Z'
