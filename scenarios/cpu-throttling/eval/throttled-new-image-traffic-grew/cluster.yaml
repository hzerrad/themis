# Search traffic has grown every day for two weeks. Revision 1 ran fourteen
# days at the 500m CPU limit: Prometheus's history shows its api containers
# using 50% of it on average in their first three hours, and 87% in their
# last. Revision 2, three hours ago, changed the image, from 4.1.3 to 4.2.0,
# and uses 88% of the limit; since 13:00 it is throttled in about 60% of its
# CPU periods, and readiness probes time out. Revision 2 uses more than
# revision 1 did at the same age, but no more than revision 1 had come to use
# by its end: the load grew, and revision 1 would be throttled too. Raising
# the limit is right.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: search
  creationTimestamp: '2026-10-21T10:00:00Z'
  labels:
    app: search
  annotations:
    deployment.kubernetes.io/revision: '2'
spec:
  replicas: 4
  selector:
    matchLabels:
      app: search
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: search
    spec:
      containers:
      - name: api
        image: example/search:4.2.0
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
status:
  observedGeneration: 2
  replicas: 4
  updatedReplicas: 4
  readyReplicas: 3
  availableReplicas: 3
  unavailableReplicas: 1
  conditions:
  - type: Available
