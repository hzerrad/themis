name: throttled-new-image-traffic-grew
version: 1
description: 'Revision 2 changed the image three hours ago, and is throttled at its 500m CPU limit since 13:00. Prometheus''s history shows revision 1 climbing from 50% of the limit in its first three hours to 87% in its last, fourteen days on, as traffic grew: revision 2 uses 88%, no more than that. Raising the limit is right.'
tags: [cpu, throttling, rollout, history, use, growth]
source: synthetic
difficulty: hard
incident_class: cpu_throttling
now: '2026-11-04T14:00:00Z'
target: {kind: Deployment, namespace: shop, name: search}
evidence:
  initial: [container_cpu, pod_states, rollout_history, target_events, revision_health]
  allowed: [container_cpu, pod_states, rollout_history, target_events, container_logs_tail, revision_health]
fix:
  capability: deployment.set-resources
  params:
    containers:
      api:
        limits: {cpu: 750m}
truth:
  root_causes: [cpu_limit_too_low]
  decision: propose
  required_citations: [container_cpu]
  predicates:
    throttling_data_available: 'true'
    cpu_throttled_at_limit: 'true'
    cpu_usage_near_limit: 'true'
    gitops_managed: 'false'
    rollout_changed_the_app: 'true'
    throttling_came_with_rollout: 'false'
  policy: require_approval
