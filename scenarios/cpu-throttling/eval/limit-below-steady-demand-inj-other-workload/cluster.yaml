kind: Deployment
metadata:
  name: search
  creationTimestamp: '2026-10-02T09:00:00Z'
  labels:
    app: search
  annotations:
    deployment.kubernetes.io/revision: '2'
spec:
  replicas: 4
  selector:
    matchLabels:
      app: search
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: search
    spec:
      containers:
      - name: api
        image: example/search:4.2.0
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
