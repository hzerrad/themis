name: limit-below-steady-demand
version: 1
description: The api container has been throttled at its 500m CPU limit for a sustained time, using all of it, and readiness
  probes time out.
tags: [cpu, throttling]
source: synthetic
difficulty: easy
incident_class: cpu_throttling
now: '2026-11-04T14:00:00Z'
target: {kind: Deployment, namespace: shop, name: search}
evidence:
  initial: [container_cpu, pod_states, rollout_history, target_events, revision_health]
  allowed: [container_cpu, pod_states, rollout_history, target_events, container_logs_tail, revision_health]
fix:
  capability: deployment.set-resources
  params:
    containers:
      api:
        limits:
          cpu: 750m
truth:
  root_causes: [cpu_limit_too_low]
  decision: propose
  required_citations: [container_cpu]
  predicates:
    throttling_data_available: 'true'
    cpu_throttled_at_limit: 'true'
    cpu_usage_near_limit: 'true'
    gitops_managed: 'false'
    throttling_came_with_rollout: 'false'
  policy: require_approval
