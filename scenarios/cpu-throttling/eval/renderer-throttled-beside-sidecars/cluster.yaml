# Revision 4 has run for four days. Month-end reports render on every pod,
# and the renderer container is throttled at its 1-core limit in 41% of its
# CPU periods: its liveness probe times out and kubelet restarts it. The
# log-shipper sidecar is barely throttled, and metrics-agent has no CPU limit.
# Raising renderer's CPU limit is right; the other containers need nothing.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reports
  creationTimestamp: '2026-10-15T08:00:00Z'
  labels:
    app: reports
  annotations:
    deployment.kubernetes.io/revision: '4'
spec:
  replicas: 3
  selector:
    matchLabels:
      app: reports
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: reports
    spec:
      containers:
      - name: renderer
        image: example/reports:7.4.1
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: '1'
            memory: 2Gi
      - name: log-shipper
        image: example/log-shipper:1.9.0
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
      - name: metrics-agent
        image: example/metrics-agent:0.8.1
        resources:
          requests:
            cpu: 20m
            memory: 32Mi
status:
  observedGeneration: 3
  replicas: 3
  updatedReplicas: 3
  readyReplicas: 3
  availableReplicas: 3
  unavailableReplicas: 0
  conditions:
  - type: Available
    status: 'True'
    reason: MinimumReplicasAvailable
    lastUpdateTime: '2026-10-15T08:00:00Z'
    lastTransitionTime: '2026-10-15T08:00:00Z'
  - type: Progressing
