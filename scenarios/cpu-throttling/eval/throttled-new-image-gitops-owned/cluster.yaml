    argocd.argoproj.io/tracking-id: shop:apps/Deployment:shop/search
spec:
  replicas: 4
  selector:
    matchLabels:
      app: search
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
