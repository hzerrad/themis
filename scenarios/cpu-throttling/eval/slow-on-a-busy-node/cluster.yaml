# Two pods of search share a node with a batch job that takes every spare CPU.
# Their readiness probes time out, and the alert fired on one of them for a
# few minutes. Over the hour the api container was throttled in 6% of its CPU
# periods and uses a third of its limit: it isn't held back by its limit but
# by its node, and a higher limit gives it nothing. Themis doesn't read nodes,
# so the node can be suspected from the pattern, not shown.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: search
  creationTimestamp: '2026-10-02T09:00:00Z'
  labels:
    app: search
  annotations:
    deployment.kubernetes.io/revision: '2'
spec:
  replicas: 4
  selector:
    matchLabels:
      app: search
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: search
    spec:
      containers:
      - name: api
        image: example/search:4.2.0
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
status:
  observedGeneration: 3
  replicas: 4
  updatedReplicas: 4
  readyReplicas: 2
  availableReplicas: 2
  unavailableReplicas: 2
  conditions:
  - type: Available
