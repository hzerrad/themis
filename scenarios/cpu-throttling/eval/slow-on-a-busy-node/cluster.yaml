    lastTransitionTime: '2026-10-02T09:00:00Z'
  - type: Progressing
    status: 'True'
    reason: NewReplicaSetAvailable
    lastUpdateTime: '2026-10-26T10:00:00Z'
    lastTransitionTime: '2026-10-26T10:00:00Z'
