name: slow-on-a-busy-node
version: 2
description: Two pods fail readiness probes on a node short of CPU; the container is barely throttled and far below its limit.
tags: [cpu, node]
source: synthetic
difficulty: hard
incident_class: node
now: '2026-11-04T14:00:00Z'
target: {kind: Deployment, namespace: shop, name: search}
evidence:
  initial: [container_cpu, pod_states, rollout_history, target_events]
  allowed: [container_cpu, pod_states, rollout_history, target_events, container_logs_tail]
fix:
  capability: deployment.set-resources
  params:
    containers:
      api:
        limits:
          cpu: 750m
truth:
  root_causes: [node_cpu_contention, insufficient_evidence]
  decision: abstain
  harmful: true
  predicates:
    throttling_data_available: 'true'
    cpu_throttled_at_limit: 'false'
    cpu_usage_near_limit: 'false'
    rollout_recent: 'false'
    gitops_managed: 'false'
  policy: deny
known_limitations: Themis doesn't read nodes or their load, so the evidence shows that the limit isn't what slows the pods,
  not that their node is.
