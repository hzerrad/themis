# The checks of the cpu-throttling pack, in the order Themis reports them. They
# read container_cpu, what the install's metrics source says of the current
# revision's containers. docs/checks.md says what each field means and what the
# expressions see.

# A metrics source says how often the containers were throttled. Only a source
# with history, such as Prometheus, can; the Kubernetes metrics API can't.
- name: throttling_data_available
  version: "1"
  description: A metrics source says how often the containers were throttled
  topic: CPU throttling data
  whenFalse: No metrics source says how often the containers were throttled
  availability: true
  reads: [container_cpu]
  answers:
    - when: container_cpu.throttling.unavailable != ""
      answer: false
      reason: "no throttling figures: ${container_cpu.throttling.unavailable}"
      cite: [ids.container_cpu]
    - answer: true
      reason: ${container_cpu.throttling.source} says how often each container was throttled over ${container_cpu.window}
      cite: [ids.container_cpu]

# A container with a CPU limit was held back in a quarter or more of its CPU
# periods over the window, the share at which kube-prometheus-stack's
# CPUThrottlingHigh fires. Only a CPU limit throttles a container.
- name: cpu_throttled_at_limit
  version: "2"
  description: A container is throttled at its CPU limit
  topic: Throttling at the CPU limit
  whenFalse: No container is throttled at its CPU limit
  reads: [container_cpu]
  let:
    limited: container_cpu.containers.filter(c, c.limitCores != null)
    measured: limited.filter(c, c.throttledRatio != null)
    throttled: >-
      measured.filter(c, c.throttledRatio >= 0.25).map(c,
        c.name + " was throttled in " + string(int(c.throttledRatio * 100.0 + 0.5)) + "% of its CPU periods over " +
        container_cpu.window + ", at its limit of " + string(c.limitCores) + " CPU")
    # The most throttled container: how far below the threshold they all are.
    most: >-
      measured.filter(c, measured.all(o, o.throttledRatio <= c.throttledRatio)).map(c,
        c.name + " was throttled in " + string(int(c.throttledRatio * 100.0 + 0.5)) + "% of its CPU periods over " +
        container_cpu.window + ", at its limit of " + string(c.limitCores) + " CPU")
    # For the facts: the containers throttled, and the most throttled.
    hot: measured.filter(c, c.throttledRatio >= 0.25)
    peak: measured.filter(c, measured.all(o, o.throttledRatio <= c.throttledRatio))
  answers:
    - when: size(limited) == 0
      answer: false
      reason: no container has a CPU limit, so none is throttled at one
      cite: [ids.container_cpu]
      fact: No container has a CPU limit, so none is throttled at one.
    - when: container_cpu.throttling.unavailable != ""
      answer: unknown
      reason: "no throttling figures: ${container_cpu.throttling.unavailable}"
      cite: [ids.container_cpu]
    - when: size(throttled) > 0
      answer: true
      reason: ${throttled[0]}
      cite: [ids.container_cpu]
      fact: >-
        The `${hot[0].name}` container was throttled in ${string(int(hot[0].throttledRatio * 100.0 + 0.5))}% of
        its CPU periods over ${container_cpu.window}, at its limit of `${string(int(hot[0].limitCores * 1000.0 + 0.5))}m`.
      headline: ${workload} is throttled at its CPU limit.
    - when: size(measured) == 0
      answer: unknown
      reason: no throttling figure for the ${size(limited)} container(s) with a CPU limit
      cite: [ids.container_cpu]
    - answer: false
      reason: >-
        ${most[0]}${size(measured) == 1 ? "" : ", the most of the " + string(size(measured)) + " containers with a CPU limit"},
        below 25%
      cite: [ids.container_cpu]
      fact: >-
        No container was throttled in a quarter of its CPU periods over ${container_cpu.window}. The most
        throttled, `${peak[0].name}`, was throttled in ${string(int(peak[0].throttledRatio * 100.0 + 0.5))}%.

# A container with a CPU limit uses most of it now. Throttling while far below
# the limit means bursts, not steady demand, hit it.
- name: cpu_usage_near_limit
  version: "1"
  description: A container uses 80% or more of its CPU limit
  topic: CPU use near the limit
  whenFalse: No container uses 80% or more of its CPU limit
  reads: [container_cpu]
  let:
    limited: container_cpu.containers.filter(c, c.limitCores != null)
    measured: limited.filter(c, c.usageOfLimit != null)
    near: >-
      measured.filter(c, c.usageOfLimit >= 0.8).map(c,
        c.name + " uses " + string(c.usageCores) + " CPU of its limit of " + string(c.limitCores))
    # For the fact: the containers near their limit.
    busy: measured.filter(c, c.usageOfLimit >= 0.8)
  answers:
    - when: size(limited) == 0
      answer: false
      reason: no container has a CPU limit
      cite: [ids.container_cpu]
    - when: size(near) > 0
      answer: true
      reason: ${near[0]}
      cite: [ids.container_cpu]
      fact: >-
        The `${busy[0].name}` container uses `${string(int(busy[0].usageCores * 1000.0 + 0.5))}m` of its
        `${string(int(busy[0].limitCores * 1000.0 + 0.5))}m` CPU limit.
    - when: size(measured) == 0
      answer: unknown
      reason: "no CPU use figures for the ${size(limited)} container(s) with a CPU limit${container_cpu.usage.unavailable != '' ? ': ' + container_cpu.usage.unavailable : ''}"
      cite: [ids.container_cpu]
    - answer: false
      reason: none of the ${size(measured)} container(s) with a CPU limit uses 80% or more of it
      cite: [ids.container_cpu]

# The throttling came with the latest rollout: it changed what the pods run,
# and the new version uses more CPU than the one before it. A rollout that
# changed only labels and annotations, such as a restart, can't have brought
# it: the version before it runs the same. Throttling shows only in a
# metrics source's history, so this reads how each revision's containers ran
# there: the version before ran unthrottled until after the current one was
# first throttled, beside it; or it compares how much of its CPU limit each
# version used over the same time since it started. The current version
# using clearly more than the one before did then, and than it did in its
# last that long, brought the throttling. Using no more than either, the
# version before would be throttled too: what changed since, such as more
# load, brought it. Only without those figures does how long each ran
# unthrottled decide, as a tiebreak. With no earlier revision, or one
# throttled too, the rollout didn't bring it: Themis's own record says so
# when the current revision is the fix Themis made for that throttling.
- name: throttling_came_with_rollout
  version: "2"
  description: The throttling came with the latest rollout, where the version before it ran unthrottled
  topic: Whether the rollout brought the throttling
  whenFalse: The throttling didn't come with the latest rollout
  reads: [rollout_history, revision_health]
  let:
    change: rollout_history.change
    earlier: revision_health.revisions.filter(r, r.revision == prior.revision)
    latest: revision_health.revisions.filter(r, r.revision == current.revision)
    ran: latest[0].firstThrottledAt - rollout_at
    seen: earlier[0].seenUntil - earlier[0].seenFrom
    # How much of its CPU limit each version used on average over the same
    # time since it started: the container of the current revision that used
    # the most of its limit, and that container in the one before, over its
    # first and its last that long.
    measured: >-
      size(latest) > 0 ? latest[0].cpu.filter(u, u.first != null) : []
    top: measured.filter(u, measured.all(o, o.first <= u.first))
    then: >-
      size(top) > 0 && size(earlier) > 0 ?
        earlier[0].cpu.filter(u, u.container == top[0].container && (u.first != null || u.last != null)) : []
    # Measurement noise, not a decision: two averages of the same use differ
    # by a few hundredths of the limit, from where the samples fall. Within
    # it, two versions use the same.
    noise: "0.05"
    now_use: top[0].first
    at_start: then[0].first
    at_end: then[0].last
    worse: >-
      (at_start == null || now_use > at_start + noise) &&
      (at_end == null || now_use > at_end + noise)
    # Each share as a percentage: now, at the start and at the end, and the
    # noise.
    pct: >-
      [now_use, at_start, at_end, noise].map(v, v == null ? "" : string(int(v * 100.0 + 0.5)) + "%")
    age: revision_health.comparedAge
    compared: >-
      top[0].container + " used " + pct[0] + " of its CPU limit on average in revision " + current.revision +
      "'s first " + age + ", against " +
      (at_start != null ? pct[1] + " in revision " + prior.revision + "'s first " + age : "") +
      (at_start != null && at_end != null ? " and " : "") +
      (at_end != null ? pct[2] + " in " + (at_start != null ? "its" : "revision " + prior.revision + "'s") + " last " + age : "") +
      ", in " + earlier[0].source + "'s history"
  answers:
    - when: current == null
      answer: unknown
      reason: the current revision is unknown
    - when: prior == null
      answer: false
      reason: there is no revision before revision ${current.revision}, so no rollout brought the throttling
      cite: [ids.rollout_history]
      fact: Revision ${current.revision} is the first revision, so there is no earlier version to roll back to.
    - when: change == null || change.from != prior.revision
      answer: unknown
      reason: the rollout history doesn't say what revision ${current.revision} changed from revision ${prior.revision}
      cite: [ids.rollout_history]
    - when: size(change.app) == 0
      answer: false
      reason: >-
        revision ${current.revision} changed nothing its pods run${size(change.metadata) > 0 ? ", only their labels and annotations (" + change.metadata[0] + ")" : ""},
        so the version before it runs the same and the rollout didn't bring the throttling
      cite: [ids.rollout_history]
      fact: >-
        Revision ${current.revision} changed nothing its pods run, so a rollback would undo nothing and the
        rollout didn't bring the throttling.
    # Themis's own record: the current revision is its fix for the
    # throttling of the one before it.
    - when: >-
        themis_fix != null && themis_fix.replaced == prior.revision &&
        themis_fix.found.exists(f, f.check == "cpu_throttled_at_limit")
      answer: false
      reason: >-
        the version before it was throttled too: revision ${prior.revision} was throttled before
        Themis's fix on incident ${themis_fix.incident} replaced it
        (${themis_fix.found.filter(f, f.check == "cpu_throttled_at_limit")[0].reason})
      cite: [ids.rollout_history, themis_fix.id]
      fact: Revision ${prior.revision}, the version before it, was throttled too, before Themis's fix replaced it.
    - when: size(earlier) == 0 || earlier[0].seenFrom == null
      answer: unknown
      reason: the metrics history has none of the pods of revision ${prior.revision}
      cite: [ids.revision_health]
      fact: Nothing shows how revision ${prior.revision} ran. The metrics history has none of its pods.
    - when: earlier[0].firstThrottledAt != null
      answer: false
      reason: >-
        the version before it was throttled too: a container of revision ${prior.revision} was throttled
        at its CPU limit from ${earlier[0].firstThrottledAt}, in ${earlier[0].source}'s history
      cite: [ids.rollout_history, ids.revision_health]
      fact: Revision ${prior.revision}, the version before it, was throttled at its CPU limit too, from ${earlier[0].firstThrottledAt}.
    - when: rollout_at == null
      answer: unknown
      reason: the rollout time is unknown
    - when: size(latest) == 0 || latest[0].firstThrottledAt == null
      answer: unknown
      reason: no history shows revision ${current.revision} throttled at its CPU limit
      cite: [ids.revision_health]
    - when: earlier[0].seenUntil >= latest[0].firstThrottledAt
      answer: true
      reason: >-
        revision ${current.revision} changed what its pods run (${change.app[0]}), and pods of revision
        ${prior.revision} ran unthrottled until ${earlier[0].seenUntil}, after revision ${current.revision}
        was first throttled at ${latest[0].firstThrottledAt}
      cite: [ids.rollout_history, ids.revision_health]
      fact: >-
        Revision ${prior.revision}, the version before it, ran unthrottled until ${earlier[0].seenUntil},
        after revision ${current.revision} was first throttled at ${latest[0].firstThrottledAt}.
    # How much of its CPU limit each version used at the same age decides.
    - when: size(then) > 0 && worse
      answer: true
      reason: >-
        revision ${current.revision} changed what its pods run (${change.app[0]}), and uses more of its CPU limit
        than revision ${prior.revision} did, by more than measurement noise (${pct[3]} of the limit): ${compared}
      cite: [ids.rollout_history, ids.revision_health]
      fact: >-
        In revision ${current.revision}, `${top[0].container}` uses ${pct[0]} of its CPU limit at ${age} old.
        In revision ${prior.revision}, it used
        ${at_start != null ? pct[1] + " at the same age" + (at_end != null ? ", and " + pct[2] + " in its last " + age : "") : pct[2] + " in its last " + age}.
    - when: size(then) > 0 && at_start != null && now_use <= at_start + noise
      answer: false
      reason: >-
        revision ${current.revision} uses as much of its CPU limit as revision ${prior.revision} did at the same
        age, within measurement noise (${pct[3]} of the limit): ${compared}, so more load since brought the throttling
      cite: [ids.rollout_history, ids.revision_health]
      fact: >-
        Revision ${current.revision} uses as much of its CPU limit as revision ${prior.revision} did at the same
        age, so more load since brought the throttling.
    - when: size(then) > 0
      answer: false
      reason: >-
        revision ${prior.revision} had come to use as much of its CPU limit before the rollout, within measurement
        noise (${pct[3]} of the limit): ${compared}, so load grew before the rollout
      cite: [ids.rollout_history, ids.revision_health]
      fact: >-
        Revision ${prior.revision} had come to use as much of its CPU limit before the rollout, so load grew
        before it.
    # Without those figures, how long each ran unthrottled breaks the tie.
    - when: ran < seen
      answer: true
      reason: >-
        revision ${current.revision} changed what its pods run (${change.app[0]}), and was throttled at its CPU
        limit ${ran} after its rollout; revision ${prior.revision} ran ${seen} unthrottled, in ${earlier[0].source}'s history
      cite: [ids.rollout_history, ids.revision_health]
      fact: >-
        Revision ${current.revision} was throttled ${ran} after it rolled out. Revision ${prior.revision},
        the version before it, ran ${seen} unthrottled.
    - answer: false
      reason: >-
        revision ${current.revision} ran ${ran} unthrottled after its rollout, at least as long as
        revision ${prior.revision} was seen to (${seen}, in ${earlier[0].source}'s history), so what
        changed since brought the throttling
      cite: [ids.rollout_history, ids.revision_health]
      fact: >-
        Revision ${current.revision} ran ${ran} unthrottled after it rolled out, at least as long as
        revision ${prior.revision} did, so the rollout didn't bring the throttling.
