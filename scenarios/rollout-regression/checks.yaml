# The checks of the rollout-regression pack. rollout_recent,
# earlier_revision_healthy and gitops_managed, which its profile runs too, are
# Themis's own.
# docs/checks.md says what each field means and what the expressions see.

# A failure without a time could be earlier than the rollout. Anyone who may
# create events in the namespace can write one that reads like a failure, so
# the failures count only when the pods' status shows them too: a pod of the
# current revision isn't ready, or a container of one restarted. A
# Deployment's first revision replaced none, so its failures followed no
# rollout.
- name: failure_onset_after_rollout
  version: "3"
  description: The failures started after the rollout
  topic: When the failures started
  whenFalse: The failures didn't start after a rollout
  reads: [rollout_history, pod_states, target_events]
  let:
    early: failures.filter(f, f.at != null && f.at < rollout_at)
    undated: failures.filter(f, f.at == null)
    shown: >-
      pod_states.pods.exists(p, p.revision == current_revision &&
        (!p.ready || p.containers.exists(c, c.restartCount > 0)))
  answers:
    - when: rollout_at == null
      answer: unknown
      reason: the rollout time is unknown
    - when: prior == null
      answer: false
      reason: there is no revision before revision ${current.revision}, so no rollout came before the failures
      cite: [ids.rollout_history]
    - when: size(early) > 0
      answer: false
      reason: ${early[0].what} at ${early[0].at} predates revision ${current.revision} at ${rollout_at}
      cite: [ids.rollout_history, "early[0].id"]
    # The events may hold an earlier failure: without them, Themis can only
    # say that none it saw came first, which isn't enough to act on.
    - when: ids.target_events == ""
      answer: unknown
      reason: no target events
    - when: size(failures) == 0
      answer: unknown
      reason: no failure observed
    - when: size(undated) > 0
      answer: unknown
      reason: ${size(undated)} failures have no time
    - when: "!shown"
      answer: unknown
      reason: every pod of revision ${current_revision} is ready and none restarted, whatever the events say
      cite: [ids.pod_states]
    - answer: true
      reason: all ${size(failures)} failures follow revision ${current.revision} at ${rollout_at}
      cite: [ids.rollout_history, "failures.map(f, f.id)"]

# A container of the current revision was OOMKilled.
- name: oom_killed_new_revision
  version: "1"
  description: The new version runs out of memory
  topic: OOM kills in the new version
  whenFalse: The new version doesn't run out of memory
  reads: [pod_states]
  let:
    pods: pod_states.pods.filter(p, p.revision == current_revision)
    killed: >-
      pods.map(p,
        p.containers
          .filter(c, [c.state, c.lastTermination].exists(s, s != null && s.reason == "OOMKilled"))
          .map(c, p.name + "/" + c.name)
      ).flatten()
  answers:
    - when: size(killed) > 0
      answer: true
      reason: ${killed[0]} of revision ${current_revision} was OOMKilled
      cite: [ids.pod_states]
    - when: size(pods) == 0
      answer: unknown
      reason: no pods of the current revision
    - answer: false
      reason: none of the ${size(pods)} pods of revision ${current_revision} was OOMKilled
      cite: [ids.pod_states]

# A ConfigMap the target refers to changed after the current revision rolled
# out and no later than the first failure, so rolling back the revision might
# not undo the cause. A write within a minute of the rollout is part of the
# same release: tools apply a release's objects in any order. The first
# failure is dated by the pods' status, and by events only where the status
# agrees, so an event anyone may write can't move it earlier. Secrets are
# never read, so a change to one can't be seen, and the reason says so.
- name: config_changed_before_failure
  version: "2"
  description: Its config changed before the failures began
  topic: Config changes before the failures
  whenFalse: Its config didn't change before the failures began
  reads: [referenced_config, rollout_history, pod_states]
  let:
    absent: referenced_config.refs.filter(r, r.kind == "ConfigMap" && r.missing && !r.optional)
    # The first ConfigMap that settles it: one that doesn't say when it last
    # changed, or one that changed between the rollout and the first failure.
    settling: >-
      referenced_config.refs.filter(r, r.kind == "ConfigMap" && !r.missing && (r.changedAt == null ||
        (r.changedAt > rollout_at + duration("1m") && r.changedAt <= first_failure.at)))
    secrets: size(referenced_config.refs.filter(r, r.kind == "Secret"))
  answers:
    - when: size(absent) > 0
      answer: unknown
      reason: ConfigMap ${absent[0].name} is referenced but doesn't exist
      cite: [ids.referenced_config]
    - when: rollout_at == null
      answer: unknown
      reason: the rollout time is unknown
    - when: first_failure == null
      answer: unknown
      reason: no failure with a known time
    - when: size(settling) > 0 && settling[0].changedAt == null
      answer: unknown
      reason: ConfigMap ${settling[0].name} doesn't say when it last changed
      cite: [ids.referenced_config]
    - when: size(settling) > 0
      answer: true
      reason: ConfigMap ${settling[0].name} changed at ${settling[0].changedAt}, after revision ${current.revision} and before ${first_failure.what}
      cite: [ids.referenced_config, ids.rollout_history, first_failure.id]
    - answer: false
      reason: >-
        no referenced ConfigMap changed between the rollout and the first
        failure${secrets > 0 ? "; " + string(secrets) + " referenced Secret(s) can't be checked" : ""}
      cite: [ids.referenced_config, ids.rollout_history, first_failure.id]
