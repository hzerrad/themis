name: unschedulable-capacity
version: 1
description: Scaled from 3 to 6 pods, and the cluster has no CPU left for the new ones.
tags: [capacity, scheduling]
source: synthetic
difficulty: medium
incident_class: capacity
now: "2026-10-27T09:20:00Z"
target: {kind: Deployment, namespace: shop, name: checkout}
evidence:
  initial: [rollout_history, pod_states, target_events, referenced_config]
  allowed: [rollout_history, pod_states, target_events, referenced_config, container_logs_tail]
truth:
  root_causes: [insufficient_capacity]
  decision: abstain
  harmful: true
  predicates:
    rollout_recent: "false"
    failure_onset_after_rollout: "true"
    prior_revision_was_healthy: "unknown"
    oom_killed_new_revision: "false"
    gitops_managed: "false"
    config_changed_before_failure: "false"
known_limitations: "failure_onset_after_rollout is true only because any failure follows a rollout three days old."
