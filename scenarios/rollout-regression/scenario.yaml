# A Deployment that started failing after a rollout, rolled back with a
# person's approval. README.md says what it covers; docs/scenarios.md says
# what each field means.

name: rollout-regression
description: A new version of a Deployment fails where the version before it worked; Themis suggests rolling back to it.

# What the investigator may name as the root cause, most likely first, and
# what each means. A closed list makes answers comparable; other keeps it
# honest when none fits.
rootCauses:
  - name: memory_limit_regression
    description: the new revision's memory limit is too low
  - name: bad_configuration
    description: the new revision's settings are wrong
  - name: image_pull_failure
    description: its image can't be pulled
  - name: application_bug
    description: its code fails, whichever revision runs
  - name: configuration_change
    description: a ConfigMap or Secret changed outside the rollout
  - name: dependency_failure
    description: something it calls is failing
  - name: insufficient_capacity
    description: no room in the cluster for its pods
  - name: node_problem
    description: a node is unhealthy or evicting pods
  - name: storage_full
    description: a disk or volume is full
  - name: traffic_spike
    description: more load than it can take
  - name: insufficient_evidence
    description: the evidence can't tell
  - name: other
    description: "none of these: say what in the summary"

# The profile Themis uses for these incidents, in the format of the
# configuration file's profiles. Its name is the pack's.
profile:
  priority: 100
  match:
    alertNames: [KubePodCrashLooping, KubeDeploymentReplicasMismatch, KubePodOOMKilled]
    targetKinds: [Deployment.apps]
  # revision_health says how the revision before the current one ran once
  # its pods are gone, from a metrics source's history: without one, it is a
  # gap, and a rollback waits for its pods or a person.
  evidence:
    initial: [rollout_history, pod_states, target_events, referenced_config, revision_health]
    allowed: [rollout_history, pod_states, target_events, referenced_config, container_logs_tail, revision_health]
  checks:
    - failure_onset_after_rollout
    - earlier_revision_healthy
    - rollout_changed_the_app
    - failures_came_with_rollout
    - oom_killed_new_revision
    - gitops_managed
    - config_changed_before_failure
  capabilities: [deployment.rollback-to-revision]
  # A rollback is refused unless the failures started after the rollout.
  justifiedBy:
    deployment.rollback-to-revision: [failure_onset_after_rollout]
  # The failure itself: while one is true, Themis never closes the incident
  # with no change on its own. It refers it to a person.
  symptoms: [failure_onset_after_rollout, oom_killed_new_revision]
  # What the investigator is told about these incidents: when a rollback is
  # right and when it is wrong. Guidance only: the checks and the policy
  # below decide.
  guidance: |
    A rollback is right when the latest rollout brought the failures: it
    changed what the pods run (rollout_changed_the_app is true), and the
    revision before it does better, running without failing beside the
    failing pods, or using clearly less of its memory limit at the same age
    (failures_came_with_rollout is true). If the rollout changed only labels
    or annotations, such as a restart, if the failure started before the
    rollout, if there is no earlier revision or it failed too, if the
    current revision uses no more of its limit than the one before it did
    at the same age or by its end, so demand grew (failures_came_with_rollout
    is false), if the target is managed by GitOps, if its config changed
    before the failure, or if the evidence is missing, such as no history of
    the revision before it (failures_came_with_rollout is unknown), do not
    propose a rollback: conclude inconclusive and say what is missing.

    When oom_killed_new_revision, failure_onset_after_rollout and
    failures_came_with_rollout are all true, and gitops_managed and
    config_changed_before_failure are false, rolling back to the revision
    before it is justified, even if the logs are empty: a process killed for
    memory often writes nothing.

    Naming a cause doesn't make a rollback right: these conditions do.
  policy:
    mode: guarded
    approvalTimeout: 30m
    # Themis never changes a workload GitOps manages, or may manage, whatever
    # these rules say: it only recommends the fix.
    rules:
      # justifiedBy asks that the failures started after the rollout. The
      # rollout must also have brought them: it changed what the pods run,
      # and the version before it does better, by its pods or the metrics
      # history. And no config may have changed before the failures. How
      # long ago the rollout was decides nothing.
      - name: rollback-needs-a-bad-rollout
        when: >-
          action.capability == "deployment.rollback-to-revision" && action.restore != "true" &&
          (predicates.failures_came_with_rollout != "true" ||
           predicates.config_changed_before_failure != "false")
        decision: deny
      - name: rollback-needs-approval
        when: action.capability == "deployment.rollback-to-revision" && action.restore != "true"
        decision: require_approval
  verification:
    window: 5m
    stability: 2m
