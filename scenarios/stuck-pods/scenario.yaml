# Pods of a Deployment that never become ready: Themis says why, and hands the
# incident to a person. README.md says what it covers; docs/scenarios.md says
# what each field means.

name: stuck-pods
description: Pods of a Deployment never become ready; Themis finds out why and hands the incident to a person, changing nothing.

# What the investigator may name as the root cause, most likely first, and
# what each means.
rootCauses:
  - name: cannot_be_scheduled
    description: no node can take its pods, for lack of CPU or memory, a taint, or an affinity or node selector no node matches
  - name: image_pull_failure
    description: its image can't be pulled, for a wrong name or tag, or missing registry credentials
  - name: volume_unavailable
    description: a volume it needs can't be bound or mounted
  - name: init_container_failure
    description: an init container fails or never finishes
  - name: startup_config_error
    description: a ConfigMap, Secret or key its containers need is missing, so they can't start
  - name: quota_exceeded
    description: a namespace quota refuses new pods
  - name: still_starting
    description: its pods are starting slowly and nothing has failed
  - name: insufficient_evidence
    description: the evidence can't tell
  - name: other
    description: "none of these: say what in the summary"

# The profile Themis uses for these incidents. It answers only alerts the
# rollout-regression pack doesn't, and its priority is below that pack's.
profile:
  priority: 50
  # What the investigator is told about these incidents. It names checks, never
  # root causes, so the prompt doesn't single out an answer.
  guidance: |
    No fix is on offer for these incidents: Themis diagnoses them and hands
    them to a person. Tell which cause keeps the pods from becoming ready,
    from the pod states and the events, and back it with the check that shows
    it: scheduler_rejected_pods, image_pull_failing, volume_not_bound,
    init_container_stuck, config_error_on_start or quota_refused_pods. When
    the checks and the evidence point to one cause, conclude with it and cite
    that evidence. When none fails and the pods are only slow, say so. When
    the evidence can't tell, say what is missing.

    A recent rollout doesn't make this a regression to roll back: rolling
    back belongs to another kind of incident, and is never on offer here.
  match:
    alertNames: [KubePodNotReady, KubeContainerWaiting, KubeDeploymentRolloutStuck]
    targetKinds: [Deployment.apps]
  evidence:
    initial: [pod_states, target_events, rollout_history, referenced_config]
    allowed: [pod_states, target_events, rollout_history, referenced_config, container_logs_tail]
  checks:
    - scheduler_rejected_pods
    - image_pull_failing
    - volume_not_bound
    - init_container_stuck
    - config_error_on_start
    - quota_refused_pods
    - stuck_pods_new_revision_only
  # What keeps the pods from running. Alone, this pack refers every incident
  # to a person; with a pack that offers a fix, one of these being true keeps
  # Themis from closing the incident with no change on its own.
  symptoms:
    - scheduler_rejected_pods
    - image_pull_failing
    - volume_not_bound
    - init_container_stuck
    - config_error_on_start
    - quota_refused_pods
  # Diagnosis only: no fix is offered, so Themis refuses any fix suggested
  # for an incident only this pack matched. The rule below says so to the
  # evaluation, which decides a rollback anyway. A pack's rules govern only
  # its own fixes, so it never holds back another pack's.
  policy:
    mode: guarded
    rules:
      - name: diagnosis-only
        when: "true"
        decision: deny
