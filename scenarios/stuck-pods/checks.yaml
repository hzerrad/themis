# The checks of the stuck-pods pack, in the order Themis reports them. Each
# looks at the pods that aren't ready, and names the first sign of one cause.
# docs/checks.md says what each field means and what the expressions see.
#
# Anyone who may create events in the namespace can write one that reads like
# the scheduler's or the kubelet's, so an event never makes a check true by
# itself: the status the controllers write has to show what the event says.
# When it doesn't, the check is unknown.

# The scheduler said why it can't place a pod that isn't ready: it names the
# resource, taint, affinity or volume no node satisfies. The pod's status
# bears it out when the pod still waits for a node.
- name: scheduler_rejected_pods
  version: "2"
  description: No node can take a pod
  topic: Scheduling
  whenFalse: Every pod was scheduled
  reads: [pod_states, target_events]
  let:
    stuck: pod_states.pods.filter(p, !p.ready)
    names: stuck.map(p, "Pod/" + p.name)
    claimed: target_events.events.filter(e, e.reason == "FailedScheduling" && e.object in names)
    # A pod no node took has no container statuses yet.
    waiting: stuck.filter(p, p.phase == "Pending" && size(p.containers) == 0)
    unplaced: waiting.map(p, "Pod/" + p.name)
    refused: claimed.filter(e, e.object in unplaced)
  answers:
    - when: size(stuck) == 0
      answer: false
      reason: every pod is ready
      cite: [ids.pod_states]
    - when: size(refused) > 0
      answer: true
      reason: "${refused[0].object} can't be scheduled: ${refused[0].message}"
      cite: [ids.pod_states, ids.target_events]
      fact: No node takes `${refused[0].object}`, and ${size(waiting)} of the ${size(stuck)} pods that aren't ready wait for one.
      headline: ${workload}'s pods can't be scheduled.
    - when: size(waiting) > 0
      answer: unknown
      reason: pod ${waiting[0].name} waits for a node, and no event says why
      cite: [ids.pod_states, ids.target_events]
    - when: size(claimed) > 0
      answer: unknown
      reason: an event says ${claimed[0].object} can't be scheduled, but it has been placed on a node
      cite: [ids.pod_states, ids.target_events]
    - answer: false
      reason: the ${size(stuck)} pod(s) that aren't ready were all scheduled
      cite: [ids.pod_states, ids.target_events]

# A container of a pod that isn't ready waits for its image.
- name: image_pull_failing
  version: "1"
  description: An image can't be pulled
  topic: Image pulls
  whenFalse: Every image is pulled
  reads: [pod_states]
  let:
    stuck: pod_states.pods.filter(p, !p.ready)
    failing: >-
      stuck.map(p,
        p.containers
          .filter(c, c.state != null && c.state.status == "waiting" &&
            c.state.reason in ["ErrImagePull", "ImagePullBackOff", "InvalidImageName", "ErrImageNeverPull"])
          .map(c, p.name + "/" + c.name + " (" + c.image + ") is waiting with " + c.state.reason)
      ).flatten()
    # For the fact: each as [container, image, reason].
    pulls: >-
      stuck.map(p,
        p.containers
          .filter(c, c.state != null && c.state.status == "waiting" &&
            c.state.reason in ["ErrImagePull", "ImagePullBackOff", "InvalidImageName", "ErrImageNeverPull"])
          .map(c, [c.name, c.image, c.state.reason])
      ).flatten()
  answers:
    - when: size(stuck) == 0
      answer: false
      reason: every pod is ready
      cite: [ids.pod_states]
    - when: size(failing) > 0
      answer: true
      reason: ${failing[0]}
      cite: [ids.pod_states]
      fact: The `${pulls[0][0]}` container waits for its image `${pulls[0][1]}`, with `${pulls[0][2]}`.
      headline: ${workload}'s image can't be pulled.
    - answer: false
      reason: no container of the ${size(stuck)} pod(s) that aren't ready is waiting for its image
      cite: [ids.pod_states]

# Events about a pod that isn't ready say a volume can't be bound, attached or
# mounted. Events about the claim itself aren't read: the claim's own state
# isn't evidence Themis collects. The pod's status bears an event out when the
# pod is still pending with none of its containers running, as a pod whose
# volume isn't there is.
- name: volume_not_bound
  version: "2"
  description: A volume can't be bound or mounted
  topic: Volumes
  whenFalse: No volume fails to bind or mount
  reads: [pod_states, target_events]
  let:
    stuck: pod_states.pods.filter(p, !p.ready)
    names: stuck.map(p, "Pod/" + p.name)
    claimed: >-
      target_events.events.filter(e, e.object in names && (
        e.reason in ["FailedMount", "FailedAttachVolume"] ||
        (e.reason == "FailedScheduling" && e.message.lowerAscii().contains("volume"))))
    held: >-
      stuck.filter(p, p.phase == "Pending" &&
        !p.containers.exists(c, c.state != null && c.state.status == "running")).map(p, "Pod/" + p.name)
    trouble: claimed.filter(e, e.object in held)
  answers:
    - when: size(stuck) == 0
      answer: false
      reason: every pod is ready
      cite: [ids.pod_states]
    - when: size(trouble) > 0
      answer: true
      reason: "${trouble[0].object}, ${trouble[0].reason}: ${trouble[0].message}"
      cite: [ids.pod_states, ids.target_events]
      fact: A volume of `${trouble[0].object}` can't be bound or mounted (`${trouble[0].reason}`), and the pod waits to start.
      headline: ${workload}'s pods wait for a volume.
    - when: size(claimed) > 0
      answer: unknown
      reason: "an event says ${claimed[0].object}, ${claimed[0].reason}: ${claimed[0].message}, but the pod isn't waiting to start"
      cite: [ids.pod_states, ids.target_events]
    - answer: false
      reason: no event says a volume of the ${size(stuck)} pod(s) that aren't ready can't be bound or mounted
      cite: [ids.pod_states, ids.target_events]

# An init container of a pod that isn't ready failed, or has run for more than
# five minutes without finishing, holding the pod's other containers back.
- name: init_container_stuck
  version: "1"
  description: An init container fails or never finishes
  topic: Init containers
  whenFalse: Every init container finishes
  reads: [pod_states]
  let:
    stuck: pod_states.pods.filter(p, !p.ready)
    failed: >-
      stuck.map(p,
        p.containers
          .filter(c, c.init && (
            (c.state != null && c.state.reason == "CrashLoopBackOff") ||
            [c.state, c.lastTermination].exists(s, s != null && s.status == "terminated" && s.reason != "Completed")))
          .map(c, p.name + "/" + c.name)
      ).flatten()
    # Each as [pod/container, when it started].
    running: >-
      stuck.map(p,
        p.containers
          .filter(c, c.init && c.state != null && c.state.status == "running" && c.state.startedAt != null &&
            now - c.state.startedAt > duration("5m"))
          .map(c, [p.name + "/" + c.name, c.state.startedAt])
      ).flatten()
  answers:
    - when: size(stuck) == 0
      answer: false
      reason: every pod is ready
      cite: [ids.pod_states]
    - when: size(failed) > 0
      answer: true
      reason: init container ${failed[0]} failed
      cite: [ids.pod_states]
      fact: Init container `${failed[0]}` failed, so the pod's other containers don't start.
      headline: ${workload}'s init container fails.
    - when: size(running) > 0
      answer: true
      reason: init container ${running[0][0]} has run for ${now - running[0][1]} without finishing
      cite: [ids.pod_states]
      fact: Init container `${running[0][0]}` has run for ${now - running[0][1]} without finishing.
      headline: ${workload}'s init container never finishes.
    - answer: false
      reason: no init container of the ${size(stuck)} pod(s) that aren't ready failed or ran longer than ${duration("5m")}
      cite: [ids.pod_states]

# A container can't be created because a ConfigMap, Secret or key it reads is
# missing, or a ConfigMap the pods need doesn't exist. Secrets are never
# read, so only the container's state shows one missing.
- name: config_error_on_start
  version: "1"
  description: A container can't start because its configuration is missing
  topic: Configuration at start
  whenFalse: No container lacks its configuration at start
  reads: [pod_states, referenced_config]
  let:
    stuck: pod_states.pods.filter(p, !p.ready)
    blocked: >-
      stuck.map(p,
        p.containers
          .filter(c, c.state != null && c.state.reason == "CreateContainerConfigError")
          .map(c, p.name + "/" + c.name)
      ).flatten()
    absent: referenced_config.refs.filter(r, r.kind == "ConfigMap" && r.missing && !r.optional)
    secrets: size(referenced_config.refs.filter(r, r.kind == "Secret"))
  answers:
    - when: size(stuck) == 0
      answer: false
      reason: every pod is ready
      cite: [ids.pod_states]
    - when: size(blocked) > 0
      answer: true
      reason: ${blocked[0]} can't be created with its configuration (CreateContainerConfigError)
      cite: [ids.pod_states]
      fact: "`${blocked[0]}` can't be created with its configuration (`CreateContainerConfigError`)."
      headline: ${workload}'s containers lack their configuration.
    - when: size(absent) > 0
      answer: true
      reason: ConfigMap ${absent[0].name} is referenced but doesn't exist
      cite: [ids.referenced_config]
      fact: ConfigMap `${absent[0].name}` is referenced but doesn't exist.
      headline: ${workload}'s containers lack their configuration.
    - answer: false
      reason: >-
        no container waits for its configuration, and every ConfigMap the pods
        need exists${secrets > 0 ? "; " + string(secrets) + " referenced Secret(s) can't be checked" : ""}
      cite: [ids.pod_states, ids.referenced_config]

# A ReplicaSet couldn't create a pod because a namespace quota refused it. Such
# a pod never exists, so only its ReplicaSet's events show it. The
# Deployment's status bears an event out: its controller sets the
# ReplicaFailure condition when a ReplicaSet can't create pods.
- name: quota_refused_pods
  version: "2"
  description: A namespace quota refuses new pods
  topic: Namespace quota
  whenFalse: No namespace quota refuses new pods
  reads: [target_events, rollout_history]
  let:
    refused: target_events.events.filter(e, e.reason == "FailedCreate" && e.message.contains("exceeded quota"))
    failing: >-
      has(rollout_history.deployment.conditions) && rollout_history.deployment.conditions.exists(c, c.type == "ReplicaFailure" && c.status == "True" &&
        c.reason == "FailedCreate" && has(c.message) && c.message.contains("exceeded quota"))
  answers:
    - when: size(refused) > 0 && failing
      answer: true
      reason: "${refused[0].object} can't create pods: ${refused[0].message}"
      cite: [ids.target_events, ids.rollout_history]
      fact: A namespace quota keeps `${refused[0].object}` from creating pods, and the Deployment says it fails to create them.
      headline: A namespace quota refuses ${workload}'s pods.
    - when: size(refused) > 0
      answer: unknown
      reason: "an event says ${refused[0].object} can't create pods for a quota, but the Deployment doesn't say it fails to create them"
      cite: [ids.target_events, ids.rollout_history]
    - answer: false
      reason: no event says a quota refused a pod
      cite: [ids.target_events]

# Every pod that isn't ready is of the current revision, and the revision
# before it runs ready pods: the new version may be what's broken, which is
# the rollout-regression pack's case, where a rollback can be right.
- name: stuck_pods_new_revision_only
  version: "1"
  description: Only the new version's pods are stuck, and the version before it runs
  topic: Stuck pods by version
  reads: [rollout_history, pod_states]
  let:
    stuck: pod_states.pods.filter(p, !p.ready)
    older: stuck.filter(p, p.revision != current.revision)
    ready: pod_states.pods.filter(p, p.ready && p.revision == prior.revision)
  answers:
    - when: current == null
      answer: unknown
      reason: the current revision is unknown
    - when: size(stuck) == 0
      answer: false
      reason: every pod is ready
      cite: [ids.pod_states]
    - when: size(older) > 0
      answer: false
      reason: pod ${older[0].name} of revision ${older[0].revision} isn't ready either
      cite: [ids.rollout_history, ids.pod_states]
    - when: prior == null
      answer: false
      reason: revision ${current.revision} is the only one
      cite: [ids.rollout_history]
    - when: size(ready) == 0
      answer: unknown
      reason: revision ${prior.revision} has no ready pods to compare with
      cite: [ids.rollout_history, ids.pod_states]
    - answer: true
      reason: the ${size(stuck)} pod(s) that aren't ready are all of revision ${current.revision}, and ${size(ready)} pod(s) of revision ${prior.revision} are ready
      cite: [ids.rollout_history, ids.pod_states]
      fact: >-
        Only pods of revision ${current.revision} are stuck. ${size(ready)} pods of revision ${prior.revision},
        the version before it, are ready.
