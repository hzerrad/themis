# A Deployment created this morning mounts the claim ledger-data, which asks
# for the StorageClass fast-ssd. The cluster has no such class, so the claim is
# never bound, and the scheduler won't place the pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger
  creationTimestamp: '2026-10-27T08:58:00Z'
  labels:
    app: ledger
  annotations:
    deployment.kubernetes.io/revision: '1'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ledger
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: ledger
    spec:
      containers:
      - name: app
        image: example/ledger:0.9.0
        volumeMounts:
        - name: data
          mountPath: /var/lib/ledger
        resources:
          limits:
            memory: 1Gi
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: ledger-data
