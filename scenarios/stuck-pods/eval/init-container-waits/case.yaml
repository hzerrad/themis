name: init-container-waits
version: 1
description: Revision 3 has run for two days. A pod added by a scale-up is held by its init container, which has waited 25 minutes for a database migration lock that a crashed job left behind.
tags: [stuck-pods, init-container]
source: synthetic
difficulty: medium
incident_class: stuck_pods
now: "2026-10-27T09:20:00Z"
target: {kind: Deployment, namespace: shop, name: orders}
evidence:
  initial: [pod_states, target_events, rollout_history, referenced_config]
  allowed: [pod_states, target_events, rollout_history, referenced_config, container_logs_tail]
truth:
  root_causes: [init_container_failure]
  decision: abstain
  rollback_is_harmful: true
  predicates:
    scheduler_rejected_pods: "false"
    image_pull_failing: "false"
    volume_not_bound: "false"
    init_container_stuck: "true"
    config_error_on_start: "false"
    quota_refused_pods: "false"
    stuck_pods_new_revision_only: "unknown"
known_limitations: "The init container's logs, which name the lock, are out of reach: by default container_logs_tail reads the pod's main container, which hasn't started, and a replay ignores a request for another container."
