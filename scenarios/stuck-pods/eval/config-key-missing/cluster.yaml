# Revision 4 has run for four days. This morning someone rewrote the Secret
# payments-db without its password key. The pods started before still have the
# value; the pod recreated at 09:00, after a node drain, can't be created. Every
# revision reads the same key, so a rollback wouldn't start either.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments
  creationTimestamp: '2026-09-30T08:00:00Z'
  labels:
    app: payments
  annotations:
    deployment.kubernetes.io/revision: '4'
spec:
  replicas: 3
  selector:
    matchLabels:
      app: payments
  template:
    metadata:
      labels:
        app: payments
    spec:
      containers:
      - name: app
        image: example/payments:7.0.2
        envFrom:
        - configMapRef:
            name: payments-config
        env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: payments-db
              key: password
        resources:
          limits:
            memory: 512Mi
status:
  observedGeneration: 6
