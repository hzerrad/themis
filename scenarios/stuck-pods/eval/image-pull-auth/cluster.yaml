# drained this morning; the pod recreated on a fresh node can't pull the image,
# because the registry's pull credentials expired. The pods still running had
# the image cached. Revision 1's image is in the same registry, so a rollback
# wouldn't pull either.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  creationTimestamp: '2026-10-15T08:00:00Z'
  labels:
    app: checkout
  annotations:
    deployment.kubernetes.io/revision: '2'
spec:
  replicas: 3
  selector:
    matchLabels:
      app: checkout
  template:
    metadata:
      labels:
        app: checkout
    spec:
      imagePullSecrets:
      - name: registry-pull
      containers:
      - name: app
        image: registry.example.com/shop/checkout:2.4.0
        resources:
          limits:
            memory: 256Mi
