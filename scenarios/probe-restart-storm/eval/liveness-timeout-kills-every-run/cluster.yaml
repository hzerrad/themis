# inventory is a new service: revision 1, its first, went out at 10:00. Its
# health check reconciles stock against the database and answers in about 2
# seconds, and its liveness probe, the only probe it has, gives it 1. Each run
# serves normally until its third probe times out, 20 seconds in; the kubelet
# then kills it, and SIGKILLs it 5 seconds later (exit code 137), since it
# drains for longer than its grace period. Both pods have restarted 6 times,
# and the 7th kill of each is under way: the kubelet's repeated events last
# happened after the restart the pods' status shows. With no readiness probe,
# a running container shows ready.
apiVersion: apps/v1
kind: Deployment
metadata:
