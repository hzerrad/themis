# Revision 15 has run for five days. At 11:02 the orders database stopped
# accepting connections; every pod's readiness endpoint now answers 503, as it
# is meant to, and its logs say the database is unreachable. Nothing restarts.
# A more lenient readiness probe would send orders to pods that can't store
# them, and hide the outage.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  creationTimestamp: '2026-02-01T08:00:00Z'
  labels:
    app: orders
  annotations:
    deployment.kubernetes.io/revision: '15'
spec:
  replicas: 3
  selector:
    matchLabels:
      app: orders
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: orders
    spec:
      containers:
      - name: app
        image: example/orders:7.2.1
        ports:
        - containerPort: 8080
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
status:
