# Revision 7 has run for 9 days. This morning a node drain restarted all three
# pods, and none has come back: the ledger now loads 14 million accounts before
# it listens, which takes about 40 seconds, and its liveness probe (10s delay,
# 3 failures 10s apart) kills it after about 30. The old pods had started back
# when the index was smaller. Nothing in the logs is an error; each run is
# stopped by SIGTERM, exit code 143.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger
  creationTimestamp: '2026-06-01T08:00:00Z'
  labels:
    app: ledger
  annotations:
    deployment.kubernetes.io/revision: '7'
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ledger
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: ledger
    spec:
      containers:
      - name: app
        image: example/ledger:3.8.2
        ports:
        - containerPort: 8080
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 1
          failureThreshold: 3
status:
  observedGeneration: 7
  replicas: 3
  updatedReplicas: 3
  readyReplicas: 0
  availableReplicas: 0
  unavailableReplicas: 3
  conditions:
  - type: Available
