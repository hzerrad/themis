name: new-version-hangs-on-start
version: 1
description: Revision 4 of api-gateway, rolled out 30 minutes ago, never starts listening, its event loop blocked reloading routes, and its liveness probe kills it every time; revision 3 starts in seconds with the same probes and still serves. The alert brings the rollout-regression pack too, and rolling back is right, not a more lenient probe.
tags: [probe-restart-storm, look-alike, rollout, combined]
source: synthetic
difficulty: hard
incident_class: probe_restart_storm
now: "2026-11-04T10:05:00Z"
alert: KubePodCrashLooping
target: {kind: Deployment, namespace: edge, name: api-gateway}
evidence:
  initial: [rollout_history, pod_states, target_events, referenced_config]
  allowed: [rollout_history, pod_states, target_events, referenced_config, container_logs_tail]
fix:
  capability: deployment.rollback-to-revision
  params: {revision: 3}
truth:
  root_causes: [new_version_broken, application_bug]
  decision: propose
  acceptable_revisions: [3]
  policy: require_approval
  predicates:
    probe_kills: "true"
    probe_timeouts: "false"
    killed_during_startup: "true"
    crashed_on_its_own: "false"
    rollout_recent: "true"
    failure_onset_after_rollout: "true"
    earlier_revision_healthy: "true"
    config_changed_before_failure: "false"
