# Revision 9 has run for six days. Since 08:12, every pod takes a malformed
# message off the queue and panics on it, exit code 1, before or just after it
# starts listening; its liveness probe fails with connection refused, and twice
# it killed a container that hung on the message instead. The stack trace is in
# the logs. Loosening the probe only keeps a broken process up longer.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-worker
  creationTimestamp: '2026-05-01T08:00:00Z'
  labels:
    app: payments-worker
  annotations:
    deployment.kubernetes.io/revision: '9'
spec:
  replicas: 3
  selector:
    matchLabels:
      app: payments-worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: payments-worker
    spec:
      containers:
      - name: app
        image: example/payments-worker:2.11.1
        ports:
        - containerPort: 8080
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
