# The checks of the probe-restart-storm pack, in the order Themis reports them.
# They read what the kubelet said about the target's pods, how its containers
# last ended, and the probe timings of the current revision.
# docs/checks.md says what each field means and what the expressions see.
#
# Anyone who may create events in the namespace can write one that reads like
# the kubelet's, so an event never makes a check true by itself: the pod's
# status, which only the kubelet writes, has to show what the event says. When
# it doesn't, the check is unknown.

# The kubelet restarted a container because its liveness or startup probe
# failed: what a probe that is too strict does. The pod's status bears the
# event out when a container of the current revision restarted, and its last
# end, no earlier than the event's first kill and no earlier than its last,
# was a kill: exit code 137 or 143.
- name: probe_kills
  version: "3"
  description: The kubelet restarts a container because its liveness or startup probe fails
  topic: Restarts for failing probes
  whenFalse: The kubelet restarts no container for a failing liveness or startup probe
  reads: [target_events, pod_states]
  let:
    kills: >-
      target_events.events.filter(e, e.reason == "Killing" && e.object.startsWith("Pod/") &&
        (e.message.contains("failed liveness probe") || e.message.contains("failed startup probe")))
    borne: >-
      kills.filter(e, e.firstSeen != null && pod_states.pods.exists(p,
        "Pod/" + p.name == e.object && p.revision == current_revision &&
        p.containers.exists(c, !c.init && c.restartCount > 0 && c.lastTermination != null &&
          c.lastTermination.status == "terminated" && c.lastTermination.reason != "OOMKilled" &&
          c.lastTermination.exitCode != null && c.lastTermination.exitCode in [137, 143] &&
          c.lastTermination.finishedAt != null && c.lastTermination.finishedAt >= e.firstSeen &&
          (e.lastSeen == null || c.lastTermination.finishedAt >= e.lastSeen))))
  answers:
    - when: size(borne) > 0
      answer: true
      reason: "${borne[0].object}: ${borne[0].message}${borne[0].count > 1 ? ', ' + string(borne[0].count) + ' times' : ''}"
      cite: [ids.target_events, ids.pod_states]
      fact: >-
        The kubelet restarted a container of `${borne[0].object}` for failing its probe${borne[0].count > 1 ?
        ', ' + string(borne[0].count) + ' times' : ''}.
      headline: ${workload}'s probes restart its containers.
    - when: size(kills) > 0
      answer: unknown
      reason: "an event says ${kills[0].object}: ${kills[0].message}, but no container of that pod of revision ${current_revision} was killed and restarted since"
      cite: [ids.target_events, ids.pod_states]
      fact: An event says the kubelet restarted `${kills[0].object}` for a failing probe, but the pod's status doesn't show it.
    - answer: false
      reason: no event says a container was restarted for failing its liveness or startup probe
      cite: [ids.target_events]
      fact: No event says a container was restarted for failing its liveness or startup probe.

# Every probe failure the kubelet reported is a probe that ran out of time,
# not an answer: the container is slow to answer, rather than saying it is
# unhealthy or not listening. The pod's status bears a failure out when a pod
# of the current revision it names has a container that is running and isn't
# ready, or that restarted no earlier than the event's first failure and
# ended no earlier than its last: the kubelet probes only running containers.
- name: probe_timeouts
  version: "3"
  description: Probes fail by running out of time, not by an error answer
  topic: Probe timeouts
  reads: [target_events, pod_states]
  let:
    failed: >-
      target_events.events.filter(e, e.reason == "Unhealthy" &&
        ["Liveness probe failed", "Readiness probe failed", "Startup probe failed"].exists(m, e.message.startsWith(m)))
    answered: >-
      failed.filter(e, !["context deadline exceeded", "Client.Timeout exceeded", "timed out", "i/o timeout"]
        .exists(m, e.message.contains(m)))
    borne: >-
      failed.filter(e, pod_states.pods.exists(p, "Pod/" + p.name == e.object && p.revision == current_revision &&
        p.containers.exists(c, !c.init && ((!c.ready && c.state != null && c.state.status == "running") ||
          (e.firstSeen != null && c.restartCount > 0 &&
          c.lastTermination != null && c.lastTermination.finishedAt != null &&
          c.lastTermination.finishedAt >= e.firstSeen &&
          (e.lastSeen == null || c.lastTermination.finishedAt >= e.lastSeen))))))
  answers:
    - when: size(failed) == 0
      answer: false
      reason: no event says a probe failed
      cite: [ids.target_events]
    - when: size(answered) > 0
      answer: false
      reason: "a probe failed other than by running out of time: ${answered[0].object}: ${answered[0].message}"
      cite: [ids.target_events]
      fact: A probe of `${answered[0].object}` failed with an answer, not by running out of time.
    - when: size(borne) == 0
      answer: unknown
      reason: "an event says ${failed[0].object}: ${failed[0].message}, but no pod of revision ${current_revision} that the probe failures name is running and unready, or restarted since"
      cite: [ids.target_events, ids.pod_states]
    - answer: true
      reason: "every probe failure is a timeout, such as ${borne[0].object}: ${borne[0].message}"
      cite: [ids.target_events, ids.pod_states]
      fact: Every probe failure is a timeout, such as on `${borne[0].object}`.
      headline: ${workload}'s probes time out.

# A container of the current revision was killed at the first moment it could
# be: by its startup probe, or, without one, by its liveness probe no later
# than its initial delay, its failures and one more period of slack allow,
# plus the default 30 seconds to stop. A container killed that soon never
# passed its liveness probe, so it was killed while still starting. A startup
# probe kill counts when the pod's status bears it out, as for probe_kills.
- name: killed_during_startup
  version: "3"
  description: Containers are killed before they finish starting
  topic: Kills during startup
  whenFalse: No container is killed before it finishes starting
  reads: [target_events, rollout_history, pod_states]
  let:
    startup: >-
      target_events.events.filter(e, e.reason == "Killing" && e.message.contains("failed startup probe"))
    borne: >-
      startup.filter(e, e.firstSeen != null && pod_states.pods.exists(p,
        "Pod/" + p.name == e.object && p.revision == current_revision &&
        p.containers.exists(c, !c.init && c.restartCount > 0 && c.lastTermination != null &&
          c.lastTermination.status == "terminated" && c.lastTermination.reason != "OOMKilled" &&
          c.lastTermination.exitCode != null && c.lastTermination.exitCode in [137, 143] &&
          c.lastTermination.finishedAt != null && c.lastTermination.finishedAt >= e.firstSeen &&
          (e.lastSeen == null || c.lastTermination.finishedAt >= e.lastSeen))))
    probed: >-
      current == null ? [] : current.containers.filter(t, "liveness" in t.probes && !("startup" in t.probes))
    # Each as [pod/container, how long it ran].
    early: >-
      pod_states.pods.filter(p, p.revision == current_revision).map(p,
        p.containers.filter(c, !c.init && c.lastTermination != null &&
          c.lastTermination.status == "terminated" && c.lastTermination.reason != "OOMKilled" &&
          c.lastTermination.exitCode != null && c.lastTermination.exitCode in [0, 137, 143] &&
          c.lastTermination.startedAt != null && c.lastTermination.finishedAt != null &&
          probed.exists(t, t.name == c.name &&
            c.lastTermination.finishedAt - c.lastTermination.startedAt <= duration(string(
              t.probes.liveness.initialDelaySeconds +
              (t.probes.liveness.failureThreshold + 1) * t.probes.liveness.periodSeconds + 30) + "s")))
        .map(c, [p.name + "/" + c.name, c.lastTermination.finishedAt - c.lastTermination.startedAt])
      ).flatten()
  answers:
    - when: size(borne) > 0
      answer: true
      reason: "${borne[0].object}: ${borne[0].message}"
      cite: [ids.target_events, ids.pod_states]
      fact: The kubelet killed a container of `${borne[0].object}` for failing its startup probe.
      headline: ${workload}'s containers are killed before they finish starting.
    - when: current == null
      answer: unknown
      reason: the current revision is unknown
    - when: size(early) > 0
      answer: true
      reason: >-
        ${early[0][0]} ran ${early[0][1]} before it was stopped, as soon as its
        liveness probe could fail it: it never passed the probe
      cite: [ids.rollout_history, ids.pod_states]
      fact: >-
        `${early[0][0]}` ran ${early[0][1]} before it was stopped, as soon as its liveness probe could fail it,
        so it never passed the probe.
      headline: ${workload}'s containers are killed before they finish starting.
    - when: size(startup) > 0
      answer: unknown
      reason: "an event says ${startup[0].object}: ${startup[0].message}, but no container of that pod of revision ${current_revision} was killed and restarted since"
      cite: [ids.target_events, ids.pod_states]
    - when: size(probed) == 0
      answer: false
      reason: no container of revision ${current_revision} has a liveness probe without a startup probe, and none failed a startup probe
      cite: [ids.rollout_history, ids.target_events]
    - answer: false
      reason: no container of revision ${current_revision} was stopped as soon as its liveness probe could fail it
      cite: [ids.rollout_history, ids.pod_states, ids.target_events]

# A container ended by itself: it exited with an error, or ran out of memory.
# The kubelet stopping a container for a failed probe ends it with 0, 137 or
# 143, so other exit codes are the application failing, which no probe timing
# fixes.
- name: crashed_on_its_own
  version: "1"
  description: A container exits with an error or runs out of memory, rather than being stopped by the kubelet
  topic: Crashes
  whenFalse: No container exits with an error or runs out of memory
  reads: [pod_states]
  let:
    crashed: >-
      pod_states.pods.map(p, p.containers.filter(c, !c.init).map(c,
        [c.state, c.lastTermination].filter(s, s != null && s.status == "terminated" &&
          (s.reason == "OOMKilled" || (s.exitCode != null && !(s.exitCode in [0, 137, 143])))).map(s,
          p.name + "/" + c.name + " ended" + (s.exitCode != null ? " with exit code " + string(s.exitCode) : "") +
          (s.reason != "" ? " (" + s.reason + ")" : ""))
      ).flatten()).flatten()
    # For the fact: each as [pod/container, how it ended].
    ends: >-
      pod_states.pods.map(p, p.containers.filter(c, !c.init).map(c,
        [c.state, c.lastTermination].filter(s, s != null && s.status == "terminated" &&
          (s.reason == "OOMKilled" || (s.exitCode != null && !(s.exitCode in [0, 137, 143])))).map(s,
          [p.name + "/" + c.name, (s.exitCode != null ? " with exit code " + string(s.exitCode) : "") +
          (s.reason != "" ? " (" + s.reason + ")" : "")])
      ).flatten()).flatten()
  answers:
    - when: size(crashed) > 0
      answer: true
      reason: ${crashed[0]}
      cite: [ids.pod_states]
      fact: "`${ends[0][0]}` ended by itself${ends[0][1]}, not stopped by the kubelet."
      headline: ${workload}'s containers crash on their own.
    - answer: false
      reason: no container ended with an error or ran out of memory; any that ended were stopped
      cite: [ids.pod_states]
