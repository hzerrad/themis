# The checks of the oom-limit-too-low pack, in the order Themis reports them.
# They read the pod states, the events, and container_memory, what the
# install's metrics source says of the current revision's containers. Whether
# the latest rollout brought the kills is for Themis's own
# failures_came_with_rollout, which the profile runs too. docs/checks.md says
# what each field means and what the expressions see.

# A container of the current revision was killed for running out of memory.
- name: oom_killed_current_revision
  version: "1"
  description: A container of the current version was OOMKilled
  topic: OOM kills in the current version
  whenFalse: No container of the current version was OOMKilled
  reads: [pod_states]
  let:
    pods: pod_states.pods.filter(p, p.revision == current_revision)
    killed: >-
      pods.map(p,
        p.containers
          .filter(c, [c.state, c.lastTermination].exists(s, s != null && s.reason == "OOMKilled"))
          .map(c, p.name + "/" + c.name)
      ).flatten()
  answers:
    - when: size(killed) > 0
      answer: true
      reason: ${killed[0]} of revision ${current_revision} was OOMKilled
      cite: [ids.pod_states]
    - when: size(pods) == 0
      answer: unknown
      reason: no pods of the current revision
    - answer: false
      reason: none of the ${size(pods)} pods of revision ${current_revision} was OOMKilled
      cite: [ids.pod_states]

# A metrics source says how much memory the containers used at their peak.
# Only a source with history, such as Prometheus, can; the Kubernetes metrics
# API knows only the present.
- name: memory_data_available
  version: "1"
  description: A metrics source says how much memory the containers used at their peak
  topic: Peak memory use
  whenFalse: No metrics source says how much memory the containers used at their peak
  availability: true
  reads: [container_memory]
  answers:
    - when: container_memory.peak.unavailable != ""
      answer: false
      reason: "no peak memory figures: ${container_memory.peak.unavailable}"
      cite: [ids.container_memory]
    - answer: true
      reason: ${container_memory.peak.source} says each container's peak memory over ${container_memory.window}
      cite: [ids.container_memory]

# A container with a memory limit used 90% or more of it at its peak. A
# container the kernel kills for its limit got there; one that never came
# close was killed for something else, such as its node running short.
- name: memory_at_limit_before_kill
  version: "1"
  description: A container's memory reached its limit at its peak
  topic: Memory at the limit
  whenFalse: No container's memory reached its limit at its peak
  reads: [container_memory]
  let:
    limited: container_memory.containers.filter(c, c.limitBytes != null)
    measured: limited.filter(c, c.peakOfLimit != null)
    near: >-
      measured.filter(c, c.peakOfLimit >= 0.9).map(c,
        c.name + " peaked at " + string(int(c.peakOfLimit * 100.0 + 0.5)) + "% of its memory limit of " +
        string(c.limitBytes / 1048576) + "Mi over " + container_memory.window)
  answers:
    - when: size(limited) == 0
      answer: false
      reason: no container has a memory limit
      cite: [ids.container_memory]
    - when: container_memory.peak.unavailable != ""
      answer: unknown
      reason: "no peak memory figures: ${container_memory.peak.unavailable}"
      cite: [ids.container_memory]
    - when: size(near) > 0
      answer: true
      reason: ${near[0]}
      cite: [ids.container_memory]
    - when: size(measured) == 0
      answer: unknown
      reason: no peak memory figure for the ${size(limited)} container(s) with a memory limit
      cite: [ids.container_memory]
    - answer: false
      reason: none of the ${size(measured)} container(s) with a memory limit peaked at 90% or more of it over ${container_memory.window}
      cite: [ids.container_memory]

# Every OOM kill of the current revision that says when the container started
# came after it had run an hour or more. Kills soon after start mean the
# container needs more than its limit to run at all; kills after hours mean
# its memory grew while it ran.
- name: oom_after_long_run
  version: "1"
  description: Its containers ran an hour or more before each OOM kill
  topic: Run time before OOM kills
  reads: [pod_states]
  let:
    kills: >-
      pod_states.pods.filter(p, p.revision == current_revision).map(p,
        p.containers.map(c,
          [c.state, c.lastTermination].filter(s, s != null && s.reason == "OOMKilled")
        ).flatten()
      ).flatten()
    timed: kills.filter(s, s.startedAt != null && s.finishedAt != null)
    runs: timed.map(s, s.finishedAt - s.startedAt).sort()
  answers:
    - when: size(kills) == 0
      answer: false
      reason: no container of revision ${current_revision} was OOMKilled
      cite: [ids.pod_states]
    - when: size(timed) == 0
      answer: unknown
      reason: no OOM kill says how long the container had run
      cite: [ids.pod_states]
    - when: runs[0] < duration("1h")
      answer: false
      reason: a container of revision ${current_revision} was OOMKilled after running ${runs[0]}
      cite: [ids.pod_states]
    - answer: true
      reason: the shortest run before an OOM kill of revision ${current_revision} lasted ${runs[0]}
      cite: [ids.pod_states]

# A pod of the target was evicted because its node was short of memory: the
# node, not the container's limit, ran out. An event says so; the pod's status
# bears it out when the pod is still there and has failed, as an evicted pod
# does. An event the status doesn't bear out leaves it unknown, and the
# policy refuses a raise until it is false.
- name: evicted_for_node_memory
  version: "2"
  description: Its pods were evicted because their node was short of memory
  topic: Evictions for node memory
  whenFalse: No pod was evicted for its node's memory
  reads: [target_events, pod_states]
  let:
    evicted: >-
      target_events.events.filter(e, e.reason == "Evicted" && e.message.contains("low on resource: memory"))
    borne: >-
      evicted.filter(e, pod_states.pods.exists(p, "Pod/" + p.name == e.object && p.phase == "Failed"))
  answers:
    - when: size(borne) > 0
      answer: true
      reason: "${borne[0].object} was evicted: ${borne[0].message}"
      cite: [ids.target_events, ids.pod_states]
    - when: size(evicted) > 0
      answer: unknown
      reason: "an event says ${evicted[0].object} was evicted for its node's memory, but no such pod has failed"
      cite: [ids.target_events, ids.pod_states]
    - answer: false
      reason: no pod was evicted for its node's memory
      cite: [ids.target_events]
