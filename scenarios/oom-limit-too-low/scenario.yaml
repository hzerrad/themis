# A Deployment's containers OOMKilled at their limit, when no new version
# brought the kills: Themis may suggest raising their memory limit, with a
# person's approval.
# README.md says what it covers; docs/scenarios.md says what each field means.

name: oom-limit-too-low
description: A Deployment's containers run out of memory at their limit, and no new version brought it on; Themis may suggest raising their memory limit, which a person approves.

# What the investigator may name as the root cause, most likely first, and
# what each means.
rootCauses:
  - name: memory_limit_too_low
    description: it needs more memory than its limit, from more load or data
  - name: memory_leak
    description: its memory grows while it runs until it is killed, whatever the limit
  - name: memory_limit_regression
    description: the new revision's memory limit is too low
  - name: node_memory_pressure
    description: its node ran short of memory and evicted or killed its pods
  - name: insufficient_evidence
    description: the evidence can't tell
  - name: other
    description: "none of these: say what in the summary"

# The profile Themis uses for these incidents. It answers the OOM alerts the
# rollout-regression pack answers too, so an incident from them gets both
# packs: a rollback when a new version brought the kills and the one before it
# was healthy, a higher limit otherwise. Its priority is below that pack's.
profile:
  priority: 90
  match:
    alertNames: [KubePodOOMKilled, KubePodCrashLooping]
    targetKinds: [Deployment.apps]
  # Without a metrics source container_memory is a gap: the pod states still
  # show the OOM kills, which are enough to act on.
  evidence:
    initial: [pod_states, container_memory, rollout_history, target_events, referenced_config]
    allowed: [pod_states, container_memory, rollout_history, target_events, referenced_config, container_logs_tail]
  checks:
    - oom_killed_current_revision
    - earlier_revision_healthy
    - rollout_recent
    - memory_data_available
    - memory_at_limit_before_kill
    - oom_after_long_run
    - evicted_for_node_memory
  capabilities: [deployment.set-resources]
  # A raise is refused unless a container of the current version was
  # OOMKilled.
  justifiedBy:
    deployment.set-resources: [oom_killed_current_revision]
  # The failure itself: while one is true, Themis never closes the incident
  # with no change on its own. It refers it to a person.
  symptoms: [oom_killed_current_revision, evicted_for_node_memory]
  # What the investigator is told about these incidents: when raising the
  # memory limit is right and when it is wrong. It names checks, never root
  # causes, and gives a starting size as guidance only: the checks and the
  # policy below decide, and a person approves the size.
  guidance: |
    Raising a container's memory limit is right when containers are killed
    for memory and need more than their limit, and no new version brought
    the kills: oom_killed_current_revision is true,
    memory_at_limit_before_kill is true, or unknown without peak figures, and
    nothing below applies. With no earlier version to go back to, or one
    that failed too (earlier_revision_healthy is false), the limit is what to
    change, however recently the version rolled out. Raise the memory limit
    of the killed containers only, citing pod_states, and container_memory
    when it has figures. Size it from the evidence: the peak plus 25% when
    container_memory shows it, otherwise 1.5 times the current limit. Never
    lower a value, never change CPU, never set a limit where there was none,
    and never remove one.

    Missing memory figures are no reason to decline: OOM kills in the pod
    states are enough to act on. They only mean the size can't come from the
    peak.

    Don't raise it, and say what you found instead, when:
    - earlier_revision_healthy is true: the version before this one runs
      healthy, so this one brought the kills. The same holds while
      earlier_revision_healthy is unknown and rollout_recent is true. Whether
      to roll it back is a rollback's question, under its own guidance, never
      a reason to raise the limit here.
    - oom_after_long_run is true, the containers are killed again and again
      after hours of running, and the limit held for days before: memory
      that grows until the container is killed, at any limit. A higher limit
      only delays the next kill; say so and leave it to a person.
    - memory_at_limit_before_kill is false: the containers never came near
      their limit, so the limit isn't what killed them.
    - evicted_for_node_memory is true: the node ran short of memory. A
      higher limit doesn't give it more, and can make it worse.
    - oom_killed_current_revision is not true: a container killed with exit
      code 137 and no OOMKilled reason may have been stopped for another
      reason. Don't infer a memory kill from restarts, exit codes or the
      alert alone; say what is missing.
  policy:
    mode: guarded
    approvalTimeout: 30m
    rules:
      # OOM kills are the only reason this pack raises memory, and
      # justifiedBy asks for them. A new version must not have brought them: a
      # raise is refused while the version before it is healthy, and, when its
      # health can't be seen, within 6 hours of the rollout. With no earlier
      # version, or one that failed too, there is nothing to go back to. A
      # raise is refused too when the containers never reached their limit, or
      # the node ran short of memory, or may have. A restore puts back what
      # Themis changed.
      - name: raise-needs-oom-kills-no-new-version-brought
        when: >-
          action.restore != "true" &&
          (predicates.earlier_revision_healthy == "true" ||
           (predicates.earlier_revision_healthy != "false" && predicates.rollout_recent != "false") ||
           predicates.memory_at_limit_before_kill == "false" ||
           predicates.evicted_for_node_memory != "false")
        decision: deny
      # The fix here raises a memory limit that exists, and may raise a
      # memory request with it: no CPU, no lower value, no new limit where
      # there was none, which could kill a container that wasn't.
      - name: raise-a-memory-limit-only
        when: >-
          action.capability == "deployment.set-resources" && action.restore != "true" &&
          ("cpu" in change || !("memory" in change) || change.memory != "increase" ||
           change.exists(k, k.endsWith(".memory.limit") && change[k] == "set") ||
           !change.exists(k, k.endsWith(".memory.limit") && change[k] == "increase"))
        decision: deny
      - name: raise-needs-approval
        when: action.restore != "true"
        decision: require_approval
  # A raise worked only when no container of the new version is OOMKilled.
  verification:
    window: 10m
    stability: 5m
    checks: [oom_killed_current_revision]
