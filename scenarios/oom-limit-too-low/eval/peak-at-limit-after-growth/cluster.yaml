# Revision 2 has run for ten days. The product import doubled the catalog
# this morning, and the app loads it into memory at start: since 11:40 every
# container is OOMKilled a few minutes after it starts, at its 512Mi limit.
# Raising the memory limit is right.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  creationTimestamp: '2026-09-01T09:00:00Z'
  labels:
    app: catalog
  annotations:
    deployment.kubernetes.io/revision: '2'
spec:
  replicas: 3
  selector:
    matchLabels:
      app: catalog
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: catalog
    spec:
      containers:
      - name: app
        image: example/catalog:3.8.0
        resources:
          requests:
            cpu: 250m
            memory: 384Mi
          limits:
            memory: 512Mi
status:
  observedGeneration: 2
  replicas: 3
  updatedReplicas: 3
  readyReplicas: 1
  availableReplicas: 1
  unavailableReplicas: 2
  conditions:
  - type: Available
