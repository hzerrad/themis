name: memory-grows-until-killed
version: 1
description: Revision 3 has run for twelve days; for two, each container's memory climbs while it runs and it is OOMKilled
  after five to six hours, again and again. A higher limit only delays the next kill.
tags: [memory, oom, leak]
source: synthetic
difficulty: hard
incident_class: oom_limit_too_low
now: '2026-11-04T14:00:00Z'
target: {kind: Deployment, namespace: shop, name: sessions}
evidence:
  initial: [pod_states, container_memory, rollout_history, target_events, referenced_config]
  allowed: [pod_states, container_memory, rollout_history, target_events, referenced_config, container_logs_tail]
fix:
  capability: deployment.set-resources
  params:
    containers:
      app:
        limits:
          memory: 1280Mi
truth:
  root_causes: [memory_leak]
  decision: abstain
  predicates:
    oom_killed_current_revision: 'true'
    oom_without_recent_rollout: 'true'
    memory_data_available: 'true'
    memory_at_limit_before_kill: 'true'
    oom_after_long_run: 'true'
    evicted_for_node_memory: 'false'
  policy: require_approval
