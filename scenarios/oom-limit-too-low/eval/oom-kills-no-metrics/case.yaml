name: oom-kills-no-metrics
version: 1
description: Revision 4 has run for five days; both workers are OOMKilled minutes into a larger batch. There is no metrics
  source, so only the pod states show the kills.
tags: [memory, oom, no-metrics]
source: synthetic
difficulty: medium
incident_class: oom_limit_too_low
now: '2026-11-04T14:00:00Z'
target: {kind: Deployment, namespace: shop, name: reports}
evidence:
  initial: [pod_states, container_memory, rollout_history, target_events, referenced_config]
  allowed: [pod_states, container_memory, rollout_history, target_events, referenced_config, container_logs_tail]
fix:
  capability: deployment.set-resources
  params:
    containers:
      app:
        limits:
          memory: 1536Mi
truth:
  root_causes: [memory_limit_too_low]
  decision: propose
  required_citations: [pod_states]
  predicates:
    oom_killed_current_revision: 'true'
    earlier_revision_healthy: 'unknown'
    rollout_recent: 'false'
    memory_data_available: unknown
    memory_at_limit_before_kill: unknown
    oom_after_long_run: 'false'
    evicted_for_node_memory: 'false'
  policy: require_approval
