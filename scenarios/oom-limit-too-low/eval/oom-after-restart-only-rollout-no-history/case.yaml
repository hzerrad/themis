name: oom-after-restart-only-rollout-no-history
version: 1
description: 'Revision 2 restarted revision 1''s pods an hour ago, changing only an annotation, and 40 minutes later more traffic got them OOMKilled at their 512Mi limit. There is no metrics source, so nothing shows how revision 1 ran, but the rollout changed nothing the pods run: raising the limit is right, and the rollback is refused.'
tags: [memory, oom, rollout, combined, restart]
source: synthetic
difficulty: hard
incident_class: oom_limit_too_low
alert: KubePodOOMKilled
now: '2026-11-04T14:00:00Z'
target: {kind: Deployment, namespace: shop, name: checkout}
evidence:
  initial: [pod_states, container_memory, rollout_history, target_events, referenced_config, revision_health]
  allowed: [pod_states, container_memory, rollout_history, target_events, referenced_config, container_logs_tail, revision_health]
fix:
  capability: deployment.set-resources
  params:
    containers:
      app:
        limits: {memory: 768Mi}
truth:
  root_causes: [memory_limit_too_low]
  decision: propose
  required_citations: [pod_states]
  predicates:
    oom_killed_current_revision: 'true'
    earlier_revision_healthy: unknown
    rollout_changed_the_app: 'false'
    failures_came_with_rollout: 'false'
    failure_onset_after_rollout: 'true'
    config_changed_before_failure: 'false'
    memory_data_available: unknown
    memory_at_limit_before_kill: unknown
    evicted_for_node_memory: 'false'
  policy: require_approval
