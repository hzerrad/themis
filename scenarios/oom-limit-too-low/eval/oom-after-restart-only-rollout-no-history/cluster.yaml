# Revision 2 is a kubectl rollout restart of revision 1 an hour ago: its pod
# template differs only by the restartedAt annotation, so its pods run the same
# image, settings and 512Mi limit. At 13:30 a campaign doubled checkout's
# traffic, and from 13:40 its containers are OOMKilled at the limit, again and
# again. Revision 1's pods are gone, and the install has no metrics source: nothing
# shows how they ran. That doesn't matter here: the rollout changed nothing the
# pods run, so rolling back would restart them the same way. The OOM kills in
# the pod states are enough to size a higher limit from.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  creationTimestamp: '2026-10-20T08:00:00Z'
  labels:
    app: checkout
  annotations:
    deployment.kubernetes.io/revision: '2'
spec:
  replicas: 3
  selector:
    matchLabels:
      app: checkout
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: checkout
      annotations:
        kubectl.kubernetes.io/restartedAt: '2026-11-04T13:00:00Z'
    spec:
      containers:
      - name: app
        image: example/checkout:2.5.0
        resources:
          requests:
            cpu: 250m
            memory: 384Mi
          limits:
            memory: 512Mi
status:
  observedGeneration: 2
  replicas: 3
