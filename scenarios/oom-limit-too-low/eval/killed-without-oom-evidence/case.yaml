name: killed-without-oom-evidence
version: 1
description: Containers restart every few minutes, killed with exit code 137, but nothing says they ran out of memory, and
  there is no metrics source.
tags: [memory, crashloop, no-metrics]
source: synthetic
difficulty: medium
incident_class: oom_limit_too_low
alert: KubePodCrashLooping
now: '2026-11-04T14:00:00Z'
target: {kind: Deployment, namespace: shop, name: ledger}
evidence:
  initial: [pod_states, container_memory, rollout_history, target_events, referenced_config]
  allowed: [pod_states, container_memory, rollout_history, target_events, referenced_config, container_logs_tail]
fix:
  capability: deployment.set-resources
  params:
    containers:
      app:
        limits:
          memory: 1152Mi
truth:
  root_causes: [insufficient_evidence]
  decision: abstain
  predicates:
    oom_killed_current_revision: 'false'
    oom_without_recent_rollout: 'false'
    memory_data_available: unknown
    memory_at_limit_before_kill: unknown
    oom_after_long_run: 'false'
    evicted_for_node_memory: 'false'
  policy: deny
