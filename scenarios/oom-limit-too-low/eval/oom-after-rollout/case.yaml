name: oom-after-rollout
version: 1
description: Revision 2, rolled out 40 minutes ago, lowered the memory limit to 256Mi and is OOMKilled at it; revision 1 is
  healthy. Both packs answer the alert; rolling back is right, raising the limit is refused.
tags: [memory, oom, rollout, combined]
source: synthetic
difficulty: medium
incident_class: rollout_regression
alert: KubePodOOMKilled
now: '2026-11-04T14:00:00Z'
target: {kind: Deployment, namespace: shop, name: checkout}
evidence:
  initial: [pod_states, container_memory, rollout_history, target_events, referenced_config]
  allowed: [pod_states, container_memory, rollout_history, target_events, referenced_config, container_logs_tail]
fix:
  capability: deployment.set-resources
  params:
    containers:
      app:
        limits:
          memory: 512Mi
truth:
  root_causes: [memory_limit_regression]
  decision: propose
  acceptable_revisions: [1]
  required_citations: [pod_states]
  predicates:
    oom_killed_current_revision: 'true'
    earlier_revision_healthy: 'true'
    rollout_recent: 'true'
    memory_data_available: 'true'
    memory_at_limit_before_kill: 'true'
    oom_after_long_run: 'false'
    evicted_for_node_memory: 'false'
  policy: deny
