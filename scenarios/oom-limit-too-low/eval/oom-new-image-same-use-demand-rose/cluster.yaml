# Revision 2, three days old, changed the image, from 2.4.0 to 2.5.0, and kept
# the 512Mi memory limit. Prometheus's history shows its containers using 63%
# of the limit on average over their first three days, against 60% for
# revision 1's over theirs, and in their last three days. This morning a partner started
# sending checkout twice its usual orders, and since 09:00 its containers are
# OOMKilled at the limit. Revision 1 ran ten days without failing, longer than
# revision 2 ran before its first failure, but the two versions use the same
# memory at the same age: the new demand needs a higher limit, and rolling
# back can't help.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  creationTimestamp: '2026-10-25T10:00:00Z'
  labels:
    app: checkout
  annotations:
    deployment.kubernetes.io/revision: '2'
spec:
  replicas: 3
  selector:
    matchLabels:
      app: checkout
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: checkout
    spec:
      containers:
      - name: app
        image: example/checkout:2.5.0
        resources:
          requests:
            cpu: 250m
            memory: 384Mi
          limits:
            memory: 512Mi
status:
  observedGeneration: 2
