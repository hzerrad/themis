name: oom-new-image-same-use-demand-rose
version: 1
description: Revision 2 changed the image three days ago, and its containers are OOMKilled at the 512Mi limit since this morning,
  when demand doubled. Prometheus's history shows them using 63% of the limit over their first three days, against 60%
  for revision 1's over theirs. Raising the limit is right; the rollback is refused.
tags: [memory, oom, rollout, combined, history, use]
source: synthetic
difficulty: hard
incident_class: oom_limit_too_low
alert: KubePodOOMKilled
now: '2026-11-07T10:00:00Z'
target: {kind: Deployment, namespace: shop, name: checkout}
evidence:
  initial: [pod_states, container_memory, rollout_history, target_events, referenced_config, revision_health]
  allowed: [pod_states, container_memory, rollout_history, target_events, referenced_config, container_logs_tail, revision_health]
fix:
  capability: deployment.set-resources
  params:
    containers:
      app:
        limits: {memory: 768Mi}
truth:
  root_causes: [memory_limit_too_low]
  decision: propose
  required_citations: [pod_states]
  predicates:
    oom_killed_current_revision: 'true'
    earlier_revision_healthy: 'true'
    rollout_changed_the_app: 'true'
    failures_came_with_rollout: 'false'
    failure_onset_after_rollout: 'true'
    config_changed_before_failure: 'false'
    memory_data_available: 'true'
    memory_at_limit_before_kill: 'true'
    oom_after_long_run: 'false'
    evicted_for_node_memory: 'false'
  policy: require_approval
