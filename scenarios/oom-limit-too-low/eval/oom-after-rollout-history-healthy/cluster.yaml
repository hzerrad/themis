# Revision 2, rolled out an hour ago, changed only the image, and kept the
# 512Mi memory limit revision 1 has. The rollout finished at 13:06: revision
# 1's pods are gone, and revision 2's three pods were ready. From 13:40 its
# containers are OOMKilled at the limit, again and again. The pods alone
# can't say whether revision 1 would do better: what the install's metrics
# source kept of revision 1's pods decides it.
#
# Prometheus's history: revision 1 ran 15 days without a restart, and
# revision 2 failed 40 minutes after its rollout. Rolling back is right.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  creationTimestamp: '2026-10-20T08:00:00Z'
  labels:
    app: checkout
  annotations:
    deployment.kubernetes.io/revision: '2'
spec:
  replicas: 3
  selector:
    matchLabels:
      app: checkout
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: checkout
    spec:
      containers:
      - name: app
        image: example/checkout:2.5.0
        resources:
          requests:
            cpu: 250m
            memory: 384Mi
          limits:
            memory: 512Mi
status:
