# Revision 2, rolled out 30 minutes ago, changed only the image, and kept the
# 256Mi limit. Its pod is OOMKilled at that limit. Revision 1's pods, still
# running while the rollout is stuck, are OOMKilled too: since the morning,
# before the rollout and after it. Stock data grew, and every version needs
# more than its limit. A rollback goes back to a version that fails the same
# way: raising the memory limit is right.
