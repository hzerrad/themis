name: oom-new-image-uses-more-memory
version: 1
description: Revision 2 changed only the image, three days ago, and its containers are OOMKilled at the 512Mi limit since this
  morning. Prometheus's history shows them using 93% of the limit over their first two days, where revision 1's used 45%
  over the same time. Both packs answer the alert; rolling back is right, raising the limit is refused.
tags: [memory, oom, rollout, combined, history, use]
source: synthetic
difficulty: hard
incident_class: rollout_regression
alert: KubePodOOMKilled
now: '2026-11-06T10:00:00Z'
target: {kind: Deployment, namespace: shop, name: checkout}
evidence:
  initial: [pod_states, container_memory, rollout_history, target_events, referenced_config, revision_health]
  allowed: [pod_states, container_memory, rollout_history, target_events, referenced_config, container_logs_tail, revision_health]
fix:
  capability: deployment.set-resources
  params:
    containers:
      app:
        limits: {memory: 768Mi}
truth:
  root_causes: [memory_limit_regression]
  decision: propose
  fix:
    capability: deployment.rollback-to-revision
    params: {revision: 1}
  acceptable_revisions: [1]
  required_citations: [pod_states]
  predicates:
    oom_killed_current_revision: 'true'
    earlier_revision_healthy: 'true'
    rollout_changed_the_app: 'true'
    failures_came_with_rollout: 'true'
    failure_onset_after_rollout: 'true'
    config_changed_before_failure: 'false'
    memory_data_available: 'true'
    memory_at_limit_before_kill: 'true'
    oom_after_long_run: 'false'
    evicted_for_node_memory: 'false'
  policy: deny
