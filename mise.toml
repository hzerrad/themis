# Development tools, pinned. Run `mise install` in the repository. Tools that
# Go can run (buf, golangci-lint, kind, envtest) are pinned in tools/go.mod
# instead and run through `go tool`.
[tools]
# Keep in step with the toolchain line in go.mod.
go = "1.27.3"
helm = "4.3.1"
# Inside the supported Kubernetes window (README, "Supported versions").
kubectl = "1.37.2"
ollama = "0.40.13"
trivy = "0.76.0"
uv = "0.13.6"
