# yaml-language-server: $schema=../../deploy/config/themis.schema.json
#
# Configuration for `make run`: themis-core on your machine against the local
# kind cluster. The intake token is generated by `make run` into bin/dev/.

enrolledNamespaces:
  - default
  - shop

intake:
  bearerTokenFile: bin/dev/intake-token

investigators:
  bearerTokenFile: bin/dev/investigator-token

profiles:
  - name: rollout-regression
    priority: 100
    match:
      alertNames:
        - KubePodCrashLooping
        - KubeDeploymentReplicasMismatch
        - KubePodOOMKilled
      targetKinds:
        - Deployment.apps
    evidence:
      initial: [rollout_history, pod_states, target_events]
      allowed: [rollout_history, pod_states, target_events, container_logs_tail]
    capabilities: [deployment.rollback-to-revision]
