# The checks Themis ships with, about rollouts, in the order it reports them.
# docs/checks.md says what each field means and what the expressions see.

- name: rollout_recent
  version: "1"
  description: A rollout happened recently
  reads: [rollout_history]
  answers:
    - when: rollout_at == null
      answer: unknown
      reason: the current revision or its rollout time is unknown
    - when: now - rollout_at <= duration("6h")
      answer: true
      reason: revision ${current.revision} rolled out ${now - rollout_at} ago
      cite: [ids.rollout_history]
    - answer: false
      reason: revision ${current.revision} rolled out ${now - rollout_at} ago, beyond ${duration("6h")}
      cite: [ids.rollout_history]

# A failure without a time could be earlier than the rollout.
- name: failure_onset_after_rollout
  version: "1"
  description: The failures started after the rollout
  reads: [rollout_history, pod_states]
  let:
    early: failures.filter(f, f.at != null && f.at < rollout_at)
    undated: failures.filter(f, f.at == null)
  answers:
    - when: rollout_at == null
      answer: unknown
      reason: the rollout time is unknown
    - when: size(failures) == 0
      answer: unknown
      reason: no failure observed
    - when: size(early) > 0
      answer: false
      reason: ${early[0].what} at ${early[0].at} predates revision ${current.revision} at ${rollout_at}
      cite: [ids.rollout_history, "early[0].id"]
    - when: size(undated) > 0
      answer: unknown
      reason: ${size(undated)} failures have no time
    - answer: true
      reason: all ${size(failures)} failures follow revision ${current.revision} at ${rollout_at}
      cite: [ids.rollout_history, "failures.map(f, f.id)"]

# The revision before the current one runs ready pods that never failed.
- name: prior_revision_was_healthy
  version: "1"
  description: The previous version was healthy
  reads: [rollout_history, pod_states]
  let:
    pods: pod_states.pods.filter(p, p.revision == prior.revision)
    # What is wrong with each pod, in order: its containers that died, then
    # that it isn't ready.
    problems: >-
      pods.map(p,
        p.containers
          .filter(c, c.lastTermination != null && c.lastTermination.reason != "Completed")
          .map(c, "pod " + p.name + " of revision " + prior.revision + ": " + c.name + " " + c.lastTermination.reason)
        + (p.ready ? [] : ["pod " + p.name + " of revision " + prior.revision + " is not ready"])
      ).flatten()
  answers:
    - when: current == null
      answer: unknown
      reason: the current revision is unknown
    - when: prior == null
      answer: unknown
      reason: there is no prior revision
    - when: size(problems) > 0
      answer: false
      reason: ${problems[0]}
      cite: [ids.rollout_history, ids.pod_states]
    - when: size(pods) == 0
      answer: unknown
      reason: revision ${prior.revision} has no pods left to judge
    - answer: true
      reason: ${size(pods)} pods of revision ${prior.revision} are ready and never failed
      cite: [ids.rollout_history, ids.pod_states]

# A container of the current revision was OOMKilled.
- name: oom_killed_new_revision
  version: "1"
  description: The new version runs out of memory
  reads: [pod_states]
  let:
    pods: pod_states.pods.filter(p, p.revision == current_revision)
    killed: >-
      pods.map(p,
        p.containers
          .filter(c, [c.state, c.lastTermination].exists(s, s != null && s.reason == "OOMKilled"))
          .map(c, p.name + "/" + c.name)
      ).flatten()
  answers:
    - when: size(killed) > 0
      answer: true
      reason: ${killed[0]} of revision ${current_revision} was OOMKilled
      cite: [ids.pod_states]
    - when: size(pods) == 0
      answer: unknown
      reason: no pods of the current revision
    - answer: false
      reason: none of the ${size(pods)} pods of revision ${current_revision} was OOMKilled
      cite: [ids.pod_states]

# The target carries GitOps markers or is written by a GitOps controller.
- name: gitops_managed
  version: "1"
  description: Managed by GitOps (Argo CD or Flux)
  reads: [rollout_history]
  let:
    markers: rollout_history.deployment.ownershipMarkers.map(k, k).sort()
    managers: >-
      rollout_history.deployment.fieldManagers.filter(m, m in
        ["argocd-controller", "argocd-application-controller", "kustomize-controller", "helm-controller"])
  answers:
    - when: size(markers) > 0
      answer: true
      reason: the target carries ${markers[0]}
      cite: [ids.rollout_history]
    - when: size(managers) > 0
      answer: true
      reason: the target is managed by ${managers[0]}
      cite: [ids.rollout_history]
    - answer: false
      reason: no GitOps markers or managers
      cite: [ids.rollout_history]

# A ConfigMap the target refers to changed after the current revision rolled
# out and no later than the first failure, so rolling back the revision might
# not undo the cause. A write within a minute of the rollout is part of the
# same release: tools apply a release's objects in any order. Secrets are never
# read, so a change to one can't be seen, and the reason says so.
- name: config_changed_before_failure
  version: "1"
  description: Its config changed before the failures began
  reads: [referenced_config, rollout_history, pod_states]
  let:
    absent: referenced_config.refs.filter(r, r.kind == "ConfigMap" && r.missing && !r.optional)
    # The first ConfigMap that settles it: one that doesn't say when it last
    # changed, or one that changed between the rollout and the first failure.
    settling: >-
      referenced_config.refs.filter(r, r.kind == "ConfigMap" && !r.missing && (r.changedAt == null ||
        (r.changedAt > rollout_at + duration("1m") && r.changedAt <= first_failure.at)))
    secrets: size(referenced_config.refs.filter(r, r.kind == "Secret"))
  answers:
    - when: size(absent) > 0
      answer: unknown
      reason: ConfigMap ${absent[0].name} is referenced but doesn't exist
      cite: [ids.referenced_config]
    - when: rollout_at == null
      answer: unknown
      reason: the rollout time is unknown
    - when: first_failure == null
      answer: unknown
      reason: no failure with a known time
    - when: size(settling) > 0 && settling[0].changedAt == null
      answer: unknown
      reason: ConfigMap ${settling[0].name} doesn't say when it last changed
      cite: [ids.referenced_config]
    - when: size(settling) > 0
      answer: true
      reason: ConfigMap ${settling[0].name} changed at ${settling[0].changedAt}, after revision ${current.revision} and before ${first_failure.what}
      cite: [ids.referenced_config, ids.rollout_history, first_failure.id]
    - answer: false
      reason: >-
        no referenced ConfigMap changed between the rollout and the first
        failure${secrets > 0 ? "; " + string(secrets) + " referenced Secret(s) can't be checked" : ""}
      cite: [ids.referenced_config, ids.rollout_history, first_failure.id]
