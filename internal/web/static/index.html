<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Themis</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header>
    <a href="#" class="brand">Themis</a>
    <span class="tagline">investigates Kubernetes incidents and fixes them with your approval</span>
    <span id="whoami" class="muted"></span>
    <button id="logout" hidden>Sign out</button>
  </header>
  <div id="setup" class="setup" hidden>
    You're an admin because you opened Themis through kubectl port-forward. This lasts until an admin signs in for real, so set up sign-in for your team.
  </div>
  <main id="main"></main>
</body>
</html>
