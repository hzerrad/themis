# Themis's own checks: every scenario pack's profile may name them, and
# Themis runs gitops_managed for every incident with a fix on offer, since its
# answer decides whether Themis may change the workload at all.
# evidence_has_instructions is there for policy rules to read; no pack runs
# it, and governance decides it again over all the incident's evidence.
# docs/checks.md says what each field means and what the expressions see.

# The current revision replaced an earlier one within the last 6 hours. A
# Deployment's first revision replaced none: creating it isn't a rollout. A
# rollout that was Themis's own fix says so: it brought no new version. It
# is for an operator's own profiles to show: no pack runs it, and no fix
# Themis offers depends on how long ago a rollout was.
- name: rollout_recent
  version: "3"
  description: A rollout happened recently
  topic: Recent rollout
  whenFalse: No recent rollout
  reads: [rollout_history]
  answers:
    - when: rollout_at == null
      answer: unknown
      reason: the current revision or its rollout time is unknown
    - when: prior == null
      answer: false
      reason: there is no revision before revision ${current.revision}, so no rollout replaced one
      cite: [ids.rollout_history]
    - when: themis_fix != null && now - rollout_at <= duration("6h")
      answer: true
      reason: revision ${current.revision} rolled out ${now - rollout_at} ago, as Themis's fix on incident ${themis_fix.incident}
      cite: [ids.rollout_history, themis_fix.id]
    - when: now - rollout_at <= duration("6h")
      answer: true
      reason: revision ${current.revision} rolled out ${now - rollout_at} ago
      cite: [ids.rollout_history]
    - answer: false
      reason: revision ${current.revision} rolled out ${now - rollout_at} ago, beyond ${duration("6h")}
      cite: [ids.rollout_history]

# The revision before the current one ran without failing: a version to go
# back to. Its pods, while there are any, say so: ready, and none of their
# containers died. Once they are gone, two sources tell: Themis's own record,
# when the current revision is its fix and the incident it fixed found the
# revision before failing; and the metrics history of how its pods ran while
# it was the current revision, without a restart or OOM kill. Without an
# earlier revision there is none, one that failed is no better, and with
# neither its pods nor a record of them, nothing tells.
- name: earlier_revision_healthy
  version: "3"
  description: The version before it is healthy, to go back to
  topic: Health of the version before it
  whenFalse: No healthy earlier version to go back to
  reads: [rollout_history, pod_states, revision_health]
  let:
    pods: pod_states.pods.filter(p, p.revision == prior.revision)
    # What is wrong with each pod, in order: its containers that died, then
    # that it isn't ready.
    problems: >-
      pods.map(p,
        p.containers
          .filter(c, c.lastTermination != null && c.lastTermination.reason != "Completed")
          .map(c, "pod " + p.name + " of revision " + prior.revision + ": " + c.name + " " + c.lastTermination.reason)
        + (p.ready ? [] : ["pod " + p.name + " of revision " + prior.revision + " is not ready"])
      ).flatten()
    record: revision_health.revisions.filter(r, r.revision == prior.revision)
  answers:
    - when: current == null
      answer: unknown
      reason: the current revision is unknown
    - when: prior == null
      answer: false
      reason: ${rollout_history.deployment.name} has no earlier revision to roll back to
      cite: [ids.rollout_history]
    - when: size(problems) > 0
      answer: false
      reason: ${problems[0]}
      cite: [ids.rollout_history, ids.pod_states]
    - when: size(pods) > 0
      answer: true
      reason: ${size(pods)} pods of revision ${prior.revision} are ready and never failed
      cite: [ids.rollout_history, ids.pod_states]
    # Its pods are gone: from here, Themis's own record, then the metrics
    # history, tells.
    - when: themis_fix != null && themis_fix.replaced == prior.revision && size(themis_fix.found) > 0
      answer: false
      reason: "revision ${prior.revision} failed before Themis's fix on incident ${themis_fix.incident} replaced it: ${themis_fix.found[0].reason}"
      cite: [ids.rollout_history, themis_fix.id]
    - when: size(record) == 0 || record[0].seenFrom == null
      answer: unknown
      reason: revision ${prior.revision} has no pods left, and the metrics history has none of them
      cite: [ids.revision_health]
    - when: record[0].firstOOMKillAt != null
      answer: false
      reason: >-
        containers of revision ${prior.revision} were OOMKilled while it ran, first at
        ${record[0].firstOOMKillAt}, in ${record[0].source}'s history
      cite: [ids.rollout_history, ids.revision_health]
    - when: record[0].firstRestartAt != null
      answer: false
      reason: >-
        containers of revision ${prior.revision} restarted ${string(record[0].restarts)} times while it
        ran, first at ${record[0].firstRestartAt}, in ${record[0].source}'s history
      cite: [ids.rollout_history, ids.revision_health]
    - answer: true
      reason: >-
        revision ${prior.revision} ran ${record[0].seenUntil - record[0].seenFrom} with no restart or
        OOM kill, from ${record[0].seenFrom} to ${record[0].seenUntil}, in ${record[0].source}'s history
      cite: [ids.rollout_history, ids.revision_health]

# The latest rollout changed what the pods run: their containers, volumes or
# other pod settings, which a rollback to the revision before it undoes. One
# that changed only the pod template's labels and annotations, as kubectl
# rollout restart does, changed nothing they run: a rollback would restart
# them the same way, reading the same config. A Deployment's first revision
# replaced none.
- name: rollout_changed_the_app
  version: "1"
  description: The latest rollout changed what the pods run
  topic: What the rollout changed
  whenFalse: The latest rollout changed nothing the pods run
  reads: [rollout_history]
  let:
    change: rollout_history.change
    more: >-
      size(change.app) > 1 ? ", and " + string(size(change.app) - 1) + " other change" + (size(change.app) > 2 ? "s" : "") : ""
    others: >-
      size(change.metadata) > 1 ? ", and " + string(size(change.metadata) - 1) + " other label or annotation" + (size(change.metadata) > 2 ? "s" : "") : ""
  answers:
    - when: current == null
      answer: unknown
      reason: the current revision is unknown
    - when: prior == null
      answer: false
      reason: there is no revision before revision ${current.revision}, so no rollout changed what its pods run
      cite: [ids.rollout_history]
    - when: change == null || change.from != prior.revision
      answer: unknown
      reason: the rollout history doesn't say what revision ${current.revision} changed from revision ${prior.revision}
      cite: [ids.rollout_history]
    - when: size(change.app) > 0
      answer: true
      reason: revision ${current.revision} changed what its pods run (${change.app[0]}${more})
      cite: [ids.rollout_history]
    - when: size(change.metadata) > 0
      answer: false
      reason: revision ${current.revision} changed only its pods' labels and annotations (${change.metadata[0]}${others}), nothing they run
      cite: [ids.rollout_history]
    - answer: false
      reason: revisions ${prior.revision} and ${current.revision} have the same pod template
      cite: [ids.rollout_history]

# The failures came with the latest rollout: it changed what the pods run,
# and the new version does worse than the one before it. A rollout that
# changed only labels and annotations, such as a restart, can't have brought
# them: a rollback would undo nothing they run. Otherwise the version before
# it must run without failing where the current one fails: its pods show
# that while they run healthy beside the failing ones, and the metrics
# history while they ran on past the current one's first failure. Once they
# are gone, Themis's own record shows the version before failed when the
# current one is the fix Themis made for it; the metrics history shows
# whether it failed while it ran; and, for OOM kills, it compares how much of
# its memory limit each version used over the same time since it started.
# The current version using clearly more than the one before did then, and
# than it did in its last that long, brought the kills. Using no more than
# either, the version before would run out too: what changed since, such as
# more data or load, brought them. Only without those figures, or for
# failures other than OOM kills, does how long each ran without failing
# decide, as a tiebreak: the version before ran without failing for longer
# than the current one did before its first failure.
- name: failures_came_with_rollout
  version: "2"
  description: The failures came with the latest rollout, where the version before it ran without failing
  topic: Whether the rollout brought the failures
  whenFalse: The failures didn't come with the latest rollout
  reads: [rollout_history, pod_states, revision_health]
  let:
    change: rollout_history.change
    pods: pod_states.pods.filter(p, p.revision == prior.revision)
    problems: >-
      pods.map(p,
        p.containers
          .filter(c, c.lastTermination != null && c.lastTermination.reason != "Completed")
          .map(c, "pod " + p.name + " of revision " + prior.revision + ": " + c.name + " " + c.lastTermination.reason)
        + (p.ready ? [] : ["pod " + p.name + " of revision " + prior.revision + " is not ready"])
      ).flatten()
    failing: >-
      pod_states.pods.exists(p, p.revision == current_revision &&
        (!p.ready || p.containers.exists(c, c.restartCount > 0)))
    earlier: revision_health.revisions.filter(r, r.revision == prior.revision)
    latest: revision_health.revisions.filter(r, r.revision == current.revision)
    # The current revision's first failure: the earliest the metrics history
    # or the pods' status dates.
    dated: >-
      ((size(latest) > 0 ? [latest[0].firstRestartAt, latest[0].firstOOMKillAt] : [])
        + (first_failure != null ? [first_failure.at] : [])).filter(t, t != null).sort()
    ran: dated[0] - rollout_at
    seen: earlier[0].seenUntil - earlier[0].seenFrom
    # The current revision's containers were OOMKilled.
    oom: >-
      pod_states.pods.exists(p, p.revision == current_revision &&
        p.containers.exists(c, [c.state, c.lastTermination].exists(s, s != null && s.reason == "OOMKilled")))
      || (size(latest) > 0 && latest[0].oomKilled > 0)
    # How much of its memory limit each version used on average over the
    # same time since it started: the container of the current revision that
    # used the most of its limit, and that container in the one before, over
    # its first and its last that long.
    measured: >-
      size(latest) > 0 ? latest[0].memory.filter(u, u.first != null) : []
    top: measured.filter(u, measured.all(o, o.first <= u.first))
    then: >-
      size(top) > 0 && size(earlier) > 0 ?
        earlier[0].memory.filter(u, u.container == top[0].container && (u.first != null || u.last != null)) : []
    # Measurement noise, not a decision: two averages of the same use
    # differ by a few hundredths of the limit, from where the samples fall.
    # Within it, two versions use the same.
    noise: "0.05"
    now_use: top[0].first
    at_start: then[0].first
    at_end: then[0].last
    worse: >-
      (at_start == null || now_use > at_start + noise) &&
      (at_end == null || now_use > at_end + noise)
    # Each share as a percentage: now, at the start and at the end, and the
    # noise.
    pct: >-
      [now_use, at_start, at_end, noise].map(v, v == null ? "" : string(int(v * 100.0 + 0.5)) + "%")
    age: revision_health.comparedAge
    compared: >-
      top[0].container + " used " + pct[0] + " of its memory limit on average in revision " + current.revision +
      "'s first " + age + ", against " +
      (at_start != null ? pct[1] + " in revision " + prior.revision + "'s first " + age : "") +
      (at_start != null && at_end != null ? " and " : "") +
      (at_end != null ? pct[2] + " in " + (at_start != null ? "its" : "revision " + prior.revision + "'s") + " last " + age : "") +
      ", in " + earlier[0].source + "'s history"
  answers:
    - when: current == null
      answer: unknown
      reason: the current revision is unknown
    - when: prior == null
      answer: false
      reason: there is no revision before revision ${current.revision}, so no rollout brought the failures
      cite: [ids.rollout_history]
    - when: change == null || change.from != prior.revision
      answer: unknown
      reason: the rollout history doesn't say what revision ${current.revision} changed from revision ${prior.revision}
      cite: [ids.rollout_history]
    - when: size(change.app) == 0
      answer: false
      reason: >-
        revision ${current.revision} changed nothing its pods run${size(change.metadata) > 0 ? ", only their labels and annotations (" + change.metadata[0] + ")" : ""},
        so the version before it runs the same and the rollout didn't bring the failures
      cite: [ids.rollout_history]
    - when: "!failing"
      answer: unknown
      reason: every pod of revision ${current_revision} is ready and none restarted
      cite: [ids.pod_states]
    - when: size(problems) > 0
      answer: false
      reason: the version before it fails too (${problems[0]})
      cite: [ids.rollout_history, ids.pod_states]
    - when: size(pods) > 0
      answer: true
      reason: >-
        revision ${current.revision} changed what its pods run (${change.app[0]}), and ${size(pods)} pods of
        revision ${prior.revision} run without failing while revision ${current.revision} fails
      cite: [ids.rollout_history, ids.pod_states]
    # Its pods are gone: from here, Themis's own record, then the metrics
    # history, tells.
    - when: themis_fix != null && themis_fix.replaced == prior.revision && size(themis_fix.found) > 0
      answer: false
      reason: >-
        the version before it failed too: revision ${prior.revision} failed before Themis's fix on
        incident ${themis_fix.incident} replaced it (${themis_fix.found[0].reason})
      cite: [ids.rollout_history, themis_fix.id]
    - when: size(earlier) == 0 || earlier[0].seenFrom == null
      answer: unknown
      reason: revision ${prior.revision} has no pods left, and the metrics history has none of them
      cite: [ids.revision_health]
    - when: earlier[0].firstOOMKillAt != null
      answer: false
      reason: >-
        the version before it failed too: containers of revision ${prior.revision} were OOMKilled
        while it ran, first at ${earlier[0].firstOOMKillAt}, in ${earlier[0].source}'s history
      cite: [ids.rollout_history, ids.revision_health]
    - when: earlier[0].firstRestartAt != null
      answer: false
      reason: >-
        the version before it failed too: containers of revision ${prior.revision} restarted
        ${string(earlier[0].restarts)} times while it ran, first at ${earlier[0].firstRestartAt},
        in ${earlier[0].source}'s history
      cite: [ids.rollout_history, ids.revision_health]
    - when: rollout_at == null
      answer: unknown
      reason: the rollout time is unknown
    - when: size(dated) == 0
      answer: unknown
      reason: no failure of revision ${current.revision} has a time
      cite: [ids.pod_states, ids.revision_health]
    - when: dated[0] < rollout_at
      answer: false
      reason: a failure at ${dated[0]} predates revision ${current.revision} at ${rollout_at}
      cite: [ids.rollout_history, ids.pod_states, ids.revision_health]
    - when: earlier[0].seenUntil >= dated[0]
      answer: true
      reason: >-
        revision ${current.revision} changed what its pods run (${change.app[0]}), and pods of revision
        ${prior.revision} ran without failing until ${earlier[0].seenUntil}, after revision ${current.revision}
        first failed at ${dated[0]}
      cite: [ids.rollout_history, ids.pod_states, ids.revision_health]
    # OOM kills: how much of its memory limit each version used at the same
    # age decides.
    - when: oom && size(then) > 0 && worse
      answer: true
      reason: >-
        revision ${current.revision} changed what its pods run (${change.app[0]}), and uses more of its memory limit
        than revision ${prior.revision} did, by more than measurement noise (${pct[3]} of the limit): ${compared}
      cite: [ids.rollout_history, ids.pod_states, ids.revision_health]
    - when: oom && size(then) > 0 && at_start != null && now_use <= at_start + noise
      answer: false
      reason: >-
        revision ${current.revision} uses as much of its memory limit as revision ${prior.revision} did at the same
        age, within measurement noise (${pct[3]} of the limit): ${compared}, so more demand since brought the kills
      cite: [ids.rollout_history, ids.pod_states, ids.revision_health]
    - when: oom && size(then) > 0
      answer: false
      reason: >-
        revision ${prior.revision} had come to use as much of its memory limit before the rollout, within measurement
        noise (${pct[3]} of the limit): ${compared}, so demand grew before the rollout
      cite: [ids.rollout_history, ids.pod_states, ids.revision_health]
    # Without those figures, or for other failures, how long each ran
    # without failing breaks the tie.
    - when: ran < seen
      answer: true
      reason: >-
        revision ${current.revision} changed what its pods run (${change.app[0]}), and first failed ${ran} after its
        rollout; revision ${prior.revision} ran ${seen} without failing, in ${earlier[0].source}'s history
      cite: [ids.rollout_history, ids.pod_states, ids.revision_health]
    - answer: false
      reason: >-
        revision ${current.revision} ran ${ran} before its first failure, at least as long as
        revision ${prior.revision} ran without failing (${seen}, in ${earlier[0].source}'s history), so what
        changed since brought the failures
      cite: [ids.rollout_history, ids.pod_states, ids.revision_health]

# The target carries GitOps markers or is written by a GitOps controller.
- name: gitops_managed
  version: "1"
  description: Managed by GitOps (Argo CD or Flux)
  topic: GitOps management
  whenFalse: Not managed by Argo CD or Flux
  reads: [rollout_history]
  let:
    markers: rollout_history.deployment.ownershipMarkers.map(k, k).sort()
    managers: >-
      rollout_history.deployment.fieldManagers.filter(m, m in
        ["argocd-controller", "argocd-application-controller", "kustomize-controller", "helm-controller"])
  answers:
    - when: size(markers) > 0
      answer: true
      reason: the target carries ${markers[0]}
      cite: [ids.rollout_history]
    - when: size(managers) > 0
      answer: true
      reason: the target is managed by ${managers[0]}
      cite: [ids.rollout_history]
    - answer: false
      reason: no GitOps markers or managers
      cite: [ids.rollout_history]

# Some evidence holds text that looks written for the investigator rather
# than by the workload: instructions, Themis or a tool impersonated, an order
# to make a fix. It reads whatever evidence there is, so it is never unknown.
- name: evidence_has_instructions
  version: "1"
  description: Some evidence contains text that looks like instructions or forged tool output
  topic: Text addressed to Themis
  whenFalse: No evidence contains text that looks like instructions or forged tool output
  reads: [target_events, container_logs_tail, referenced_config, pod_states]
  answers:
    - when: size(suspicious_evidence) > 0
      answer: true
      reason: ${suspicious_evidence[0].template} holds ${suspicious_evidence[0].reason}
      cite:
        - suspicious_evidence.map(s, s.id)
    - answer: false
      reason: no evidence holds text that looks like instructions or forged tool output
