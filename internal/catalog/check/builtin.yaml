# Themis's own checks: every scenario pack's profile may name them, and
# Themis runs gitops_managed for every incident with a fix on offer, since its
# answer decides whether Themis may change the workload at all.
# evidence_has_instructions is there for policy rules to read; no pack runs
# it, and governance decides it again over all the incident's evidence.
# docs/checks.md says what each field means and what the expressions see.

# The current revision replaced an earlier one within the last 6 hours. A
# Deployment's first revision replaced none: creating it isn't a rollout. A
# rollout that was Themis's own fix says so: it brought no new version.
- name: rollout_recent
  version: "3"
  description: A rollout happened recently
  topic: Recent rollout
  whenFalse: No recent rollout
  reads: [rollout_history]
  answers:
    - when: rollout_at == null
      answer: unknown
      reason: the current revision or its rollout time is unknown
    - when: prior == null
      answer: false
      reason: there is no revision before revision ${current.revision}, so no rollout replaced one
      cite: [ids.rollout_history]
    - when: themis_fix != null && now - rollout_at <= duration("6h")
      answer: true
      reason: revision ${current.revision} rolled out ${now - rollout_at} ago, as Themis's fix on incident ${themis_fix.incident}
      cite: [ids.rollout_history, themis_fix.id]
    - when: now - rollout_at <= duration("6h")
      answer: true
      reason: revision ${current.revision} rolled out ${now - rollout_at} ago
      cite: [ids.rollout_history]
    - answer: false
      reason: revision ${current.revision} rolled out ${now - rollout_at} ago, beyond ${duration("6h")}
      cite: [ids.rollout_history]

# The revision before the current one runs ready pods that never failed: a
# version to go back to. Without an earlier revision there is none, and one
# whose pods failed is no better. Once its pods are gone, Themis's own record
# tells when the current revision is its fix: the incident it fixed found
# the revision before failing.
- name: earlier_revision_healthy
  version: "2"
  description: The version before it is healthy, to go back to
  topic: Health of the version before it
  whenFalse: No healthy earlier version to go back to
  reads: [rollout_history, pod_states]
  let:
    pods: pod_states.pods.filter(p, p.revision == prior.revision)
    # What is wrong with each pod, in order: its containers that died, then
    # that it isn't ready.
    problems: >-
      pods.map(p,
        p.containers
          .filter(c, c.lastTermination != null && c.lastTermination.reason != "Completed")
          .map(c, "pod " + p.name + " of revision " + prior.revision + ": " + c.name + " " + c.lastTermination.reason)
        + (p.ready ? [] : ["pod " + p.name + " of revision " + prior.revision + " is not ready"])
      ).flatten()
  answers:
    - when: current == null
      answer: unknown
      reason: the current revision is unknown
    - when: prior == null
      answer: false
      reason: ${rollout_history.deployment.name} has no earlier revision to roll back to
      cite: [ids.rollout_history]
    - when: size(problems) > 0
      answer: false
      reason: ${problems[0]}
      cite: [ids.rollout_history, ids.pod_states]
    - when: >-
        size(pods) == 0 && themis_fix != null && themis_fix.replaced == prior.revision &&
        size(themis_fix.found) > 0
      answer: false
      reason: "revision ${prior.revision} failed before Themis's fix on incident ${themis_fix.incident} replaced it: ${themis_fix.found[0].reason}"
      cite: [ids.rollout_history, themis_fix.id]
    - when: size(pods) == 0
      answer: unknown
      reason: revision ${prior.revision} has no pods left to judge
    - answer: true
      reason: ${size(pods)} pods of revision ${prior.revision} are ready and never failed
      cite: [ids.rollout_history, ids.pod_states]

# The target carries GitOps markers or is written by a GitOps controller.
- name: gitops_managed
  version: "1"
  description: Managed by GitOps (Argo CD or Flux)
  topic: GitOps management
  whenFalse: Not managed by Argo CD or Flux
  reads: [rollout_history]
  let:
    markers: rollout_history.deployment.ownershipMarkers.map(k, k).sort()
    managers: >-
      rollout_history.deployment.fieldManagers.filter(m, m in
        ["argocd-controller", "argocd-application-controller", "kustomize-controller", "helm-controller"])
  answers:
    - when: size(markers) > 0
      answer: true
      reason: the target carries ${markers[0]}
      cite: [ids.rollout_history]
    - when: size(managers) > 0
      answer: true
      reason: the target is managed by ${managers[0]}
      cite: [ids.rollout_history]
    - answer: false
      reason: no GitOps markers or managers
      cite: [ids.rollout_history]

# Some evidence holds text that looks written for the investigator rather
# than by the workload: instructions, Themis or a tool impersonated, an order
# to make a fix. It reads whatever evidence there is, so it is never unknown.
- name: evidence_has_instructions
  version: "1"
  description: Some evidence contains text that looks like instructions or forged tool output
  topic: Text addressed to Themis
  whenFalse: No evidence contains text that looks like instructions or forged tool output
  reads: [target_events, container_logs_tail, referenced_config, pod_states]
  answers:
    - when: size(suspicious_evidence) > 0
      answer: true
      reason: ${suspicious_evidence[0].template} holds ${suspicious_evidence[0].reason}
      cite:
        - suspicious_evidence.map(s, s.id)
    - answer: false
      reason: no evidence holds text that looks like instructions or forged tool output
