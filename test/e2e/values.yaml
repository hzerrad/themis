# Themis for the end-to-end test: the executor on, the fake model, a webhook
# receiver, and windows short enough to wait for.
# The images the test builds and loads into kind.
image:
  repository: ""
  tag: dev
  pullPolicy: IfNotPresent
enrolledNamespaces: [shop]
executor:
  enabled: true
model:
  baseURL: http://fake-model.themis.svc:8080/v1
  name: fake
notifications:
  webhookSecret: e2e-webhook
  webhookToken: true
profiles:
  - name: rollout-regression
    priority: 100
    match:
      alertNames: [KubePodCrashLooping, KubeDeploymentReplicasMismatch, KubePodOOMKilled]
      targetKinds: [Deployment.apps]
    evidence:
      initial: [rollout_history, pod_states, target_events, referenced_config]
      allowed: [rollout_history, pod_states, target_events, referenced_config, container_logs_tail]
    capabilities: [deployment.rollback-to-revision]
    justifiedBy:
      deployment.rollback-to-revision: [failure_onset_after_rollout]
    policy:
      mode: guarded
      rules:
        # Themis has no metrics source here: whether the rollout changed
        # what checkout runs is read from the live ReplicaSets.
        - name: rollback-needs-a-bad-rollout
          when: >-
            action.restore != "true" &&
            (predicates.failure_onset_after_rollout != "true" ||
             predicates.rollout_changed_the_app != "true" ||
             predicates.config_changed_before_failure != "false" ||
             (predicates.oom_killed_new_revision != "true" &&
              predicates.earlier_revision_healthy != "true"))
          decision: deny
        - name: rollback-needs-approval
          when: action.capability == "deployment.rollback-to-revision" && action.restore != "true"
          decision: require_approval
    verification:
      window: 3m
      stability: 45s
