# Scenario 1, bad rollout: the cluster as the Deployment controller and the
# kubelet would leave it.
#
# checkout runs 3 replicas. Revision 2 lowered the memory limit; its first pod
# is OOMKilled on every start, so the rollout is stuck (maxUnavailable: 0
# keeps the 3 revision-1 pods serving). A cart pod in the same namespace must
# not be mistaken for a checkout pod.
#
# Load with kubetest.Env.Load: owner references are linked by kind and name,
# and the namespace and creation timestamps are set at load time.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  labels:
    app: checkout
  annotations:
    deployment.kubernetes.io/revision: "2"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: checkout
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: checkout
    spec:
      containers:
        - name: app
          image: example/checkout:2.4.0
          env:
            - name: DB_PASSWORD
              value: fixture-s3cr3t-do-not-leak
          resources:
            limits:
              memory: 64Mi
status:
  observedGeneration: 1
  replicas: 4
  updatedReplicas: 1
  readyReplicas: 3
  availableReplicas: 3
  unavailableReplicas: 1
  conditions:
    - type: Available
      status: "True"
      reason: MinimumReplicasAvailable
      lastUpdateTime: "2026-10-20T08:00:14Z"
      lastTransitionTime: "2026-10-20T08:00:14Z"
    - type: Progressing
      status: "False"
      reason: ProgressDeadlineExceeded
      message: ReplicaSet "checkout-7d9f8b6c4" has timed out progressing.
      lastUpdateTime: "2026-10-27T09:10:00Z"
      lastTransitionTime: "2026-10-27T09:10:00Z"
---
apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: checkout-5c6a1e2f3
  labels:
    app: checkout
    pod-template-hash: 5c6a1e2f3
  annotations:
    deployment.kubernetes.io/revision: "1"
  ownerReferences:
    - apiVersion: apps/v1
      kind: Deployment
      name: checkout
      controller: true
      blockOwnerDeletion: true
spec:
  replicas: 3
  selector:
    matchLabels:
      app: checkout
      pod-template-hash: 5c6a1e2f3
  template:
    metadata:
      labels:
        app: checkout
        pod-template-hash: 5c6a1e2f3
    spec:
      containers:
        - name: app
          image: example/checkout:2.3.1
          env:
            - name: DB_PASSWORD
              value: fixture-s3cr3t-do-not-leak
          resources:
            limits:
              memory: 256Mi
status:
  replicas: 3
  fullyLabeledReplicas: 3
  readyReplicas: 3
  availableReplicas: 3
