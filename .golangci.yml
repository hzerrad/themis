version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - exhaustive
    - gochecksumtype
    - gosec
    - misspell
    - noctx
    - sloglint
  settings:
    exhaustive:
      default-signifies-exhaustive: false
    sloglint:
      context: scope
      static-msg: true
      key-naming-case: snake
  exclusions:
    generated: strict
    paths:
      - gen/

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/hzerrad/themis
