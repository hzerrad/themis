syntax = "proto3";

package themis.v1;

import "themis/v1/common.proto";

message CollectEvidenceRequest {
  string lease_id = 1;
  string template = 2;
  map<string, string> params = 3;
}

message CollectEvidenceResponse {
  repeated EvidenceItem items = 1;
  repeated CollectionFailure failures = 2;
  optional int32 remaining_requests = 3;
}

service EvidenceService {
  rpc CollectEvidence(CollectEvidenceRequest) returns (CollectEvidenceResponse);
}
