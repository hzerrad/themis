syntax = "proto3";

package themis.v1;

import "themis/v1/common.proto";

service ProposalService {
  rpc SubmitProposal(SubmitProposalRequest) returns (SubmitProposalResponse);

  // For callers outside Themis: the incidents they may suggest a fix for, and
  // what Themis knows about one.
  rpc ListIncidents(ListIncidentsRequest) returns (ListIncidentsResponse);
  rpc GetIncident(GetIncidentRequest) returns (GetIncidentResponse);
}

message SubmitProposalRequest {
  reserved 4, 5;

  string lease_id = 1;
  string client_proposal_id = 2;
  TargetRef target = 3;
  string expected_effect = 6;
  string rationale = 7;
  repeated string cited_evidence_ids = 8;
  repeated string cited_predicates = 9;
  Provenance provenance = 10;

  oneof capability {
    RollbackToRevisionParams rollback_to_revision = 11;
  }

  // Set instead of lease_id by a caller outside Themis.
  string incident_id = 12;
}

message RollbackToRevisionParams {
  int64 revision = 1;
}

message SubmitProposalResponse {
  string proposal_id = 1;
  ProposalStatus status = 2;
  RejectionReason rejection_reason = 3;
  string message = 4;
}

message ListIncidentsRequest {}

message ListIncidentsResponse {
  repeated OpenIncident incidents = 1;
}

message OpenIncident {
  string id = 1;
  TargetRef target = 2;
  string state = 3;
}

message GetIncidentRequest {
  string incident_id = 1;
}

message GetIncidentResponse {
  OpenIncident incident = 1;
  repeated EvidenceItem evidence = 2;
  repeated PredicateResult predicates = 3;
  // How many items this caller may not see.
  int32 withheld = 4;
}

enum ProposalStatus {
  PROPOSAL_STATUS_UNSPECIFIED = 0;
  PROPOSAL_STATUS_ACCEPTED = 1;
  PROPOSAL_STATUS_REJECTED = 2;
}

enum RejectionReason {
  REJECTION_REASON_UNSPECIFIED = 0;
  REJECTION_REASON_TARGET_MISMATCH = 1;
  REJECTION_REASON_CAPABILITY_NOT_ALLOWED = 2;
  REJECTION_REASON_INVALID_PARAMS = 3;
  REJECTION_REASON_UNKNOWN_EVIDENCE = 4;
  REJECTION_REASON_UNKNOWN_PREDICATE = 5;
  REJECTION_REASON_OUT_OF_SCOPE = 6;
  REJECTION_REASON_INCIDENT_CLOSED = 7;
}
