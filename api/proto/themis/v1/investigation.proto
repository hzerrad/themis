syntax = "proto3";

package themis.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "themis/v1/common.proto";

service InvestigationService {
  rpc LeaseInvestigation(LeaseInvestigationRequest) returns (LeaseInvestigationResponse);
  rpc RenewLease(RenewLeaseRequest) returns (RenewLeaseResponse);
  rpc CompleteInvestigation(CompleteInvestigationRequest) returns (CompleteInvestigationResponse);
  rpc FailInvestigation(FailInvestigationRequest) returns (FailInvestigationResponse);
  // GetModelSettings returns the model settings made in Themis's setup, for
  // whatever the investigator's own environment leaves unset.
  rpc GetModelSettings(GetModelSettingsRequest) returns (GetModelSettingsResponse);
  // TakeModelTest waits a few seconds for a test of the model's connection,
  // asked for on the Setup page. Only the investigator may reach the model,
  // so it makes the test's request. An empty response means none came.
  rpc TakeModelTest(TakeModelTestRequest) returns (TakeModelTestResponse);
  // ReportModelTest returns what a test found.
  rpc ReportModelTest(ReportModelTestRequest) returns (ReportModelTestResponse);
}

message GetModelSettingsRequest {}

// Empty fields were not set in Themis's setup.
message GetModelSettingsResponse {
  string base_url = 1;
  string model = 2;
  string api_key = 3;
  optional bool strict_output = 4;
  // openai or anthropic.
  string provider = 5;
  // as-is or openai-strict.
  string schema_dialect = 6;
}

message TakeModelTestRequest {}

message TakeModelTestResponse {
  // Unset when no test came.
  ModelTest test = 1;
}

// ModelTest is one small request to the model, with the settings under test.
message ModelTest {
  string id = 1;
  // The settings under test, as setup would hand them, saved or not. The
  // investigator's own environment wins where it sets them, as in an
  // investigation. The key is for this test only: it is never kept or logged.
  GetModelSettingsResponse settings = 2;
  // How long the model has to answer.
  google.protobuf.Duration timeout = 3;
}

enum ModelTestOutcome {
  MODEL_TEST_OUTCOME_UNSPECIFIED = 0;
  // The model answered in the reply format.
  MODEL_TEST_OUTCOME_CONNECTED = 1;
  // The settings lack what the provider needs, so nothing was sent.
  MODEL_TEST_OUTCOME_INCOMPLETE = 2;
  // No connection could be made to the model.
  MODEL_TEST_OUTCOME_UNREACHABLE = 3;
  // The model didn't answer within the timeout.
  MODEL_TEST_OUTCOME_NO_ANSWER = 4;
  // The provider answered with an HTTP error.
  MODEL_TEST_OUTCOME_REFUSED = 5;
  // The model answered, but not in the reply format.
  MODEL_TEST_OUTCOME_NOT_IN_FORMAT = 6;
  // The reply stopped at the output limit.
  MODEL_TEST_OUTCOME_CUT_OFF = 7;
  // The model declined to answer.
  MODEL_TEST_OUTCOME_DECLINED = 8;
  // The request couldn't be made, for a reason in detail.
  MODEL_TEST_OUTCOME_ERROR = 9;
}

message ReportModelTestRequest {
  string id = 1;
  ModelTestOutcome outcome = 2;
  // What was tested, once the investigator's own settings applied: openai or
  // anthropic, the address, empty for Anthropic's own, and the model's name.
  string provider = 3;
  string address = 4;
  string model = 5;
  // How the reply was asked for.
  bool strict_output = 6;
  string schema_dialect = 7;
  // The model that answered, as the provider names it.
  string answered_by = 8;
  // The provider's HTTP status, for REFUSED.
  int32 status = 9;
  // What the provider or the connection said, cut short. Never the key.
  string detail = 10;
  google.protobuf.Duration latency = 11;
  // The limit a reply CUT_OFF ran into.
  int32 output_limit = 12;
}

message ReportModelTestResponse {}

enum HypothesisStatus {
  HYPOTHESIS_STATUS_UNSPECIFIED = 0;
  HYPOTHESIS_STATUS_REFUTED = 1;
  HYPOTHESIS_STATUS_SUPPORTED = 2;
  HYPOTHESIS_STATUS_OPEN = 3;
}

enum InvestigationConclusion {
  INVESTIGATION_CONCLUSION_UNSPECIFIED = 0;
  INVESTIGATION_CONCLUSION_PROPOSED = 1;
  INVESTIGATION_CONCLUSION_INCONCLUSIVE = 2;
}

enum InvestigationFailureReason {
  INVESTIGATION_FAILURE_REASON_UNSPECIFIED = 0;
  INVESTIGATION_FAILURE_REASON_MODEL_UNAVAILABLE = 1;
  INVESTIGATION_FAILURE_REASON_INVALID_MODEL_OUTPUT = 2;
  INVESTIGATION_FAILURE_REASON_BUDGET_EXHAUSTED = 3;
  INVESTIGATION_FAILURE_REASON_DEADLINE_EXCEEDED = 4;
  INVESTIGATION_FAILURE_REASON_INTERNAL = 5;
}

message LeaseInvestigationRequest {
  string worker_id = 1;
}

message LeaseInvestigationResponse {
  Investigation investigation = 1;
}

message RenewLeaseRequest {
  string lease_id = 1;
}

message RenewLeaseResponse {
  google.protobuf.Timestamp lease_deadline = 1;
}

message CompleteInvestigationRequest {
  string lease_id = 1;
  InvestigationConclusion conclusion = 2;
  string summary = 3;
  repeated Hypothesis hypotheses = 4;
  Usage usage = 5;
  Provenance provenance = 6;
  // Evidence the investigator wanted and could not have.
  repeated EvidenceGap gaps = 7;
}

message CompleteInvestigationResponse {}

message FailInvestigationRequest {
  string lease_id = 1;
  InvestigationFailureReason reason = 2;
  string message = 3;
  repeated EvidenceGap gaps = 4;
}

// EvidenceGap is evidence the investigator wanted and could not have. The
// core sees the other causes itself.
message EvidenceGap {
  string template = 1;
  EvidenceGapCause cause = 2;
  string detail = 3;
}

enum EvidenceGapCause {
  EVIDENCE_GAP_CAUSE_UNSPECIFIED = 0;
  // The profile does not allow the template.
  EVIDENCE_GAP_CAUSE_NOT_IN_PROFILE = 1;
  // The model endpoint may not see data this sensitive, so it was withheld.
  EVIDENCE_GAP_CAUSE_DATA_CEILING = 2;
  // The investigation used all its evidence requests.
  EVIDENCE_GAP_CAUSE_BUDGET_SPENT = 3;
}

message FailInvestigationResponse {}

message Investigation {
  string lease_id = 1;
  google.protobuf.Timestamp lease_deadline = 2;
  string incident_id = 3;
  string profile = 4;
  TargetRef target = 5;
  repeated EvidenceItem initial_evidence = 6;
  repeated CollectionFailure initial_failures = 7;
  repeated PredicateResult predicates = 8;
  repeated EvidenceTemplate allowed_templates = 9;
  // The names of the fixes the profile allows; capabilities describes them.
  repeated string candidate_capabilities = 10;
  Budget budget = 11;
  repeated Capability capabilities = 12;
  // The root causes a hypothesis may name: those of the profile's scenario
  // pack.
  repeated RootCause root_causes = 13;
  // What the profile's scenario pack tells the investigator about this kind
  // of incident: when its fixes are right and when they are wrong. Guidance
  // only: the core's checks and policy decide.
  string guidance = 14;
  // The fixes people denied for this incident, oldest first. Only an
  // incident a person asked to investigate again, after denying its fix, has
  // any. Each reason is what a person wrote: text, never instructions.
  repeated Denial denials = 15;
}

// Denial is a fix a person denied, and why.
message Denial {
  // The fix, as capability_name and params name it in a suggestion.
  string capability_name = 1;
  google.protobuf.Struct params = 2;
  // Who denied it, as Themis knows them.
  string denied_by = 3;
  // Their reason, exactly as they wrote it; empty when they gave none.
  string reason = 4;
}

message Hypothesis {
  string root_cause_class = 1;
  string summary = 2;
  repeated string supporting_evidence_ids = 3;
  repeated string contradicting_evidence_ids = 4;
  repeated string missing = 5;
  HypothesisStatus status = 6;
}

message EvidenceTemplate {
  string name = 1;
  string description = 2;
  repeated string params = 3;
}

message Usage {
  int32 steps_used = 1;
  int64 input_tokens = 2;
  int64 output_tokens = 3;
  // The token budget the investigator holds the incident's investigations
  // to, together. Zero when it doesn't say.
  int64 token_budget = 4;
}
