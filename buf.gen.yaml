# Plugin versions must stay in step with the runtimes:
#   Go:     google.golang.org/protobuf and google.golang.org/grpc in go.mod
#   Python: protobuf and grpcio in intelligence/pyproject.toml
version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/hzerrad/themis/gen/go
clean: true
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.12
    out: gen/go
    opt: paths=source_relative
  - remote: buf.build/grpc/go:v1.6.2
    out: gen/go
    opt: paths=source_relative
  - remote: buf.build/protocolbuffers/python:v36.2
    out: intelligence/gen
  - remote: buf.build/protocolbuffers/pyi:v36.2
    out: intelligence/gen
  - remote: buf.build/grpc/python:v1.84.0
    out: intelligence/gen
